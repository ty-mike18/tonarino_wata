、鶏ガラ、ごま油数滴","r":"レタスは最後にちぎって入れ、シャキッと感を残す。"},{"n":"豚ときのこの酒粕味噌スープ","s":3,"t":["汁物","肉"],"d":["niku"],"v":{"主菜":1,"副菜":0.5},"k":200,"m":[12,1,2],"i":"豚こま40g、しめじ、酒粕20g、味噌小さじ1.5、だし250ml","r":"豚汁と粕汁のいいとこ取り。発酵の重ね技で深い味。"},{"n":"冬瓜と鶏のとろみ汁","s":3,"t":["汁物","肉"],"d":["niku"],"v":{"主菜":0.5,"副菜":1},"k":100,"m":[7,8,9],"i":"冬瓜100g、鶏ひき肉30g、生姜、白だし、片栗粉","r":"透き通った冬瓜が涼を呼ぶ。冷やしても美味しい夏の椀。"},{"n":"納豆汁","s":3,"t":["汁物","大豆"],"d":["daizu"],"v":{"主菜":1},"k":130,"m":[12,1,2],"i":"ひきわり納豆1/2パック、絹豆腐50g、味噌小さじ1.5、だし200ml、小ねぎ","r":"たたいた納豆を味噌汁に溶く東北の冬の郷土食。とろみで冷めない。"},{"n":"焼きねぎと油揚げの味噌汁","s":3,"t":["汁物","大豆"],"d":["daizu"],"v":{"副菜":0.5},"k":90,"m":[11,12,1,2],"i":"長ねぎ1/2本、油揚げ1/4枚、味噌小さじ2、だし200ml","r":"ねぎを焼き付けてから煮る。甘みと香ばしさが一段上の椀。"},{"n":"エスニック風えびスープ","s":3,"t":["汁物","魚"],"d":["sakana"],"v":{"主菜":0.5,"副菜":0.5},"k":90,"i":"むきえび5尾、レモン汁小さじ1、ナンプラー小さじ1/2、鶏ガラ、パクチーまたは小ねぎ、鷹の爪","r":"酸味×辛味のトムヤム風。レモンとナンプラーだけで異国の味。"},{"n":"かぶのそぼろあんかけ椀","s":3,"t":["汁物","肉","減塩"],"d":["niku"],"v":{"主菜":0.5,"副菜":1},"k":110,"m":[11,12,1,2,3],"i":"かぶ1個、鶏ひき肉30g、白だし、片栗粉、かぶの葉","r":"とろとろに煮たかぶにそぼろあん。葉も刻んで彩りに、捨てるところなし。"},{"n":"鶏のカチャトーラ(猟師風煮込み)","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1},"k":380,"i":"鶏もも1/2枚、玉ねぎ1/4個、トマト缶150g、黒オリーブ4個、ローズマリー、白ワインまたは酒大さじ2、にんにく","r":"鶏を皮目からじっくり焼き、脂を出してから野菜とトマトで20分。オリーブの塩気が味の芯になる。「猟師風」は手元の保存食材で作る煮込みの意——冷蔵庫の残り物でも様になる思想ごと学べる料理。"},{"n":"カポナータ 甘酢仕立て","s":4,"t":["副菜"],"d":["yasai","abura"],"v":{"副菜":1.5},"k":160,"m":[7,8,9],"i":"なす1本、ズッキーニ1/2本、パプリカ1/4個、トマト1/2個、酢大さじ1、砂糖小さじ1、オリーブ油大さじ1、松の実(あれば)","r":"野菜は別々に焼いてから合わせるのがシチリア流。甘酸っぱさ(アグロドルチェ)は冷やすと締まるので、常備菜として翌日が食べ頃。ラタトゥイユとの違いは「酢」にある。"},{"n":"あさりのズッパ・ディ・ペッシェ風","s":4,"t":["主菜","魚","汁物"],"d":["sakana","yasai"],"v":{"主菜":1.5,"副菜":1},"k":240,"m":[3,4,5],"i":"あさり150g、白身魚1/2切れ、ミニトマト4個、にんにく、白ワインまたは酒50ml、オリーブ油大さじ1、パセリ","r":"にんにくオイルで魚を焼き、あさりとワインで蒸し開ける。イタリアの漁師スープの簡易版。バゲットを浸して最後の一滴まで。「スープまでが主菜」という食べ方の提案。"},{"n":"ペンネ・アラビアータ","s":4,"t":["主食"],"d":["yasai"],"v":{"主食":2,"副菜":0.5},"k":440,"i":"ペンネ80g、トマト缶150g、にんにく1片、鷹の爪1本、オリーブ油大さじ1","r":"にんにくと鷹の爪を冷たい油から弱火で——ここで辛味と香りの8割が決まる。トマトは強火で「揚げ煮」のように水分を飛ばすと、缶とは思えない濃度に。怒りんぼ(アラビアータ)の名の由来は唐辛子の辛さ。"},{"n":"大葉ジェノベーゼの冷製パスタ","s":4,"t":["主食"],"d":["abura"],"v":{"主食":2},"k":460,"m":[6,7,8],"i":"スパゲッティ(細め)80g、大葉10枚、粉チーズ大さじ1、くるみまたは松の実大さじ1、オリーブ油大さじ2、にんにく少々、塩","r":"大葉+ナッツ+チーズ+油をすり混ぜれば、バジルがなくても立派なジェノベーゼ。麺は表示+1分ゆでて氷水で締める。「ソースは和の素材で翻訳できる」と知る夏の一皿。"},{"n":"ポルペッティ(イタリアの肉団子)トマト煮","s":4,"t":["主菜","肉"],"d":["niku","yasai","gyunyu"],"v":{"主菜":2,"副菜":1},"k":400,"i":"合いびき肉100g、パン粉大さじ2(牛乳でふやかす)、粉チーズ大さじ1、トマト缶150g、にんにく、ナツメグ少々","r":"牛乳パン粉とチーズを練り込むと、冷めてもふわふわの「イタリアの おばあちゃんの味」に。焼かずにソースへ直接落として煮ると崩れず柔らかい。ナツメグひと振りが本場の香り。"},{"n":"鶏むねのサルティンボッカ風","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":320,"i":"鶏むね肉1/2枚、生ハム2枚、セージまたは大葉2枚、小麦粉、バター10g、白ワインまたは酒大さじ2","r":"そぎ切りのむね肉に生ハムと葉をはりつけ、粉をはたいてバターで焼く。サルティンボッカは「口に飛び込む」の意。生ハムの塩気で調味が完結する、ごちそう感と手軽さの黄金比。"},{"n":"リボリータ風 パンと豆のスープ","s":4,"t":["汁物","大豆"],"d":["daizu","yasai"],"v":{"副菜":1.5,"主菜":1,"主食":0.5},"k":280,"m":[11,12,1,2],"i":"白いんげん豆水煮80g、キャベツ1枚、にんじん・玉ねぎ少々、固くなったパン1/2枚、オリーブ油大さじ1、ローリエ","r":"野菜と豆を煮て、ちぎった固パンを加えてくたくたに。「煮返した(リボリータ)」が名前の由来で、翌日温め直すたびにおいしくなる。パンを捨てないトスカーナの知恵。"},{"n":"ズッキーニのペペロナータ添え 卵のせ","s":4,"t":["副菜","卵"],"d":["yasai","tamago"],"v":{"副菜":1.5,"主菜":1},"k":220,"m":[6,7,8],"i":"ズッキーニ1/2本、パプリカ1/2個、玉ねぎ1/4個、オリーブ油大さじ1、酢小さじ1、卵1個","r":"パプリカを皮が焦げるまで焼いてから蒸らしてむくと、甘さが化ける。とろとろに煮た野菜に目玉焼きをのせて崩す。「パプリカは焼いてむく」を覚えると南欧の味が近くなる。"},{"n":"本気のカルボナーラ 生クリームなし","s":4,"t":["主食","卵","乳製品"],"d":["tamago","gyunyu","niku"],"v":{"主食":2,"主菜":1},"k":520,"i":"スパゲッティ80g、卵1個+卵黄1個、粉チーズ大さじ2、ベーコン(かたまりなら尚良)30g、黒こしょうたっぷり","r":"ローマの原型に生クリームは入らない。卵とチーズを混ぜたボウルに、火を止めた熱い麺とゆで汁少々を入れて手早く——余熱だけで「ソース化」させる。固まったら失敗、とろりで成功。緊張感ごと楽しむ一皿。"},{"n":"なすのインボルティーニ(チーズ巻き焼き)","s":4,"t":["副菜","乳製品"],"d":["yasai","gyunyu"],"v":{"副菜":1,"乳製品":0.5},"k":240,"m":[7,8,9],"i":"なす1本(縦薄切り)、モッツァレラまたはとけるチーズ30g、トマトソース大さじ3、バジルまたは大葉","r":"焼いたなすでチーズを巻き、ソースをかけてトースターで8分。インボルティーニは「巻いたもの」の意。なすが生ハムの代わりになる、野菜が主役のごちそう。"},{"n":"きのこのリゾット 干し椎茸だし","s":4,"t":["主食"],"d":["gyunyu"],"v":{"主食":1.5,"副菜":0.5},"k":380,"m":[9,10,11],"i":"米0.5合(洗わない)、しめじ・まいたけ計80g、干し椎茸1枚(戻し汁ごと)、玉ねぎ少々、粉チーズ大さじ1、バター5g","r":"ブイヨンの代わりに干し椎茸の戻し汁を使う和伊折衷。生米を炒めて戻し汁を少しずつ、15分。イタリアのポルチーニを椎茸で翻訳する発想で、うまみは負けていない。"},{"n":"白身魚のアクアパッツァ・ビアンコ","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":280,"i":"白身魚(たら・鯛など)1切れ、あさり6個、にんにく、ケッパー小さじ1、白ワインまたは酒50ml、オリーブ油大さじ1、レモン","r":"トマトを入れない「白い」アクアパッツァ。魚とあさりと油と水だけで白濁したスープを作る——乳化こそがこの料理の核心。フライパンを揺すって油と水をつなぐ手の動きまで含めてレシピ。"},{"n":"パンツァネッラ(パンのサラダ)","s":4,"t":["副菜","主食"],"d":["yasai"],"v":{"副菜":1.5,"主食":0.5},"k":240,"m":[6,7,8],"i":"固くなったパン1/2枚、トマト1個、きゅうり1/2本、玉ねぎスライス、酢大さじ1、オリーブ油大さじ1、バジル","r":"水で湿らせて絞ったパンを、野菜の水分と酢と油で「サラダの具」にする。トマトの汁を吸ったパンが主役。固いパンの最高の再就職先として覚えておきたい。"},{"n":"ミラノ風チキンカツレツ 薄叩き","s":4,"t":["主菜","肉"],"d":["niku","tamago"],"v":{"主菜":2},"k":420,"i":"鶏むね肉1/2枚、小麦粉・卵・パン粉(細目)、粉チーズ大さじ1、オリーブ油大さじ2、レモン","r":"肉をラップではさんで瓶の底で5mmまで叩きのばすのが最大のポイント。薄いから揚げ焼き2分で火が通り、驚くほど柔らかい。「厚みを変える」も立派な調理技術だと知る一皿。"},{"n":"トマトとモッツァレラの温カプレーゼ","s":4,"t":["副菜","乳製品"],"d":["yasai","gyunyu"],"v":{"副菜":1,"乳製品":1},"k":220,"m":[6,7,8],"i":"トマト1個、モッツァレラ1/2個、オリーブ油小さじ2、バジル、塩","r":"トマトを厚切りにして表面だけ強火で焼き、チーズをのせて余熱でとろけさせる。冷たいカプレーゼしか知らないと驚く、甘みと香りの立ち方。塩は食べる直前に。"},{"n":"いわしのベッカフィーコ風パン粉焼き","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":320,"m":[6,7,9,10],"i":"いわし開き2尾、パン粉大さじ3、レーズン小さじ1、松の実またはくるみ小さじ1、レモン、オリーブ油小さじ2","r":"甘いレーズン入りパン粉を巻いて焼くシチリアの郷土料理。「魚に果実」の組み合わせは慣れると病みつきに。青魚の臭みがレモンと甘みで消える構造まで含めて、地中海の知恵。"},{"n":"ポモドーロ 完熟トマトの基本パスタ","s":4,"t":["主食"],"d":["yasai"],"v":{"主食":2,"副菜":1},"k":420,"m":[7,8],"i":"スパゲッティ80g、完熟トマト2個(または缶200g)、にんにく1片、オリーブ油大さじ1.5、バジル、塩","r":"具はトマトだけ。だからこそ湯むき・種取り・強火の煮詰めという基本が味に直結する。「シンプルほど技術が出る」の教科書。生トマトの季節に一度は作りたい原点の味。"},{"n":"鶏レバーのヴェネツィア風 玉ねぎ甘煮","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":1.5,"副菜":0.5},"k":240,"i":"鶏レバー100g、玉ねぎ1/2個、オリーブ油大さじ1、白ワインまたは酒大さじ2、塩・黒こしょう","r":"玉ねぎを甘くなるまで15分炒め、牛乳で下処理したレバーを加えてさっと。ヴェネツィアの定番は「レバーの苦味×玉ねぎの甘み」の対比で食べさせる。鉄分補給がごちそうに変わる。"},{"n":"エビとブロッコリーのオレキエッテ風","s":4,"t":["主食","魚"],"d":["sakana","yasai"],"v":{"主食":2,"主菜":1,"副菜":1},"k":450,"m":[11,12,1,2],"i":"ショートパスタ70g、むきえび6尾、ブロッコリー1/2株、にんにく、鷹の爪、オリーブ油大さじ1","r":"ブロッコリーを麺と同じ鍋で柔らかくゆで、つぶしながら「ソースにする」のがプーリア流。野菜がソースになる、という発想の転換。えびの赤と緑で見た目もごちそう。"},{"n":"南仏の本気ラタトゥイユ 別炒め仕立て","s":4,"t":["副菜","減塩"],"d":["yasai","abura"],"v":{"副菜":2},"k":180,"m":[7,8,9],"i":"なす1本、ズッキーニ1/2本、パプリカ1/2個、玉ねぎ1/4個、トマト1個、にんにく、オリーブ油大さじ1.5、タイムまたはローリエ","r":"野菜を全部いっしょに煮ないこと。1種類ずつ焼き色をつけてから合流させると、水っぽさと無縁の「野菜の煮込みの王様」になる。冷やして翌日、卵をのせて主菜化も。"},{"n":"フライパンキッシュ 生地なし","s":4,"t":["主菜","卵","乳製品"],"d":["tamago","gyunyu","yasai"],"v":{"主菜":1.5,"乳製品":0.5,"副菜":1},"k":340,"i":"卵2個、牛乳80ml、ベーコン1枚、ほうれん草1/3束、とけるチーズ20g、バター5g","r":"パイ生地を省き、具と卵液をバターのフライパンで弱火焼き。フタをして12分、表面が揺れなくなったら完成。キッシュの本体は「卵と乳の蒸し焼き」だと分かると、休日の朝が変わる。"},{"n":"じゃがいものグラタン・ドフィノワ","s":4,"t":["副菜","いも","乳製品"],"d":["imo","gyunyu"],"v":{"副菜":1.5,"乳製品":1},"k":340,"m":[10,11,12,1,2],"i":"じゃがいも1個、牛乳150ml、にんにく1/2片、とけるチーズ20g、バター5g、ナツメグ","r":"薄切りじゃがいもを牛乳で直接煮て、そのまま耐熱皿へ移して焼く。でんぷんが牛乳をとろみに変えるので小麦粉不要。「ソースを作らないグラタン」という発見。"},{"n":"ニース風サラダ 完全版","s":4,"t":["副菜","魚","卵"],"d":["sakana","tamago","yasai","imo"],"v":{"副菜":1.5,"主菜":1},"k":320,"m":[6,7,8],"i":"ツナ缶1/2缶、ゆで卵1個、いんげん4本、じゃがいも1/2個、トマト1/2個、黒オリーブ、アンチョビ1枚、オリーブ油・酢","r":"具それぞれに薄く下味をつけてから盛るのが「サラダを料理にする」コツ。一皿で主菜・副菜・いもがそろう構成は、栄養学的にもよくできた郷土食。"},{"n":"そば粉のガレット風(小麦粉版も可)","s":4,"t":["主食","卵","乳製品"],"d":["tamago","gyunyu"],"v":{"主食":1,"主菜":1,"乳製品":0.5},"k":360,"i":"そば粉(または小麦粉)40g、水80ml、卵1個、ハム1枚、とけるチーズ20g、バター5g","r":"薄く焼いた生地の中央に卵を割り、四隅を折る。ブルターニュの定番は「置き場所が決まった目玉焼き」と考えると気楽。半熟の黄身をソースに、端はパリパリ。休日ブランチの主役に。"},{"n":"鶏のフリカッセ(白い煮込み)","s":4,"t":["主菜","肉","乳製品"],"d":["niku","gyunyu"],"v":{"主菜":2,"乳製品":0.5},"k":400,"m":[11,12,1,2],"i":"鶏もも1/2枚、玉ねぎ1/4個、きのこ50g、牛乳100ml、小麦粉小さじ1、バター10g、白ワインまたは酒大さじ2","r":"「焼き色をつけない」で白く仕上げるのがフリカッセの定義。バターで肉を白いまま炒め、粉をふって牛乳でとろり。茶色い煮込みと白い煮込み、フランス料理の二大系譜の白い方。"},{"n":"サーモンのパピヨット(紙包み蒸し)","s":4,"t":["主菜","魚"],"d":["sakana","yasai"],"v":{"主菜":2,"副菜":0.5},"k":300,"i":"生鮭1切れ、きのこ40g、玉ねぎスライス、レモン2枚、バター5g、白ワインまたは酒小さじ2","r":"クッキングシートで具を包み、閉じ目を折ってトースターで15分。開けた瞬間の香りの噴出までが料理。「蒸気を閉じ込める」だけで、魚は驚くほどふっくらする。洗い物もほぼゼロ。"},{"n":"豚肉のシャルキュティエール風","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":380,"i":"豚ロース1枚、玉ねぎ1/4個、粒マスタード小さじ2、酢小さじ1、ピクルスまたはらっきょう2個(刻む)、バター5g","r":"焼いた豚を取り出し、玉ねぎ・マスタード・刻みピクルスでソースを作る。「肉屋の女将さん風」の名の通り、酸味で豚の脂を切る昔ながらの知恵。ピクルスがソースの具になる発見。"},{"n":"ガスパチョ(飲むサラダ)","s":4,"t":["汁物","減塩"],"d":["yasai"],"v":{"副菜":1.5},"k":120,"m":[7,8],"i":"トマト2個、きゅうり1/3本、パプリカ少々、パン1/4枚、オリーブ油大さじ1、酢小さじ2、にんにく少々","r":"全部をミキサーにかけて冷やすだけ——だが「パンでとろみ」「酢は強め」「油で乳化」の3点がスペインの本物の条件。火を使わない夏のスープの完成形。食欲ゼロの日の栄養補給に。"},{"n":"ビーフストロガノフ 15分版","s":4,"t":["主菜","肉","乳製品"],"d":["niku","gyunyu"],"v":{"主菜":2},"k":420,"i":"牛切り落とし100g、玉ねぎ1/4個、きのこ50g、ヨーグルト大さじ2+牛乳50ml(サワークリーム代用)、小麦粉小さじ1、バター10g、パプリカパウダー","r":"牛は強火で30秒だけ焼いて取り出し、最後に戻す。ヨーグルトの酸味がサワークリームの代わりを立派に務める。「高級料理は段取りの料理」と分かる15分。"},{"n":"ハヤシライス デミ缶なし","s":4,"t":["主食","肉"],"d":["niku","yasai"],"v":{"主食":2,"主菜":1.5},"k":560,"i":"ごはん150g、牛切り落とし80g、玉ねぎ1/2個、トマトペースト大さじ1、ケチャップ・ウスター各大さじ1、赤ワイン50ml、バター5g、小麦粉小さじ2","r":"玉ねぎをあめ色手前まで炒め、粉をふってワインで溶きのばす。市販ルーなしでも「洋食屋の茶色」は家の調味料で組み立てられる。甘み・酸味・コクの足し算を学ぶ一皿。"},{"n":"とろとろオムライス 王道デミ風","s":4,"t":["主食","卵"],"d":["tamago","niku"],"v":{"主食":2,"主菜":1.5},"k":580,"i":"ごはん150g、卵2個、鶏もも40g、玉ねぎ少々、ケチャップ大さじ2、バター10g、ソース(ケチャップ+ウスター+バター)","r":"卵は「混ぜながら半熟の一歩手前」で火からおろし、ライスの上へ滑らせる。フライパンを叩いて形を作る職人技は不要——とろとろで着地させれば正義。自分へのごほうび昼食に。"},{"n":"スペイン風にんにくスープ(ソパ・デ・アホ)","s":4,"t":["汁物","卵"],"d":["tamago"],"v":{"主菜":0.5,"主食":0.5},"k":180,"m":[12,1,2],"i":"にんにく2片、固くなったパン1/2枚、卵1個、パプリカパウダー小さじ1/2、オリーブ油大さじ1、水250ml","r":"スライスにんにくを油でこんがり、パプリカ粉とパンと水で5分煮て卵を落とす。「にんにくとパンと卵しかない日」の農民スープが、風邪気味の夜の最強の一杯になる。"},{"n":"鶏むねのブロシェット ハーブ焼き","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2},"k":280,"m":[6,7,8],"i":"鶏むね肉1/2枚、ズッキーニ・パプリカ各少々、オリーブ油大さじ1、レモン汁、ハーブ(オレガノ等)、塩","r":"角切り肉と野菜を交互に串へ(串がなければそのままグリルで可)。油とレモンとハーブで30分マリネしてから焼くと、むね肉の淡白さが「香りの器」に変わる。"},{"n":"ポークリエット風 ほぐし豚のパテ","s":4,"t":["主菜","肉","間食"],"d":["niku"],"v":{"主菜":1},"k":220,"i":"豚肩ロースかたまり150g(半量使用)、塩(肉の1.5%)、ローリエ、白ワインまたは酒50ml、水","r":"塩をすり込んだ豚を水とワインでほろほろまで60分煮て、煮汁ごとフォークでほぐし混ぜる。冷やすと脂が固まって「塗る肉」に。バゲットに塗る背徳の朝食、ただし少量で満足できる濃さ。"},{"n":"鱈のブランダードコロッケ風 揚げ焼き","s":4,"t":["主菜","魚","いも"],"d":["sakana","imo"],"v":{"主菜":1.5,"副菜":1},"k":340,"m":[12,1,2],"i":"甘塩たら1/2切れ、じゃがいも1個、牛乳50ml、パン粉、オリーブ油大さじ2","r":"たら入りマッシュを丸めてパン粉をつけ、揚げ焼きに。フランスの保存食の応用で、じゃがいもと塩魚の相性は世界共通。中身に味があるのでソース不要——減塩的にも優秀。"},{"n":"赤ワインのポーチドエッグ ムーレット風","s":4,"t":["主菜","卵"],"d":["tamago"],"v":{"主菜":1},"k":190,"m":[11,12,1],"i":"卵2個、赤ワイン100ml、水100ml、ベーコン1/2枚、玉ねぎ少々、バター5g、小麦粉少々、バゲット1枚","r":"赤ワイン液で卵を落とし煮にし、残り液を煮詰めてソースに。ブルゴーニュの「ウフ・アン・ムーレット」の家庭版。卵が主役のフレンチ、という新ジャンルが開く。"},{"n":"かぶのポタージュ 皮ごと","s":4,"t":["汁物","減塩"],"d":["yasai","gyunyu"],"v":{"副菜":1,"乳製品":0.5},"k":160,"m":[11,12,1,2,3],"i":"かぶ2個(皮ごと)、玉ねぎ1/4個、牛乳100ml、バター5g、塩","r":"かぶは皮ごと使うと風味が濃く、繊維もとれる。柔らかく煮てつぶし、葉は塩ゆでして浮き実に。「捨てる部分が香りの部分」だったと気づく、冬の白いスープ。"},{"n":"チキンのバスケーズ ピペラード添え","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1},"k":360,"m":[7,8,9],"i":"鶏もも1/2枚、パプリカ赤・緑各1/4個、玉ねぎ1/4個、トマト1/2個、にんにく、オリーブ油、パプリカパウダー","r":"ピペラード(パプリカのくたくた炒め煮)を作り、焼いた鶏を沈めて10分。バスク地方の夏の定番で、パプリカの甘さを「ソースの主役」に昇格させる料理。"},{"n":"洋食屋のポークソテー 玉ねぎソース","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":400,"i":"豚ロース厚切り1枚、玉ねぎ1/2個(すりおろし)、しょうゆ大さじ1、みりん大さじ1/2、バター5g","r":"筋切りした豚を中火で焼き、休ませている間に、すりおろし玉ねぎを同じフライパンで煮詰める。玉ねぎの酵素は「漬け込み」だけでなく「ソース」でも肉を助ける。ごはんが進む洋食の王道。"},{"n":"筑前煮 冷まし含ませ仕立て","s":4,"t":["主菜","肉","副菜","いも"],"d":["niku","yasai","imo"],"v":{"主菜":1,"副菜":1.5},"k":320,"m":[11,12,1],"i":"鶏もも80g、れんこん・にんじん・ごぼう・里芋・こんにゃく各少々、干し椎茸1枚、しょうゆ・みりん各大さじ1、だし200ml","r":"鶏と野菜を炒めてから煮て、火を止めて一度完全に冷ます——味がしみるのは冷める時、という煮物の大原則を体で覚える料理。作った日より翌日、翌日より2日目。"},{"n":"ぶり大根 下ゆで霜降りの正統派","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2,"副菜":1},"k":360,"m":[12,1,2],"i":"ぶりあら(または切り身)150g、大根1/3本、生姜、しょうゆ・みりん各大さじ1.5、酒50ml、米のとぎ汁","r":"大根はとぎ汁で下ゆで、ぶりは熱湯で霜降り——2つの下処理が「濁らない・臭わない」ぶり大根の全条件。あらを使うと骨からのだしで格が一段上がる。冬の煮物の頂点。"},{"n":"豚の角煮 ゆでこぼし2時間","s":4,"t":["主菜","肉","卵"],"d":["niku","tamago"],"v":{"主菜":2.5},"k":520,"i":"豚バラかたまり200g、ゆで卵1個、しょうゆ・みりん各大さじ2、酒100ml、砂糖大さじ1、生姜・長ねぎの青い部分","r":"一度ゆでこぼしてから、弱火で1時間半〜2時間。「時間はかかるが手はかからない」料理の代表。箸で切れる柔らかさは火力でなく時間の産物。週末に仕込み、平日に温め直す2日設計で。"},{"n":"鰆の西京漬け 本式二日仕込み","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":260,"m":[2,3,4],"i":"鰆1切れ、西京味噌(白味噌)50g、みりん大さじ1、酒小さじ1","r":"味噌床にガーゼ(またはペーパー)ごと魚を沈めて冷蔵2日。焼くときは味噌を軽くぬぐい、弱火で気長に——焦げの手前の飴色が食べ頃の合図。「待つことが調味」の代表格。床は2〜3回使える。"},{"n":"蕪蒸し 銀あん仕立て","s":4,"t":["主菜","魚","減塩"],"d":["sakana","tamago"],"v":{"主菜":1,"副菜":1},"k":180,"m":[11,12,1,2],"i":"かぶ2個(すりおろす)、白身魚または鶏50g、卵白1/2個分、だし100ml、薄口しょうゆ、片栗粉、わさび","r":"すりおろしたかぶと卵白を具にかぶせて蒸し、とろみのだし(銀あん)をかける。京料理の冬の定番が、レンジ4分でも成立する。ふるふるの熱々にわさびひとすじ——うなる一品。"},{"n":"手作りがんもどき 揚げたて","s":4,"t":["主菜","大豆"],"d":["daizu","tamago","kaiso"],"v":{"主菜":1.5},"k":280,"i":"木綿豆腐150g(しっかり水切り)、卵1/2個、ひじき・にんじん少々、片栗粉大さじ1、揚げ油","r":"水切り豆腐をつぶして具と混ぜ、丸めて揚げ焼きに。市販のがんもと揚げたては別の食べ物——外カリ中ふわの落差に驚く。おろし生姜と醤油数滴で、豆腐が主役のごちそうに。"},{"n":"れんこんのはさみ焼き 照りだれ","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":1.5,"副菜":0.5},"k":320,"m":[11,12,1,2],"i":"れんこん6cm、鶏ひき肉80g、生姜、片栗粉、しょうゆ・みりん各大さじ1/2","r":"れんこんの穴にたねが入るよう、切り口に粉をふってからはさむのがはがれない秘訣。シャキ×ふわの食感対比が主役。れんこんは「すりおろし・粗刻み・輪切り」で三変化する万能根菜。"},{"n":"夏野菜の揚げびたし","s":4,"t":["副菜","減塩"],"d":["yasai","abura"],"v":{"副菜":1.5},"k":200,"m":[7,8,9],"i":"なす1本、ズッキーニ1/2本、パプリカ1/4個、めんつゆ(2倍濃縮)50ml+水100ml、生姜、揚げ油","r":"素揚げ(多めの油で揚げ焼き可)した野菜を熱いうちに漬け地へ「ジュッ」。この温度差が味を吸わせる仕掛け。冷蔵庫で冷やして2日目の輝きは、夏の常備菜の最高峰。"},{"n":"五目ちらし寿司 酢飯から","s":4,"t":["主食","魚","卵"],"d":["sakana","tamago"],"v":{"主食":2,"主菜":1},"k":520,"m":[3,4],"i":"ごはん200g、すし酢(酢大さじ1.5+砂糖大さじ1/2+塩少々)、えび3尾、錦糸卵、絹さや、れんこん甘酢、干し椎茸甘煮","r":"熱いごはんに酢を回しかけ、うちわで扇ぎながら切り混ぜる——冷ましながら混ぜると米が締まって照りが出る。具は「甘い・酸っぱい・彩り」の役割分担。ひな祭りに限らず、金曜のごほうび飯に。"},{"n":"だしから作るおでん 大根と卵","s":4,"t":["主菜","卵","汁物"],"d":["tamago","kaiso"],"v":{"主菜":1,"副菜":1},"k":280,"m":[12,1,2],"i":"大根1/4本、ゆで卵1個、厚揚げ1/2枚、昆布5cm、かつお節ひとつかみ、薄口しょうゆ・みりん各大さじ1","r":"昆布とかつおで引いただしに、下ゆで大根を入れて弱火40分+一晩。「おでんは煮物でなく漬け物(だしに漬ける)」と考えると失敗しない。澄んだ金色のだしごと飲み干せる塩分設計。"},{"n":"鶏の治部煮風 とろみ煮","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2},"k":320,"m":[11,12,1],"i":"鶏もも80g(そぎ切り)、小麦粉、麩2個、ほうれん草1/3束、だし150ml、しょうゆ・みりん各大さじ1、わさび","r":"鶏に粉をまぶしてから煮る——これだけで煮汁が自然にとろみをまとい、肉はつるんと柔らかい。金沢の郷土料理の技は「粉をつけて煮る」の一点に凝縮。仕上げのわさびが上品。"},{"n":"胡麻豆腐 練りごまから","s":4,"t":["副菜","間食"],"d":["daizu"],"v":{"副菜":0.5},"k":160,"i":"練りごま大さじ2、葛粉または片栗粉大さじ2、水200ml、塩ひとつまみ、わさび醤油","r":"鍋で練り続けること10分——重くなってからの1分が「もっちり」の分かれ目。精進料理の代表は、実は材料3つ。冷やして、わさび醤油か黒蜜で。腕がだるくなるが、その価値はある。"},{"n":"松山揚げの卵とじ丼 だし多め","s":4,"t":["主食","卵","大豆"],"d":["tamago","daizu"],"v":{"主食":2,"主菜":1},"k":440,"i":"ごはん150g、油揚げ1枚、玉ねぎ1/4個、卵2個、だし100ml、しょうゆ・みりん各大さじ1、三つ葉","r":"肉の代わりに油揚げを主役にした「衣笠丼」(京都)。だしを吸った揚げが肉より雄弁な日がある。卵は2回に分け、2回目は火を止めてから。精進なのに満足度が高い理由を体感してほしい。"},{"n":"いわしのつみれ汁 手開きから","s":4,"t":["汁物","魚"],"d":["sakana"],"v":{"主菜":1.5},"k":220,"m":[9,10,11],"i":"いわし2尾、味噌小さじ2、生姜、長ねぎ、片栗粉小さじ1、だし300ml","r":"いわしは包丁を使わず親指で開ける——手開きを一度覚えると青魚が身近になる。たたいた身に味噌と生姜を混ぜ、スプーンで落とす。骨ごとたたけばカルシウムも汁の中。"},{"n":"牛肉とごぼうの柳川風","s":4,"t":["主菜","肉","卵"],"d":["niku","tamago"],"v":{"主菜":2},"k":380,"i":"牛切り落とし80g、ごぼう1/3本、卵1個、だし100ml、しょうゆ・みりん各大さじ1、三つ葉","r":"ささがきごぼうを甘辛だしで煮て、牛肉、卵の順。どじょうの柳川の家庭版で、「ごぼう+卵とじ」の骨格はどんなたんぱく源でも成立する応用力の高い型。"},{"n":"揚げ出しなすの おろしポン酢","s":4,"t":["副菜"],"d":["yasai"],"v":{"副菜":1.5},"k":180,"m":[7,8,9],"i":"なす1本、片栗粉、揚げ油、大根おろし、ポン酢、小ねぎ","r":"なすに片栗粉をまぶして揚げ焼きにし、おろしポン酢で。衣が「つゆ受け」になる揚げ出しの構造は、豆腐だけのものではない。とろけるなすの最高の食べ方のひとつ。"},{"n":"かきの土手鍋風 味噌縁仕立て","s":4,"t":["主菜","魚","汁物"],"d":["sakana","daizu","yasai"],"v":{"主菜":1.5,"副菜":1},"k":280,"m":[12,1,2],"i":"加熱用牡蠣6個、豆腐100g、白菜1枚、長ねぎ、味噌大さじ1.5+みりん大さじ1(練る)、だし200ml","r":"練り味噌を小鍋の縁に塗り、溶かしながら食べ進む広島の流儀。味の濃さを自分で調節できる合理的な仕掛け。牡蠣は最後に入れて2分——ぷっくりのまま味噌をまとわせる。"},{"n":"たけのこの土佐煮 追いがつお","s":4,"t":["副菜"],"d":[],"v":{"副菜":1.5},"k":120,"m":[3,4,5],"i":"ゆでたけのこ150g、だし200ml、しょうゆ・みりん各大さじ1/2、かつお節ひとつかみ(仕上げ用)","r":"薄味で煮含め、火を止めてから追いがつおをたっぷり——「だしで煮て、だしをまとわせる」二重構造が土佐煮の名の由来。春の香りを醤油で塗りつぶさない、引き算の煮物。"},{"n":"鯛のあら炊き 照り強め","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":320,"m":[3,4,5],"i":"鯛のあら200g、ごぼう1/4本、生姜、しょうゆ・みりん各大さじ1.5、砂糖大さじ1/2、酒100ml","r":"あらは熱湯をかけてウロコと血合いを掃除——この5分が全て。煮汁を煮詰めてスプーンでかけ続け、照りを「塗り重ねる」。切り身の半額以下で、味は倍。魚屋のあらコーナーが宝の山に見えてくる。"},{"n":"小松菜と油揚げの煮浸し 追いだし","s":4,"t":["副菜","大豆","減塩"],"d":["yasai","daizu"],"v":{"副菜":1},"k":90,"m":[12,1,2],"i":"小松菜1/2束、油揚げ1/2枚、だし150ml、薄口しょうゆ小さじ1、みりん小さじ1","r":"油揚げを先にだしで煮て「だしの器」にしてから小松菜を加える順番が肝。青菜は煮すぎず、余熱で仕上げて色を残す。地味な副菜こそ、順番と火加減の差が出る。"},{"n":"茶飯と焼き味噌の焦がし膳","s":4,"t":["主食"],"d":["daizu"],"v":{"主食":2},"k":320,"i":"米1合、ほうじ茶200ml(だし代わり)、薄口しょうゆ小さじ2、味噌大さじ1/2(アルミに塗って焼く)","r":"ほうじ茶で米を炊く奈良の茶飯。香ばしさの正体はお茶の焙煎香で、だしいらず。トースターで焼いた味噌を少しずつ崩しながら混ぜて食べる。「お茶は飲むだけではない」という発見。"},{"n":"なめろうの温泉卵のっけ丼","s":4,"t":["主食","魚","卵"],"d":["sakana","tamago"],"v":{"主食":2,"主菜":1.5},"k":480,"m":[5,6,7,8],"i":"ごはん150g、刺身用あじ1尾分、味噌小さじ1、薬味(みょうが・大葉・生姜)、温泉卵1個、白ごま","r":"たたいたなめろうを丼にのせ、温泉卵を落とす。黄身がたれの役割を果たすので醤油いらず——実は減塩構造。漁師飯×卵かけごはんの幸福な合流点。"},{"n":"白菜と豚の常夜鍋 ゆず胡椒","s":4,"t":["主菜","肉","汁物"],"d":["niku","yasai","kaiso"],"v":{"主菜":2,"副菜":1.5},"k":320,"m":[12,1,2],"i":"豚ロース薄切り100g、白菜2枚、豆苗1/2袋、昆布5cm、酒50ml、ゆず胡椒+ポン酢","r":"「毎晩食べても飽きない」から常夜鍋。昆布と酒だけの汁で豚と青菜をさっと泳がせ、ゆず胡椒ポン酢で。鍋の素を買わなくても、昆布1枚と酒があれば鍋は成立する——この身軽さこそ冬の武器。"},{"n":"焼きさばの棒寿司風 押しにぎり","s":4,"t":["主食","魚"],"d":["sakana"],"v":{"主食":2,"主菜":1.5},"k":480,"i":"塩さば半身(焼く)、ごはん150g、すし酢大さじ1.5、大葉2枚、生姜甘酢、白ごま","r":"焼きさばを使えば〆さばの技術なしで棒寿司気分に。ラップで棒状に押し固めて10分なじませてから切る——「押して待つ」だけで寿司の一体感が生まれる。週末の粋な昼。"},{"n":"けんちんうどん 精進だし濃いめ","s":4,"t":["主食","大豆","汁物"],"d":["daizu","imo","yasai"],"v":{"主食":1.5,"主菜":1,"副菜":1.5},"k":420,"m":[11,12,1,2],"i":"ゆでうどん1玉、木綿豆腐100g、大根・にんじん・ごぼう・里芋各少々、ごま油小さじ2、昆布椎茸だし400ml、薄口しょうゆ","r":"豆腐と根菜をごま油で炒めてから精進だしで煮る、けんちん汁の麺化。動物性ゼロでこの満足感——「油の香ばしさはだしの代役になる」という精進料理の核心技術を、日常の昼に。"},{"n":"油淋鶏 ねぎ醤油だれ","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":420,"i":"鶏もも1/2枚、片栗粉、揚げ油、たれ(長ねぎみじん1/4本、しょうゆ・酢各大さじ1、砂糖小さじ1、ごま油少々)","r":"皮目をカリッと揚げ焼きし、刻みねぎの甘酢醤油を「切ってからかける」。衣がたれを吸う音まで含めて完成。ねぎだれは冷奴や蒸し魚にも回せる万能選手——たれを覚える料理。"},{"n":"本格エビチリ 卵白下味","s":4,"t":["主菜","魚","卵"],"d":["sakana","tamago"],"v":{"主菜":2},"k":340,"i":"むきえび10尾、卵白1/2個分、片栗粉、ケチャップ大さじ2、豆板醤小さじ1、にんにく・生姜、鶏ガラ50ml、卵黄(仕上げ)","r":"えびは卵白と片栗粉で「衣をまとわせて」からさっと油通し(多めの油で炒める)。このひと手間がプリプリの正体。仕上げに卵黄を絡めるとチリソースがまろやかにまとまる——町中華の裏技。"},{"n":"青椒肉絲 下味から細切り","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1},"k":380,"m":[6,7,8],"i":"豚もも(または牛)100g、ピーマン2個、たけのこ細切り50g、しょうゆ・酒・片栗粉(下味)、オイスターソース大さじ1/2","r":"肉に下味と片栗粉をもみ込む「上漿(シャンジャン)」が中華の柔らかさの正体。全部を同じ太さの細切りに揃えると、火の通りと食感が同期する。強火30秒×2回で仕上げる短距離走。"},{"n":"黒酢の酢豚 揚げないりんご入り","s":4,"t":["主菜","肉","果物"],"d":["niku","kudamono","yasai"],"v":{"主菜":2,"果物":0.5},"k":420,"i":"豚肩ロース100g(大きめ角切り)、玉ねぎ1/4個、パプリカ1/4個、りんご1/8個、黒酢大さじ2、しょうゆ・砂糖各大さじ1、片栗粉","r":"豚は多めの油で「揚げ焼き」にして手軽に。パイナップルの代わりにりんごを入れると、酸味と食感が和の食卓に馴染む。黒酢のコクで、ケチャップ酢豚とは別の大人の味。"},{"n":"麻婆茄子 本格魚香仕立て","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":1.5,"副菜":1},"k":380,"m":[7,8,9],"i":"なす2本、豚ひき肉50g、豆板醤小さじ1、にんにく・生姜・長ねぎ、しょうゆ・酢・砂糖各小さじ1、片栗粉","r":"なすは多めの油で先に「素揚げ状態」まで焼き付けるのが、とろける食感の絶対条件。香味野菜+甘酸辛の「魚香(ユイシャン)」は魚不使用——四川の香りの設計思想を知る一皿。"},{"n":"皮から水餃子 もちもち10個","s":4,"t":["主菜","肉","主食"],"d":["niku","yasai"],"v":{"主菜":1.5,"主食":1},"k":480,"i":"強力粉+薄力粉各40g、熱湯45ml、豚ひき肉80g、ニラ・キャベツ、生姜、しょうゆ・ごま油","r":"粉に熱湯を注いで練る「湯ごね」なら初心者でも破れない皮になる。ゆでたての皮のもちもちは、市販皮では絶対に届かない領域。休日の1時間をかける価値がある「粉もの原体験」。"},{"n":"蒸し鶏の葱油(ねぎあぶら)がけ","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":320,"i":"鶏むね肉1/2枚、長ねぎ1/2本(白髪と青部位)、塩、ごま油大さじ1.5、生姜","r":"余熱調理した蒸し鶏に白髪ねぎを山と盛り、煙が立つ直前まで熱したごま油を「ジュッ」と回しかける。ねぎの香りが油で開く瞬間が、この料理のクライマックス。音と香りのごちそう。"},{"n":"パラパラ炒飯 卵先混ぜ式","s":4,"t":["主食","卵"],"d":["tamago"],"v":{"主食":2,"主菜":1},"k":520,"i":"温かいごはん150g、卵1個、長ねぎ1/4本、チャーシューまたはハム30g、しょうゆ小さじ1、ごま油","r":"ごはんに溶き卵を先に混ぜてから炒める「黄金炒飯」方式なら、家庭の火力でもパラパラになる。米の一粒ずつを卵がコーティングする理屈。しょうゆは鍋肌に垂らして焦がし香を立てる。"},{"n":"魯肉飯(ルーローハン)","s":4,"t":["主食","肉","卵"],"d":["niku","tamago"],"v":{"主食":2,"主菜":1.5},"k":560,"i":"ごはん150g、豚バラ薄切り100g(粗刻み)、ゆで卵1個、玉ねぎ1/4個(揚げ焼き)、しょうゆ・酒各大さじ1、砂糖小さじ2、五香粉少々","r":"台湾の国民食の鍵は「五香粉」と「揚げ玉ねぎ」。豚は挽き肉でなく粗刻みにすると、煮込んだときの食感が屋台の味になる。八角の香りが苦手なら五香粉は控えめから。"},{"n":"鶏肉のカシューナッツ炒め","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2},"k":420,"i":"鶏もも80g、カシューナッツ30g、ピーマン1個、長ねぎ、オイスターソース大さじ1/2、しょうゆ小さじ1、片栗粉","r":"ナッツは最初に乾煎りして取り出し、最後に戻す——湿気らせないための出し入れ。鶏に片栗粉の薄衣、強火で短く。ナッツが「おつまみ」から「主菜の具」に昇格する広東の定番。"},{"n":"酸辣湯麺 黒酢とろみ","s":4,"t":["主食","卵","汁物"],"d":["tamago","daizu"],"v":{"主食":1.5,"主菜":1},"k":420,"i":"中華麺1玉、卵1個、絹豆腐50g、椎茸・たけのこ、黒酢大さじ1.5、しょうゆ、ラー油、片栗粉、鶏ガラ350ml","r":"とろみ→卵→火を止めて酢、の順番厳守。酸味と辛味は「後がけの香り」として設計されている。すすった瞬間むせるくらいが本場流。胃が疲れた日ほど、なぜか食べたくなる一杯。"},{"n":"海老と卵のふわとろ炒め(滑蛋蝦仁)","s":4,"t":["主菜","魚","卵"],"d":["sakana","tamago"],"v":{"主菜":2},"k":320,"i":"むきえび8尾、卵2個、長ねぎ少々、鶏ガラ顆粒少々、片栗粉、油大さじ1.5","r":"卵液に片栗粉水を少し混ぜておくと、とろとろの状態で安定する広東の技。えびを7割火入れ→卵を注いで大きくゆっくり混ぜ、半熟で皿へ。「卵は炒めず、たゆたわせる」感覚を掴む一皿。"},{"n":"よだれ茄子 花椒だれ冷菜","s":4,"t":["副菜","減塩"],"d":["yasai"],"v":{"副菜":1},"k":130,"m":[7,8,9],"i":"なす2本、たれ(しょうゆ大さじ1、酢大さじ1/2、ラー油・花椒粉・砂糖少々、にんにく少々)、小ねぎ・ごま","r":"レンジ蒸しのなすを冷やし、よだれ鶏のたれを転用する。なすの淡白さは麻辣だれの最高の受け皿。「たれの型を覚えれば主役は替えられる」——中華の応用力の教科書。"},{"n":"ふかひれ風 春雨の白湯あんかけ","s":4,"t":["汁物","卵"],"d":["tamago","niku"],"v":{"主菜":1},"k":180,"i":"春雨20g、卵白1個分、かにかま2本、鶏ガラ300ml、生姜、片栗粉、黒酢少々","r":"太めの春雨をとろみの白湯あんで煮て、卵白を流す。高級中華の「気分」を家の材料で構成する遊び心の一杯。黒酢を数滴たらすと、味が一段深くなる。"},{"n":"ホイコーロー甜麺醤 キャベツ焼き付け","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1.5},"k":430,"i":"豚バラ80g、キャベツ3枚、長ねぎ、甜麺醤大さじ1、豆板醤小さじ1/2、にんにく","r":"キャベツを先に強火で「焼き付けて」から取り出す——水が出ず、甘みと焦げ香が立つ。回鍋肉の失敗の9割は「キャベツの水」だと知れば、もう失敗しない。"},{"n":"中華風 蒸しナスの胡麻酢だれ","s":4,"t":["副菜","減塩"],"d":["yasai"],"v":{"副菜":1},"k":110,"m":[6,7,8,9],"i":"なす2本、練りごま大さじ1、黒酢大さじ1/2、しょうゆ小さじ1、砂糖ひとつまみ、ラー油少々","r":"なすは丸ごとレンジで蒸して手で裂き、冷やしてから胡麻酢だれ。「裂く・冷やす・とろりのたれ」の三拍子。前菜としてもそうめんの友としても優秀な、夏の定番冷菜。"},{"n":"鶏だんごと春雨の中華鍋 一人前","s":4,"t":["主菜","肉","汁物"],"d":["niku","yasai"],"v":{"主菜":1.5,"副菜":1,"主食":0.5},"k":340,"m":[12,1,2],"i":"鶏ひき肉80g、春雨20g、白菜2枚、椎茸1枚、生姜、鶏ガラ400ml、ごま油数滴","r":"鶏だんごに生姜をきかせ、春雨は「〆」でなく最初から鍋の具に——スープを吸った春雨が実は主役。ひとり鍋は具材の配役を自由にできるのが醍醐味。"},{"n":"腐乳なし簡易 空芯菜炒め(小松菜版)","s":4,"t":["副菜"],"d":["yasai"],"v":{"副菜":1},"k":100,"i":"小松菜1束(または空芯菜)、にんにく2片、鶏ガラ顆粒少々、酒大さじ1、油大さじ1","r":"にんにくを多めの油で香らせ、強火のまま青菜を30秒——「炒めるというより油をまとわせる」速度勝負。仕上げの酒がジュッと蒸気になり、シャキシャキのまま火が通る。青菜炒めはタイム・アタック。"},{"n":"干焼明蝦風 有頭えびのチリ煮","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":300,"m":[11,12,1],"i":"有頭えび4尾、ケチャップ大さじ2、豆板醤小さじ1、にんにく・生姜・長ねぎ、酒大さじ2","r":"頭ごと焼き付けて「みそ」をソースに溶かし込むのが、むきえびのエビチリとの決定的な差。殻ごとしゃぶる前提の味付けで、手を汚してこそのごちそう。年末の食卓の主役に。"},{"n":"卵とトマトの酸辣スープ 完熟仕立て","s":4,"t":["汁物","卵"],"d":["tamago","yasai"],"v":{"主菜":1,"副菜":0.5},"k":140,"m":[7,8],"i":"完熟トマト1個、卵1個、黒酢大さじ1、しょうゆ小さじ1、ラー油、片栗粉、鶏ガラ250ml","r":"トマトを強火で煮崩して「酸味の土台」にし、黒酢は仕上げに。トマトの酸と黒酢の酸、二層の酸味を重ねる設計。夏バテの食欲スイッチとして覚えておきたい一杯。"},{"n":"スンドゥブチゲ あさりだし","s":4,"t":["主菜","大豆","汁物"],"d":["daizu","sakana","tamago"],"v":{"主菜":1.5,"副菜":0.5},"k":280,"m":[11,12,1,2],"i":"おぼろ豆腐(または絹)200g、あさり6個、豚こま30g、キムチ40g、コチュジャン小さじ1、卵1個、ごま油","r":"ごま油でキムチと豚を炒めてから水を注ぐ——チゲのコクは「キムチを炒める」工程で決まる。あさりのだしと豆腐のふるふる、落とし卵。ぐつぐつの鍋ごと食卓へ。"},{"n":"プルコギ 漬け込み本式","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":0.5},"k":420,"i":"牛切り落とし100g、玉ねぎ1/4個、にんじん少々、たれ(しょうゆ大さじ1、砂糖小さじ2、すりおろし梨またはりんご大さじ1、にんにく、ごま油)","r":"果物のすりおろしを入れた漬けだれに15分——梨の酵素が肉を柔らかくする韓国式の科学。汁気ごと炒め煮にして、甘辛だれを玉ねぎに吸わせる。ごはんが消える危険な一皿。"},{"n":"チャプチェ 春雨別調味","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":1,"副菜":1,"主食":0.5},"k":380,"i":"韓国春雨(または春雨)40g、牛こま50g、ほうれん草・にんじん・椎茸・玉ねぎ、しょうゆ・砂糖・ごま油","r":"具材を別々に炒めて最後に和える——手間に見えるが、これが「味がぼやけない」唯一の道。ゆでた春雨には先に下味を吸わせておく。冷めてもおいしいので作り置きの女王。"},{"n":"ヤンニョムチキン 揚げ焼き","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":460,"i":"鶏もも1/2枚、片栗粉、揚げ油、たれ(コチュジャン大さじ1、ケチャップ大さじ1、はちみつ小さじ2、にんにく)","r":"カリッと揚げ焼きした鶏に、煮立てた甘辛だれを絡める韓国フライドチキン。たれは「煮立ててから」絡めると照りが出て水っぽくならない。ビールの相棒としても真剣に優秀。"},{"n":"タッカルビ チーズなしの原型","s":4,"t":["主菜","肉","いも"],"d":["niku","yasai","imo"],"v":{"主菜":2,"副菜":1},"k":440,"i":"鶏もも100g、キャベツ2枚、さつまいも1/3本、玉ねぎ1/4個、コチュジャン大さじ1、しょうゆ・砂糖・にんにく","r":"チーズの海に沈む前のタッカルビは、鶏と野菜の甘辛炒め煮というまっとうな料理。さつまいもの甘さが辛さの緩衝材になる設計。〆にごはんを炒めるところまでが正式ルート。"},{"n":"サムギョプサル風 レタス包み豚","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1},"k":420,"i":"豚バラ焼肉用100g、サニーレタス5枚、長ねぎの白髪、味噌+コチュジャン(サムジャン風)、にんにくスライス、ごま油+塩","r":"豚をカリカリに焼いてハサミで切り、葉で巻いて食べる——「野菜で肉を包む」逆転の構図が、焼肉を野菜料理に変える。包む行為そのものが食べ過ぎのブレーキになる、良くできた食文化。"},{"n":"フォー・ガー 鶏だし透明スープ","s":4,"t":["主食","肉","汁物"],"d":["niku"],"v":{"主食":1.5,"主菜":1},"k":380,"i":"フォー(または細うどん)70g、鶏むね肉1/2枚、生姜・長ねぎ、ナンプラー大さじ1/2、レモン、パクチーまたは三つ葉、もやし","r":"鶏を茹でた湯がそのままスープになる一石二鳥の構造。澄んだスープには「沸騰させない」火加減が必須。レモンを絞った瞬間に国境を越える。胃にやさしい深夜の救済麺でもある。"},{"n":"グリーンカレー ペースト活用本格","s":4,"t":["主食","肉"],"d":["niku","yasai"],"v":{"主食":2,"主菜":1.5,"副菜":1},"k":580,"i":"ごはん150g、鶏もも80g、なす1本、パプリカ1/4個、グリーンカレーペースト大さじ1、ココナッツミルク200ml、ナンプラー小さじ2、バジル","r":"ペーストを「ココナッツミルクの油分で炒めて」香りを開かせるのがタイの流儀——いきなり煮ない。甘い・辛い・しょっぱいが同時に押し寄せる構造は、日本のカレーとは別の食べ物。"},{"n":"パッタイ 甘酸っぱい焼き米麺","s":4,"t":["主食","卵"],"d":["tamago","sakana"],"v":{"主食":2,"主菜":1},"k":480,"i":"米麺(フォー太め)70g、むきえび5尾、卵1個、もやし、ニラ、ナンプラー大さじ1/2、砂糖小さじ2、レモン、ピーナッツ砕き","r":"タレは「ナンプラー+砂糖+酸味」の三角形——タマリンドがなければレモンで十分。麺は水で戻して「炒めながら火を通す」ともちもちに。ピーナッツの食感が最後の署名。"},{"n":"トムヤム風 えびの酸辣スープ","s":4,"t":["汁物","魚"],"d":["sakana"],"v":{"主菜":1,"副菜":0.5},"k":160,"i":"殻付きえび4尾、きのこ50g、レモン汁大さじ1、ナンプラー大さじ1/2、鷹の爪、生姜(ガランガル代用)、パクチー","r":"えびの殻を先に炒めて煮出す——ビスクと同じ理屈が東南アジアにもある。酸味・辛味・ハーブの三重奏は、味噌汁とは別の「すっぱいスープ」という選択肢を日常にくれる。"},{"n":"生春巻き えびと大葉","s":4,"t":["主菜","魚","副菜"],"d":["sakana","yasai"],"v":{"主菜":1,"副菜":1},"k":260,"m":[6,7,8],"i":"ライスペーパー3枚、ゆでえび3尾、春雨20g、レタス・きゅうり・大葉、たれ(スイートチリまたは酢味噌)","r":"ライスペーパーは「さっとくぐらせるだけ」——浸すと破れる。巻きはじめに具を固く抱かせるのがコツ。切り口の断面美まで含めて、手先の集中を楽しむ料理。夏の来客の前菜に。"},{"n":"ナシゴレン 目玉焼きのせ","s":4,"t":["主食","卵"],"d":["tamago","sakana"],"v":{"主食":2,"主菜":1},"k":520,"i":"温かいごはん150g、むきえび4尾、玉ねぎ1/4個、にんにく、ナンプラー小さじ2+オイスターソース小さじ1(サンバル代用)、目玉焼き1個、きゅうり","r":"インドネシアの炒飯の鍵は「甘辛の醤(ジャン)」——ケチャップマニスがなければオイスター+ナンプラーで再現。目玉焼きの黄身を崩して混ぜるまでが正式な食べ方。"},{"n":"タコライス 沖縄生まれ","s":4,"t":["主食","肉","乳製品"],"d":["niku","gyunyu","yasai"],"v":{"主食":2,"主菜":1.5,"副菜":1},"k":560,"i":"ごはん150g、合いびき肉100g、チリパウダー小さじ1、クミン少々、ケチャップ・ウスター各大さじ1/2、レタス・トマト、チーズ20g","r":"タコスの具をごはんにのせた沖縄の発明。スパイスの効いた肉そぼろ(タコミート)は冷凍常備に向く万能選手。レタスの山を最初にのせるのが、野菜をきちんと食べる裏設計。"},{"n":"チキンケバブ風 ヨーグルトスパイス焼き","s":4,"t":["主菜","肉","乳製品"],"d":["niku","gyunyu"],"v":{"主菜":2},"k":340,"i":"鶏もも1/2枚、ヨーグルト大さじ2、クミン・コリアンダー・パプリカパウダー各小さじ1/2、にんにく・レモン、塩","r":"中東の串焼きの下味は、タンドリーチキンの親戚——ヨーグルト+スパイス+酸。強火で焦げ目をつけてから弱火で仕上げ、レモンをぎゅっと。刻み野菜と一緒にピタやトルティーヤに挟んでも。"},{"n":"ビリヤニ風 スパイス炊き込みごはん","s":4,"t":["主食","肉"],"d":["niku"],"v":{"主食":2,"主菜":1.5},"k":560,"i":"米1合、鶏もも80g、ヨーグルト大さじ2、玉ねぎ1/4個(揚げ焼き)、カレー粉小さじ2、クミンシード少々、バター5g、レーズン・ナッツ(あれば)","r":"ヨーグルトとスパイスに漬けた鶏を米の上にのせ、炊飯器で炊くだけの簡易式。本場の湯取り式には及ばずとも、「肉の下に米、蒸気で炊く」という構造は同じ。炊き上がりの香りで隣人が振り向くレベル。"}];

/* 記録から「今日の食生活に足りないもの」を優先度順に推定する */
function recipeNeeds(p, d){
  d = normalizeDay(d);
  const needs = [];
  const push = (tag, reason) => { if(!needs.some(n=>n.tag===tag)) needs.push({tag:tag, reason:reason}); };
  if(d.meals.breakfast.skipped) push("朝食","今日は朝食の記録がありません。明日の朝、これならできそうという一品を選んでおきませんか？");
  if(!d.meals.dinner.skipped && d.meals.dinner.time>=21) push("夜遅め","夕食が遅めの日ですね。遅い夜でも体に残りにくい一品を集めました。");
  if(mealRecorded(d)){
    if(d.sv["副菜"] < p.targets["副菜"]) push("副菜","今日の副菜は目標まであと" + Math.max(1, Math.ceil(p.targets["副菜"]-d.sv["副菜"])) + "皿。野菜・海藻・きのこの一品をどうぞ。");
    if(d.sv["主菜"] <= 1) push("主菜","たんぱく源が少なめの日です。肉・魚・卵・大豆の一品を足しましょう。");
    if(d.sv["乳製品"] < p.targets["乳製品"]) push("乳製品","乳製品がまだ目標に届いていません。足しやすい形を集めました。");
    if(d.sv["果物"] === 0) push("果物","今日は果物がまだゼロ。手間の少ない果物からどうぞ。");
    if(d.sv["主食"] <= 1) push("主食","主食が少なめです。小さく整える主食の形を集めました。");
  } else {
    push("朝食","まだ今日の食事記録がありません。まずは作りやすい一品からどうぞ。");
  }
  if(snackKindRecorded(d)) push("間食","菓子類・甘い飲み物の代わりになる、栄養を補う間食を集めました。");
  const v = dvsWeekly();
  if(dvsWeekTracked()){
    const missMap = [["sakana","魚","この1週間、魚が少なめです。調理しない魚から手軽にどうぞ。"],
      ["kaiso","海藻","この1週間、海藻が少なめです。ひとつまみで足せる形を集めました。"],
      ["imo","いも","この1週間、いも類が少なめです。腹持ちの良い一品をどうぞ。"],
      ["daizu","大豆","この1週間、大豆製品が少なめです。火を使わない一品が多いですよ。"],
      ["tamago","卵","この1週間、卵が少なめです。最短で主菜になる食品です。"],
      ["gyunyu","乳製品","この1週間、乳製品が少なめです。生活の動線に置きやすい形を集めました。"],
      ["kudamono","果物","この1週間、果物が少なめです。切らない果物から始めましょう。"]];
    missMap.forEach(function(mm){ if(v.freq[mm[0]]<=1) push(mm[1], mm[2]); });
  }
  if(p.goal==="bp") push("減塩","血圧を意識する方向けに、塩分控えめでも満足できる一品を集めました。");
  // 特に不足がない日は、テーマを日替わりで回して提案がマンネリ化しないようにする
  const fbTag = ["副菜","主菜","汁物","主食","魚","肉"][daySeed % 6];
  const fbReason = {
    "副菜":"食卓にもう一皿。定番の副菜からどうぞ。",
    "主菜":"今日の主役をひと皿。肉・魚・卵・大豆から選びました。",
    "汁物":"汁物がひと椀あると、食卓の満足感がぐっと変わります。",
    "主食":"主食のバリエーションを少し広げてみませんか。",
    "魚":"今日は魚の日。手軽な一品から本格派まで。",
    "肉":"今日は肉料理の気分をひと工夫。部位や調理でぐっと変わります。"
  }[fbTag];
  push(fbTag, fbReason);
  return needs;
}
/* 今日のおすすめ: 最優先ニーズについて4段階(★1〜★4)×各1品を選ぶ */
function todaysRecipePicks(p, d){
  const needs = recipeNeeds(p, d);
  const top = needs[0];
  const mon = now.getMonth()+1;
  const recent = (S.recipeHistory||[]).filter(function(h){ return h && h.date!==TODAY; }).map(function(h){ return h.n; });
  const picks = {};
  [1,2,3,4].forEach(function(lv){
    let pool = RECIPES.filter(function(r){ return r.s===lv && r.t.indexOf(top.tag)>=0; });
    if(!pool.length) pool = RECIPES.filter(function(r){ return r.s===lv; });
    const scored = pool.map(function(r){
      let sc = 0;
      if(r.m){ sc += r.m.indexOf(mon)>=0 ? -6 : 12; }  // 旬は前へ、旬外れは後ろへ
      if(recent.indexOf(r.n)>=0) sc += 25;             // 最近提案した料理は避ける
      sc += (stableHash(r.n + "|" + TODAY) % 97) / 97 * 9;  // 日替わりの入れ替え
      return { r:r, sc:sc };
    }).sort(function(a,b){ return a.sc-b.sc; });
    picks[lv] = scored[0].r;
  });
  // 今日の提案を記録(当日分は置き換え)。直近3週間分だけ保持
  const kept = (S.recipeHistory||[]).filter(function(h){ return h && h.date!==TODAY; });
  const todayEntries = [1,2,3,4].map(function(lv){ return { date:TODAY, n:picks[lv].n }; });
  S.recipeHistory = kept.concat(todayEntries).slice(-84);
  save();
  return { need:top, picks:picks };
}
function starHTML(n){
  let h = "";
  for(let i=1;i<=4;i++) h += '<span style="color:' + (i<=n ? "var(--yuzu)" : "var(--line)") + '">★</span>';
  return '<span aria-label="レベル' + n + '">' + h + '</span>';
}

  const dvsNames = r.d.map(function(id){ const g=DVS_GROUPS.find(function(x){return x.id===id;}); return g?g.label:null; }).filter(Boolean);

/* --- 時間栄養学の指標（複数日の食事時刻から算出） ---
   いずれも食事「中点」(midpoint = 朝食と夕食の中間時刻)を用いる。
   ・Eating Jet Lag (EJL): 週末と平日の食事中点のズレ(時間)。
     Zerón-Rugerio et al., Nutrients 2019;11(12):2980 で BMI との
     関連が報告された指標。|EJL|>=1h を要注意の目安とする。
   ・Interdaily Stability (IS): 食事タイミングの日間類似性(0〜1)。
     本来は概日リズム研究(van Someren 1999 等)の指標を食事時刻に応用。
     IS = 1 − (日々の中点の分散 / 全体平均まわりの分散)に相当する形で
     簡易算出。1に近いほど毎日同じリズム。 */
function mealMid(d){
  const t=[];
  ["breakfast","lunch","dinner"].forEach(function(k){ const m=d.meals[k]; if(!m.skipped) t.push(m.time); });
  if(!t.length) return null;
  return t.reduce((a,c)=>a+c,0)/t.length; // 摂取した食事時刻の平均を中点とする（昼のみの日も採用）
}
function chronoCtx(){
  // 直近14日から、記録のある日の {中点, 週末フラグ} を集める
  const wk=[], wd=[], all=[]; let noBreakfastDays=0, lateDinnerDays=0;
  for(let i=0;i<14;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(d && mealRecorded(d)){
      if(d.meals.breakfast.skipped) noBreakfastDays++;
      if(!d.meals.dinner.skipped && d.meals.dinner.time>=21) lateDinnerDays++;
      const mid=mealMid(d);
      if(mid!==null){
        const dow=dt.getDay();
        const weekend=(dow===0||dow===6);
        all.push(mid);
        (weekend?wk:wd).push(mid);
      }
    }
  }
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  let ejl=null;
  if(wk.length>=1 && wd.length>=2) ejl=+(mean(wk)-mean(wd)).toFixed(1);
  // Interdaily Stability（簡易版）: 全体平均まわりのばらつきが小さいほど高い
  let is=null;
  if(all.length>=5){
    const m=mean(all);
    const varTotal=mean(all.map(x=>(x-m)*(x-m)));
    // 中点が ±2h 散らばると IS≈0、ぴったり揃うと IS≈1 になるよう正規化
    is=Math.max(0, Math.min(1, 1 - varTotal/4));
    is=+is.toFixed(2);
  }
  return { ejl:ejl, is:is, weekendN:wk.length, weekdayN:wd.length, mealDays:all.length,
           noBreakfastDays:noBreakfastDays, lateDinnerDays:lateDinnerDays,
           meanMid:all.length?+mean(all).toFixed(1):null,
           weekendMean:wk.length?+mean(wk).toFixed(1):null,
           weekdayMean:wd.length?+mean(wd).toFixed(1):null };
}

/* --- 睡眠コメント（睡眠ガイド2023準拠・量/質/タイミング/規則性） ---
   出典の要点: 成人は6時間以上を目安/床上時間8時間以上に注意/
   睡眠休養感を高める/寝だめ(平日休日の差)は体内時計を乱す。
   食事との関連も織り込み、日替わりで言い回しを変える。 */
function sleepNote(p, today){
  const out=[];
  const dur = sleepDur(today.sleep);
  const c = sleepCtx();
  const sleepInputStarted = today.sleep && (today.sleep.bed!=null || today.sleep.wake!=null);
  if(sleepInputStarted && dur==null){
    out.push({ tone:"advice", title:"睡眠時刻の確認", body:
      "就寝時刻と起床時刻の組み合わせを確認してください。現在の入力では睡眠時間が2時間未満、または14時間を超えるため、睡眠時間・睡眠規則性の計算からは除外しています。" });
  }
  // --- 量 ---
  if(dur!=null){
    if(dur < 6){
      out.push({ tone:"advice", title:"昨晩の睡眠時間", body: pick([
        "昨晩の睡眠は約"+dur+"時間でした。成人は6時間以上が目安とされています。睡眠不足が続くと食欲を高めるホルモンが増え、つい食べ過ぎてしまうことが研究で示されています。今夜は15分でも早く布団に入れると、明日の食欲のコントロールが楽になります。",
        "約"+dur+"時間の睡眠でした。寝不足の翌日は甘いものや脂っこいものを欲しやすくなることが知られています。今日の間食が増えそうなら、それは意志ではなく寝不足のせいかもしれません。",
      ], 20) });
    } else if(dur > 9){
      out.push({ tone:"advice", title:"昨晩の睡眠時間", body: pick([
        "昨晩は約"+dur+"時間と長めでした。長すぎる睡眠や寝床で過ごす時間が長いことは、かえって調子を崩すことがあると睡眠ガイドでは注意を促しています。日中に活動的に過ごすと、夜の眠りが深まります。",
        "約"+dur+"時間と、やや長めの睡眠でした。疲れがたまっている時期は自然なことですが、続く場合は、朝の光を浴びる・日中に体を動かす時間を作ると、睡眠の質そのものが整いやすくなります。",
      ], 22) });
    } else {
      out.push({ tone:"praise", title:"昨晩の睡眠時間", body: pick([
        "昨晩は約"+dur+"時間の睡眠。成人に推奨される時間をしっかり確保できています。十分な睡眠は食欲のバランスを整え、健康的な食生活を続ける土台になります。",
        "約"+dur+"時間、よく眠れています。睡眠が足りている日は、食事の選択も自然と整いやすくなります。この生活リズムは大きな財産です。",
      ], 20) });
    }
  }
  // --- 質(中途覚醒) ---
  if(today.sleep && today.sleep.awak>=3){
    out.push({ tone:"advice", title:"夜中の目覚め", body: pick([
      "昨晩は夜中に"+today.sleep.awak+"回目が覚めたのですね。就寝直前の夜食やお酒は、眠りを浅くして夜間の目覚めを増やすことが知られています。夕食を早めにすると、睡眠の質も上がりやすくなります。",
      "夜中に"+today.sleep.awak+"回目が覚めています。目が覚めること自体を責める必要はありませんが、夕食の時刻・お酒・寝る前の水分のどれかを少し調整すると、朝の回復感が変わることがあります。",
    ], 22) });
  }
  // --- タイミング(ソーシャルジェットラグ) ---
  // 平日/休日のズレが大きい場合は、SRIが高くても先に注意喚起する。
  // 「毎日同じ長さで寝ているが、休日だけ大きく後ろ倒し」のケースで、
  // 安定しているという称賛が目立ちすぎることを防ぐ。
  const majorSJL = c.n>=5 && c.sjl!=null && Math.abs(c.sjl)>=1.5;
  if(majorSJL){
    out.push({ tone:"advice", title:"平日と休日の睡眠のズレ", body: pick([
      "休日は睡眠の中心が平日より約"+Math.abs(c.sjl).toFixed(1)+"時間ずれています（“寝だめ”の状態）。平日と休日の睡眠のズレは体内時計を乱し、体重増加や食生活の乱れと関連することが報告されています。休日の起床を平日に近づけることから始めてみましょう。",
      "平日と休日の睡眠の中心に約"+Math.abs(c.sjl).toFixed(1)+"時間の差があります。寝だめで疲れが取れた気がしても、体内時計には毎週の時差ぼけとして刻まれています。コツは「起きる時刻だけ平日±1時間以内」。眠ければ昼に20分の仮眠で補うほうが、リズムを守れます。",
    ], 19) });
  }
  // --- 規則性(SRI/中点SD/簡易IS) ---
  if(c.n>=5 && c.sri!=null){
    if(c.sri>=85 && !majorSJL && c.avgDur>=6 && c.avgDur<=9 && c.awakAvg<2 && c.midSD<1.25){
      out.push({ tone:"praise", title:"睡眠リズムが安定しています", body: pick([
        "毎日の就寝・起床の時刻がよく揃っています（規則性スコア"+c.sri+"／100）。規則正しい睡眠リズムは体内時計を安定させ、食事のリズムや代謝にも良い影響を与えることが報告されています。",
        "規則性スコア"+c.sri+"／100。就寝も起床も、時計のように正確です。睡眠の規則性は、長さと同じくらい健康に効くことが近年の研究で分かってきました。この几帳面さは、誇っていい強みです。",
      ], 19) });
    } else if(c.sri<60 || (c.is!=null && c.is<0.5) || (c.midSD!=null && c.midSD>=1.5)){
      out.push({ tone:"advice", title:"睡眠リズムにばらつき", body: pick([
        "この2週間、就寝・起床の時刻に日ごとのばらつきが大きめです（規則性スコア"+c.sri+"／100、睡眠中点のばらつき約"+c.midSD+"時間）。まずは「起きる時刻」を毎日そろえると、夜の眠気も食事のリズムも整いやすくなります。",
        "就寝・起床の時刻が日によって揺れています（規則性スコア"+c.sri+"／100）。眠る時刻を揃えるのは難しくても、起きる時刻なら目覚ましひとつで揃えられます。起床が揃えば、夜の眠気は自然と同じ時刻にやってきます。",
      ], 19) });
    }
  }
  return out;
}

/* --- 時間栄養学コメント（EJL / IS / 平日週末差） --- */
function chronoNote(p, c){
  const out=[];
  const lateCenter = (c.weekdayMean!=null && c.weekdayMean>=15) || (c.weekendMean!=null && c.weekendMean>=15);
  // Eating Jet Lag
  if(c.ejl!==null){
    if(Math.abs(c.ejl)>=1){
      out.push({ tone:"advice", title:"平日と週末で食事リズムがずれています",
        body: pick([
          "週末は食事の中心が平日より約"+Math.abs(c.ejl).toFixed(1)+"時間"+(c.ejl>0?"遅く":"早く")+"なっています（いわば“食事の時差ぼけ”）。この平日と週末の食事時刻のズレは、体内時計を乱し、体重増加と関連することが報告されています。週末の朝食を平日と同じ時間にとるだけで、ズレは大きく縮まります。",
          "平日と週末の食事時刻に約"+Math.abs(c.ejl).toFixed(1)+"時間の差があります。海外旅行をしていないのに、体の中では毎週小さな時差ぼけが起きている状態です。直すのは1食だけでOK。週末の朝食時刻を平日に寄せると、昼も夜も自然とついてきます。",
        ], 15) });
    } else if(c.weekendN>=2){
      if(lateCenter){
        out.push({ tone:"advice", title:"食事リズムは揃っていますが、全体に遅めです",
          body: pick([
            "平日と週末の食事時刻のズレは1時間以内で、規則性は保てています。一方で、食事の中心時刻が後ろ寄りです。特に夕食や最終摂食が遅い日は、まず15〜30分だけ前倒しするか、夕方に主食を先に食べて帰宅後を軽めにする分食が現実的です。",
            "リズムの規則性は合格です。次の課題は「時間帯ごと前へずらす」こと。毎日同じ時刻に食べられる人は、その時刻を15分動かすのも実は得意です。今週は夕食だけ、15分の前倒しを試してみませんか。",
          ], 15) });
      } else {
        out.push({ tone:"praise", title:"平日も週末も食事リズムが一定です",
          body: pick([
            "平日と週末で、食事の中心時刻のズレが1時間以内に収まっています。“食事の時差ぼけ”がないこの状態は、体内時計が安定し、代謝リズムが整っている良いサインです。体は規則正しさを何より好みます。",
            "週末も平日とほぼ同じ時刻に食べられています。これは時間栄養学の観点でかなり上級の習慣です。休みの日でも体内時計がずれないので、月曜の朝のだるさや食欲の乱れが起きにくくなります。",
          ], 15) });
      }
    }
  }
  // Interdaily Stability
  if(c.is!==null){
    if(c.is>=0.8){
      if(lateCenter){
        out.push({ tone:"advice", title:"毎日の食事時刻は安定、次は前倒しです",
          body: pick([
            "食事タイミングの安定度は"+(c.is*100).toFixed(0)+"%と高く、毎日ほぼ同じ時間に食べられています。次の改善ポイントは、リズムを崩さず少し早めることです。まずは夕食だけ15分前へ動かしてみましょう。",
            "毎日の食事時刻はきれいに揃っています（安定度"+(c.is*100).toFixed(0)+"%）。あとは「列ごと前に動かす」だけ。電車のダイヤ改正のように、リズムを保ったまま全体を15分早めるのが、いちばん体に優しい改善です。",
          ], 16) });
      } else {
        out.push({ tone:"praise", title:"毎日の食事タイミングが高く揃っています",
          body: pick([
            "食事タイミングの安定度を示す指標（毎日の規則性）が"+(c.is*100).toFixed(0)+"%と高い水準です。毎日ほぼ同じ時間に食べられている証拠で、これは睡眠・代謝・お通じのリズムを底上げします。",
            "食事時刻の規則性が"+(c.is*100).toFixed(0)+"%。体は「いつ食べ物が来るか」を予測して消化の準備をしています。あなたの体は毎日その予測が当たっている状態で、消化も代謝も効率よく回っているはずです。",
          ], 16) });
      }
    } else if(c.is<0.5 && c.weekdayN+c.weekendN>=5){
      out.push({ tone:"advice", title:"食事の時間帯が日によってばらついています",
        body: pick([
          "食事タイミングの安定度が"+(c.is*100).toFixed(0)+"%と、日ごとの差が大きめです。すべてを揃えるのは大変なので、まずは“朝食だけは毎日同じ時間”を1週間試してみましょう。1食固定するだけで、全体のリズムが驚くほど整います。",
          "食事の時刻が日によって大きく動いています（安定度"+(c.is*100).toFixed(0)+"%）。仕事や予定で夕食が動くのは仕方ありません。動かせるのは朝です。「朝食の時刻だけは死守する」——これが、不規則な生活の中でリズムを保つプロの技です。",
        ], 16) });
    }
  }
  return out;

/* --- 体重トレンド（直近7日平均 と その前7日平均 の比較） ---
   各窓に2回以上の計測がある場合のみ判定（疎なデータでの誤判定を防ぐ）。
   diff = 直近平均 − 前週平均（kg/週 に相当） */
function weightTrend(){
  const getW = (from,to)=>{
    const arr=[];
    for(let i=from;i<=to;i++){
      const dt=new Date(now); dt.setDate(now.getDate()-i);
      const d=S.days[dateKey(dt)];
      if(d){ const w=parseFloat(d.weight); if(!isNaN(w)) arr.push(w); }
    }
    return arr;
  };
  const recent=getW(0,6), prior=getW(7,13);
  if(recent.length<2 || prior.length<2) return null;
  const m=a=>a.reduce((x,y)=>x+y,0)/a.length;
  return { recent:+m(recent).toFixed(2), prior:+m(prior).toFixed(2),
           diff:+(m(recent)-m(prior)).toFixed(2), n:recent.length+prior.length };
}

/* --- 睡眠の規則性・週次指標（直近14日から算出） ---
   ・avgDur: 平均睡眠時間, shortDays: 6時間未満の日数
   ・midSD: 睡眠中点のばらつき(時間) 小さいほど規則的
   ・SRI簡易版: 連続する2日で「就寝〜起床の時間帯」が重なる割合の平均(0-100)
     Phillips et al. 2017 のSleep Regularity Indexの考え方を、
     就寝-起床区間の一致度で近似したもの。85以上で非常に規則的。
   ・socialJetlag: 平日と休日の睡眠中点差(時間) */
function sleepCtx(){
  const recs=[];
  for(let i=0;i<14;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(d && d.sleep && d.sleep.bed!=null && d.sleep.wake!=null){
      const w = normSleepWindow(d.sleep);
      if(w){
        recs.push({ dt:dt, dur:sleepDur(d.sleep), mid:sleepMid(d.sleep), awak:d.sleep.awak||0,
                    bed:w.bed, wake:w.wake });
      }
    }
  }
  if(recs.length<1) return { n:0 };
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const durs=recs.map(r=>r.dur);
  const mids=recs.map(r=>r.mid);
  const avgDur=+mean(durs).toFixed(1);
  const shortDays=durs.filter(d=>d<6).length;
  const longDays=durs.filter(d=>d>9).length;
  const awakAvg=+mean(recs.map(r=>r.awak)).toFixed(1);
  // 中点SD（円周統計）: 23時と1時を「2時間差」と扱う
  const mMid=circMeanHour(mids);
  const midSD=circSDHour(mids);
  const midVar=mean(mids.map(x=>{ const z=circDiffHour(x,mMid); return z*z; }));
  // IS(0-1): 中点のばらつきが小さいほど高い(±2hで0付近)
  const is=+Math.max(0,Math.min(1,1-midVar/4)).toFixed(2);
  // SRI簡易: 隣接日の「就寝時刻」と「起床時刻」のズレを点数化する。
  // 以前の睡眠区間一致率だけでは、週末の寝だめがあっても起きている時間帯の一致で高得点になりやすい。
  // そこで、就寝・起床の差をそれぞれ最大6時間で打ち切り、差が小さいほど100点に近づく簡易指標にする。
  let sri=null;
  if(recs.length>=2){
    const sorted=recs.slice().sort((a,b)=>b.dt-a.dt); // 新しい順
    let sum=0, pairs=0;
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i], b=sorted[i+1];
      const gap=Math.round((a.dt-b.dt)/86400000);
      if(gap!==1) continue;
      const bedDiff=Math.min(6, Math.abs(a.bed-b.bed));
      const wakeDiff=Math.min(6, Math.abs(a.wake-b.wake));
      const pairScore=Math.max(0, 100 - ((bedDiff+wakeDiff)/12)*100);
      sum += pairScore; pairs++;
    }
    if(pairs>0) sri=Math.round(sum/pairs);
  }
  // ソーシャルジェットラグ(平日 vs 休日の中点差)も円周差で算出
  const wd=[],we=[];
  recs.forEach(r=>{ const dow=r.dt.getDay(); (dow===0||dow===6?we:wd).push(r.mid); });
  let sjl=null;
  if(wd.length>=2 && we.length>=1) sjl=+circDiffHour(circMeanHour(we), circMeanHour(wd)).toFixed(1);
  return { n:recs.length, avgDur:avgDur, shortDays:shortDays, longDays:longDays,
           awakAvg:awakAvg, midSD:midSD, is:is, sri:sri, sjl:sjl };
}
/* --- 規則性の指標（複数日の記録から算出） --- */
function regCtx(){
  // 連続記録日数（今日を含む）
  let streak = 0;
  for(let i=0;;i++){
    const dt = new Date(now); dt.setDate(now.getDate()-i);
    const k = dateKey(dt);
    const d = S.days[k] ? normalizeDay(S.days[k]) : null;
    if(d && anyRecord(d)) streak++; else break;
  }
  // 直近7日（今日含む）の記録
  const days7 = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(now); dt.setDate(now.getDate()-i);
    const k = dateKey(dt);
    if(S.days[k]) days7.push(normalizeDay(S.days[k]));
  }
  const eaten = days7.filter(d=>mealRecorded(d));
  const bfTimes = eaten.filter(d=>!d.meals.breakfast.skipped).map(d=>d.meals.breakfast.time);
  const bfStable = bfTimes.length>=5 && (Math.max.apply(null,bfTimes)-Math.min.apply(null,bfTimes))<=1;
  const earlyDinners = eaten.filter(d=>!d.meals.dinner.skipped && d.meals.dinner.time<21).length;
  const weighDays = days7.filter(d=>d.weight!=="").length;
  // 直近7日の記録日数（連続でなくてよい。欠測があっても続いている人を正しく評価する）
  const rec7 = days7.filter(d=>anyRecord(d)).length;
  return { streak:streak, rec7:rec7, bfStable:bfStable, earlyDinners:earlyDinners, weighDays:weighDays, eatenDays:eaten.length, totalDays: totalRecordedDays(),
           week:weekStats(0), prevWeek:weekStats(1) };
}
/* --- 週単位の集計（offset=0: 今日までの7日 / 1: その前の7日） ---
   欠測日は集計から外すだけで、比較をあきらめない。 */
function weekStats(offset){
  const st = { rec:0, eaten:0, score:null, fuku:null, fruit:null, bfSkip:0, early:0, weigh:0, snackDays:0 };
  const scores=[], fukus=[], fruits=[];
  for(let i=6;i>=0;i--){
    const dt = new Date(now); dt.setDate(now.getDate() - i - offset*7);
    const k = dateKey(dt);
    if(!S.days[k]) continue;
    const d = normalizeDay(S.days[k]);
    if(anyRecord(d)) st.rec++;
    if(d.weight!=="") st.weigh++;
    if(snackKindRecorded(d)) st.snackDays++;
    if(!mealRecorded(d)) continue;
    st.eaten++;
    if(S.profile){ scores.push(dayScore(d, S.profile.targets)); }
    fukus.push(d.sv["副菜"]); fruits.push(d.sv["果物"]);
    if(d.meals.breakfast.skipped) st.bfSkip++;
    if(!d.meals.dinner.skipped && d.meals.dinner.time<21) st.early++;
  }
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  st.score = scores.length ? Math.round(avg(scores)) : null;
  st.fuku = avg(fukus); st.fruit = avg(fruits);
  return st;
}

/* --- 直近7日のスコア（今日を除く過去分） --- */
function pastWeek(){
  const out = [];
  for(let i=6;i>=1;i--){
    const dt = new Date(now); dt.setDate(now.getDate()-i);
    const k = dateKey(dt);
    if(S.days[k] && recorded(S.days[k]) && S.profile){
      out.push({ day: WD[dt.getDay()], score: dayScore(S.days[k], S.profile.targets) });
    }
  }
  return out;
}
/* --- 今週(月曜〜日曜)のバランススコア ---
   欠測日も枠として残すため、常に7つの要素を返す。
   グラフ専用。コメント生成が使う pastWeek() とは別物。 */
function weekScoreSeries(){
  const parts = TODAY.split("-").map(Number);
  const out = [];
  for(let i=6;i>=0;i--){                   // 6日前 → 当日の順に並べる
    const dt = new Date(parts[0], parts[1]-1, parts[2] - i);
    const k = dateKey(dt);
    const d = S.days[k];
    const has = !!(d && recorded(d) && S.profile);
    out.push({ key:k, label:WD[dt.getDay()], isToday:k===TODAY,
      score: has ? dayScore(d, S.profile.targets) : null });
  }
  return out;
}
function weightHistory(){
  const out = [];
  Object.keys(S.days).sort().forEach(k=>{
    const w = parseFloat(S.days[k].weight);
    if(!isNaN(w)) out.push({ key:k, label:k.slice(5).replace("-","/"), w });
  });
  return out.slice(-14);
}
/* 月曜はじまりの1週間分の体重系列を返す。
   offsetWeeks=0で今週、1で先週。未計測日は w:null。 */
function weekWeightSeries(offsetWeeks){
  const parts = TODAY.split("-").map(Number);
  const idx = dayIndexFromKey(TODAY);
  const back = ((idx + 3) % 7) + offsetWeeks * 7;   // 月曜からの経過日数(+週オフセット)
  const out = [];
  for(let i=0;i<7;i++){
    const dt = new Date(parts[0], parts[1]-1, parts[2] - back + i);
    const k = dateKey(dt);
    const d = S.days[k];
    const w = d ? parseFloat(d.weight) : NaN;
    out.push({ key:k, dow:i, w: isNaN(w) ? null : w, isToday: k===TODAY });
  }
  return out;
}

    '</div></div>';

  const sync = ()=>{ form.name=$("f_name").value; form.age=$("f_age").value; form.sexF=$("f_sex").value==="f";
    form.height=$("f_h").value; form.weight=$("f_w").value; form.pal=$("f_pal").value; };
  ["f_name","f_age","f_h","f_w"].forEach(id=> $(id).addEventListener("change",()=>{sync();renderOnboarding();}));
  ["f_sex","f_pal"].forEach(id=> $(id).addEventListener("change",sync));
  view.querySelectorAll("[data-goal]").forEach(b=> b.addEventListener("click",()=>{sync();form.goal=b.dataset.goal;renderOnboarding();}));
  view.querySelectorAll("[data-stage]").forEach(b=> b.addEventListener("click",()=>{sync();form.stage=b.dataset.stage;renderOnboarding();}));
  $("f_go").addEventListener("click",()=>{
    sync();
    if(!(form.age&&form.height&&form.weight&&form.goal&&form.stage)) return;
    const w=+form.weight,h=+form.height,a=+form.age;
    const err = profileInputError(a,h,w,form.goal);
    if(err){ formError=err; renderOnboarding(); return; }
    formError="";
    const b0 = bmr(w,h,a,form.sexF);
    const e0 = Math.round(b0*PAL[form.pal]/10)*10;
    const energy = targetEnergy(e0, form.goal, b0);
    S.profile = { name:form.name, age:a, sexF:form.sexF, height:h, weight:w, pal:form.pal,
      goal:form.goal, stage:form.stage, bmi:w/Math.pow(h/100,2), energy, targets:svTargets(energy) };
    save(); render();
  });
}

/* --- ホーム --- */
function renderHome(){
  const p=S.profile, d=S.days[TODAY];

  let foodNotes = rec ? buildNotes(p, d, week.map(x=>x.score).concat([score]), regCtx())
    : [(function(){
        const td = totalRecordedDays();
        const nm = (p.name||"あなた") + "さん";
        if(td===0) return {tone:"stage", title:"はじめまして",
          body:nm + "、担当させていただきます。まずは今日食べたものを「記録」タブから皿数で入力してみてください。最初の1週間は、内容の良し悪しよりも「記録すること」自体が目標です。"};
        const stk = getStreak();
        const variants = (stk===0 && td>=7) ? [
          nm + "、おかえりなさい。少し間があきましたが、記録は途切れても習慣は消えていません。今日の1件から、また一緒に積み直しましょう。",
          nm + "、また会えてうれしいです。久しぶりの日こそ、ハードルは低く。昨晩の睡眠だけ、まず入れてみませんか。",
          "ブランク明けは誰にでもあります。" + nm + "のこれまでの記録" + td + "日分は、ちゃんとここに残っていますよ。今日をその続きにしましょう。",
        ] : [
          nm + "、今日の記録はこれからですね。食事の前後どちらでも、1分あれば十分です。",
          nm + "、お疲れさまです。まだ今日の入力がありません。まずは昨晩の就寝・起床だけでもどうぞ。",
          "今日も開いてくれてありがとうございます。" + nm + "の記録は通算" + td + "日分。今日の1件で、また積み上がります。",
          nm + "、忙しい日は「補食や間食だけ」でも立派な記録です。ゼロにしないことがいちばん大事です。",
        ];
        return {tone:"stage", title: stk===0 && td>=7 ? "おかえりなさい" : "今日の記録はこれから", body: pick(variants, 9)};
      })()];
  // 体重トレンドの評価（データが揃う場合のみ）。最優先で先頭に表示する
  const wt = weightTrend();
  const tn = wt ? trendNote(p, wt) : null;
  if(tn) foodNotes.unshift(tn);
  // 時間栄養学（EJL / IS / 平日・週末差）。食事記録がある日にだけ織り交ぜる

  const streak = getStreak();

  const LV = levelState();
  if(S.lastLevel===undefined){ S.lastLevel=LV.level; save(); }
  const prevLevel = S.lastLevel;
  const heldBefore = hasHeldAssistant();
  const titleForLevel = function(L){ return (L<30 && heldBefore) ? "研究生" : levelTitle(L); };
  const leveledUp = LV.level > S.lastLevel;
  const leveledDown = LV.level < S.lastLevel && !LV.gate;
  if((S.maxLevelEver||0) < LV.level){ S.maxLevelEver = LV.level; save(); }
  if(leveledUp || leveledDown){ S.lastLevel=LV.level; save(); }
  updateLevelLog(LV);
  // 助言ノートに、対応するレシピ集への導線を付ける(コメント文面自体は変えない)

    "乳製品":"乳製品", "果物":"果物", "菓子類・嗜好飲料":"間食", "補食":"間食", "減塩":"減塩", "食事の多様性":"副菜" };
  foodNotes.forEach(function(n){
    if(n.tone!=="advice" || n.recipeTag) return;
    const tag = ADVICE_RECIPE_TAG[noteTopicKey(n.title)] || ADVICE_RECIPE_TAG[adviceKey({title:n.title})];
    if(tag) n.recipeTag = tag;
  });
  const plateauNote = (!leveledUp && !leveledDown && !LV.gate) ? levelPlateauNote(LV,p) : null;

    foodNotes.splice(Math.min(2, foodNotes.length), 0, plateauNote);

        '<div style="font-size:12px;line-height:1.8;color:var(--sub)">「' + esc(pj.t) + '」<br>' +
        (pj.ok ? "記録から確認できました。この達成は健康偏差値にしっかり刻まれています。今週の約束も「計画」から選びましょう。"

    (pj && pj.type==="ask" ?
      '<div class="card fadein" style="border:1.5px solid var(--yuzu);background:#FFFCF4">' +

        '<div style="font-size:12px;line-height:1.8;color:var(--sub);margin-bottom:10px">「' + esc(pj.t) + '」— おおむね守れましたか？（正直な申告が、いちばんあなたのためになります）</div>' +

          '<button class="btn-main" id="pjYes" style="flex:1;padding:11px;font-size:13px">守れた</button>' +

        '</div></div>' : "") +
    (leveledUp ?
      (function(){
        const promoted = titleForLevel(LV.level) !== titleForLevel(prevLevel);
        return '<div class="card fadein" style="background:linear-gradient(135deg,#FFF8E8,#FCEFC8);border:1.5px solid #EFD9A0;display:flex;align-items:center;gap:14px">' +
          '<div style="font-size:34px">' + (promoted?"🎓":"🎉") + '</div>' +
          '<div><div class="disp" style="font-size:15px;font-weight:700;color:#7A5A12">' +
            (promoted ? '「' + titleForLevel(LV.level) + '」に昇進しました！' : '健康偏差値が ' + LV.level + ' に上がりました！') +
          '</div>' +
          '<div style="font-size:12px;color:#7A5A12">' +
            (promoted ? 'おめでとうございます。健康偏差値 ' + LV.level + '。' : '現在の肩書は「' + titleForLevel(LV.level) + '」。') +
          'からだは少しずつ変わっています。</div></div></div>';
      })() : "") +
    (leveledDown ?
      (function(){
        const demoted = titleForLevel(LV.level) !== titleForLevel(prevLevel);
        const titleNow = titleForLevel(LV.level);
        return '<div class="card fadein" style="border:1.5px solid var(--line);background:#FBFBF9;display:flex;align-items:center;gap:14px">' +
          '<div style="font-size:30px">🍃</div>' +
          '<div><div class="disp" style="font-size:14px;font-weight:700;color:var(--ink)">' +
            (demoted ? '肩書が「' + titleNow + '」' + (titleNow==="研究生" ? 'になりました' : 'に戻りました') : '健康偏差値が ' + LV.level + ' に下がりました') +
          '</div>' +
          '<div style="font-size:12px;line-height:1.8;color:var(--sub)">ある肩書以降では、生活が乱れた日や記録のない日が続くと偏差値が下がる仕組みです。責めるためではなく、立て直しの合図です。今日の記録から、また積み直していきましょう。</div></div></div>';
      })() : "") +
    (LV.gate ?
      '<div class="card fadein" style="border:1.5px solid var(--green);background:var(--pale)">' +
        '<div style="display:flex;gap:12px;align-items:flex-start">' +
          '<div style="font-size:26px">🩺</div>' +

          '<button class="btn-main" id="ckBtn" style="margin-top:10px;padding:11px;font-size:13px">アセスメントを受ける</button></div>' +

    (!LV.gate && weeklyCheckupDue() ?

    S.lastAdjust=TODAY; save(); render();
  });
}

/* --- 約束の達成判定（週明けに実行） --- */
function weekDays(w){
  const out=[];
  Object.keys(S.days).forEach(function(k){
    const di=Math.floor(new Date(k).getTime()/86400000);
    if(Math.floor((di+3)/7)===w) out.push({k:k, d:S.days[k]});  // 月曜はじまり
  });
  return out;
}
function pendingPromiseJudgment(){
  S.promiseLog = S.promiseLog||[];
  // 1) 週が明けてまだ判定していない約束があれば判定する
  if(S.promise && S.promiseWeek!==undefined && WEEK_IDX>S.promiseWeek &&
     !S.promiseLog.some(function(e){return e.week===S.promiseWeek;})){
    const def = PROMISE_POOL.find(function(x){return x.t===S.promise;});
    if(def && def.chk){
      const ok = !!def.chk(weekDays(S.promiseWeek), S.profile);
      S.promiseLog.push({week:S.promiseWeek, t:S.promise, d:def.d, achieved:ok, auto:true});
      save();
    } else {
      return {type:"ask", t:S.promise, d:def?def.d:2};
    }
  }
  // 2) 直近の判定結果は「OK」を押すか新しい約束を選ぶまで表示し続ける
  //    (以前は一度描画されると消えてしまい、タブを切り替えると見逃していた)
  const last = S.promiseLog.length ? S.promiseLog[S.promiseLog.length-1] : null;
  if(last && WEEK_IDX>last.week && WEEK_IDX-last.week<=2 &&
     (S.promiseResultAck===undefined || S.promiseResultAck<last.week) &&
     !(S.promise && S.promiseWeek===WEEK_IDX)){
    return {type:"result", ok:!!last.achieved, t:last.t, week:last.week};
  }
  return null;
}
function reportPromise(ok, d){
  S.promiseLog = S.promiseLog||[];
  S.promiseLog.push({week:S.promiseWeek, t:S.promise, d:d, achieved:ok, auto:false});
  save(); render();
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const WEEK_IDX = Math.floor((daySeed+3)/7);  // 月曜はじまりの週番号
function weeklyPromises(){
  const p = S.profile || { goal:null };
  const rng = mulberry32(WEEK_IDX + 20260101);
  const recent = (S.promiseHistory||[]).slice(-3);
  const scored = PROMISE_POOL.map(function(x){
    var sc = rng();
    if(x.g && p.goal && x.g.indexOf(p.goal)>=0) sc += 0.35;
    if(recent.indexOf(x.t)>=0) sc -= 0.8;
    return { x:x, sc:sc };
  }).sort(function(a,b){ return b.sc-a.sc; });
  const out=[], cats={};
  scored.forEach(function(o){ if(out.length<6 && !cats[o.x.c]){ out.push(o.x); cats[o.x.c]=1; } });
  scored.forEach(function(o){ if(out.length<6 && out.indexOf(o.x)<0) out.push(o.x); });
  return out;
}

function commitWeeklyPromise(pr){

    const e0=Math.round(b0*PAL[p.pal]/10)*10;
    p.energy = targetEnergy(e0, p.goal, b0);
    p.targets = svTargets(p.energy);
    if(gate){ S.checkups=(S.checkups||[]); if(S.checkups.indexOf(gate)<0) S.checkups.push(gate); }
    S.checkupLog=(S.checkupLog||[]);
    S.checkupLog.push({ date:TODAY, gate:gate, weekly:!gate, weight:w, stage:p.stage, goal:p.goal, energy:p.energy });
    checkupMode=false; ckForm=null;
    save(); render();
  });
}

/* --- 体重モニタリングのコメント（アセスメントの目標に対応） --- */
function weightComment(p){
  const wt = weightTrend();
  let head = "体重は日内で±1kgほどゆれます。1日の上下に一喜一憂せず、<b>週平均の傾き</b>だけを見てください。";
  let goalLine = "";
  if(p.goal==="loss"){
    goalLine = "減量の目安は<b>月1〜2kg（体重の5%／6か月）</b>まで。これより速いペースは筋肉も一緒に減らしてしまいます。";
  } else if(p.goal==="gain"){
    goalLine = "増量の目安は<b>月0.5〜1kg</b>。これより速い増え方は脂肪が中心になりやすいので、たんぱく質と主食でゆっくり積み上げましょう。";
  } else if(p.goal==="bp"){
    goalLine = "体重が気になる場合、いまの体重から3〜5%減らすだけでも血圧や血糖値の改善が期待できることが報告されています。無理のない範囲で、まず体重を増やさないことから始めましょう。具体的な目標は医師・管理栄養士にご相談ください。";
  } else {
    goalLine = "維持が目標のいまは、<b>±2kgの幅</b>に収まっていれば合格です。「変わらない」ことは、それ自体が立派な成果です。";
  }
  let trendLine = "";
  if(wt){
    const dir = wt.diff<=-0.1 ? "減少" : wt.diff>=0.1 ? "増加" : "横ばい";
    trendLine = "<br><b>直近7日平均 " + wt.recent + "kg</b>（前週比 " + (wt.diff>0?"+":"") + wt.diff.toFixed(1) + "kg・" + dir + "傾向）— ";
    if(p.goal==="loss"){
      trendLine += (wt.diff<=-0.1 && wt.diff>=-0.75) ? "目標どおりの理想的な動きです。"
        : wt.diff < -0.75 ? "ペースが速すぎます。食事量を目標まで戻しましょう。"
        : wt.diff < 0.1 ? "いまは停滞期です。ホームの栄養士ノートに対策を出しています。"
        : "増加傾向です。今週の夕食時刻と補食・間食を見直してみましょう。";
    } else if(p.goal==="gain"){
      trendLine += wt.diff>=0.1 ? "計画どおり増えています。この調子です。"
        : "まだ増えていません。主食かたんぱく源をもう1皿足してみましょう。";
    } else {
      trendLine += Math.abs(wt.diff)<=0.3 ? "安定して維持できています。"
        : "少し動いています。今週は食事の時刻をいつもどおりに保つことを意識してみましょう。";
    }
  }
  return head + goalLine + trendLine;
}

function weightWeeklyChartHTML(cur, prev){
  /* 月曜はじまりの7日枠に、今週(実線+肉球)と先週(薄いグレーの点線)を重ねて描く。
     データが何日分たまっても、表示は常にこの2週分だけ。 */
  const W=340,H=200,left=46,right=16,top=26,bottom=40;
  const plotW=W-left-right, plotH=H-top-bottom, base=top+plotH;
  const WDAY=["月","火","水","木","金","土","日"];
  const vals=[];
  cur.forEach(function(x){ if(x.w!=null) vals.push(x.w); });
  prev.forEach(function(x){ if(x.w!=null) vals.push(x.w); });
  let minW=Math.min.apply(null,vals), maxW=Math.max.apply(null,vals);
  const pad=Math.max(0.4,(maxW-minW)*0.18);
  minW=Math.floor((minW-pad)*2)/2; maxW=Math.ceil((maxW+pad)*2)/2;
  if(maxW-minW<1){ const mid=(maxW+minW)/2; minW=mid-0.5; maxW=mid+0.5; }
  const xFor=function(i){ return left + plotW*(i+0.5)/7; };
  const yFor=function(w){ return base - (w-minW)*plotH/(maxW-minW); };
  const fmtW=function(w){ return Number(w).toFixed(1).replace(/\.0$/,""); };
  const yTicks=[minW,(minW+maxW)/2,maxW];
  const grid=yTicks.map(function(t){
    const y=yFor(t);
    return '<line x1="'+left+'" x2="'+(left+plotW)+'" y1="'+y+'" y2="'+y+'" stroke="#E6EEE9" stroke-width="1"/>'+
      '<text x="'+(left-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="8.5" fill="var(--sub)">'+fmtW(t)+'</text>';
  }).join("");
  const line=function(series, stroke, dash, width){
    const pts=series.filter(function(x){return x.w!=null;})
      .map(function(x){return xFor(x.dow)+","+yFor(x.w);}).join(" ");
    if(!pts) return "";
    return '<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="'+width+'"'+
      (dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round" stroke-linejoin="round"/>';
  };
  // 先週: 薄いグレーの点線 + 小さな点
  const prevDots=prev.filter(function(x){return x.w!=null;}).map(function(x){
    return '<circle cx="'+xFor(x.dow)+'" cy="'+yFor(x.w)+'" r="2.6" fill="#C9CFCB"/>';
  }).join("");
  // 今週: 実線 + 肉球マーカー + 値ラベル
  const curEls=cur.filter(function(x){return x.w!=null;}).map(function(x){
    const cx=xFor(x.dow), cy=yFor(x.w), paw=18;
    return '<image href="weight_paw.png" x="'+(cx-paw/2)+'" y="'+(cy-paw/2)+'" width="'+paw+'" height="'+paw+'" preserveAspectRatio="xMidYMid meet"/>'+
      '<text x="'+cx+'" y="'+Math.max(top+8,cy-8)+'" font-size="8.5" text-anchor="middle" fill="var(--deep)" font-weight="700">'+fmtW(x.w)+'</text>';
  }).join("");
  const dayLabels=WDAY.map(function(wd,i){
    const today=cur[i] && cur[i].isToday;
    return '<text x="'+xFor(i)+'" y="'+(base+16)+'" text-anchor="middle" font-size="9"'+
      ' font-weight="'+(today?'900':'500')+'" fill="'+(today?'var(--green)':'var(--sub)')+'">'+wd+(today?'●':'')+'</text>';
  }).join("");
  const legendY=top-12;
  const legend='<line x1="'+(left+plotW-104)+'" x2="'+(left+plotW-86)+'" y1="'+legendY+'" y2="'+legendY+'" stroke="var(--green)" stroke-width="2.2"/>'+
    '<text x="'+(left+plotW-82)+'" y="'+(legendY+3)+'" font-size="8.5" fill="var(--sub)">今週</text>'+
    '<line x1="'+(left+plotW-56)+'" x2="'+(left+plotW-38)+'" y1="'+legendY+'" y2="'+legendY+'" stroke="#C9CFCB" stroke-width="1.8" stroke-dasharray="4 4"/>'+
    '<text x="'+(left+plotW-34)+'" y="'+(legendY+3)+'" font-size="8.5" fill="var(--sub)">先週</text>';
  return '<svg class="weight-trend-svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="今週と先週の体重">'+
    grid+
    '<line x1="'+left+'" x2="'+left+'" y1="'+top+'" y2="'+base+'" stroke="var(--line)" stroke-width="1.2"/>'+
    '<line x1="'+left+'" x2="'+(left+plotW)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)" stroke-width="1.2"/>'+
    '<text x="'+(left-24)+'" y="'+(top-8)+'" font-size="8" font-weight="700" fill="var(--sub)">kg</text>'+
    legend+
    line(prev,"#C9CFCB","4 4",1.8)+prevDots+
    line(cur,"var(--green)","",2.2)+curEls+
    dayLabels+
  '</svg>'+
  '<div class="hint">月曜はじまりの1週間です。肉球と実線が今週、薄いグレーの点線が先週。●は今日。同じ曜日どうしを見比べると、先週からの変化がひと目で分かります。</div>';
}

function weeklyTrendHTML(){
  const bars = weekScoreSeries();                                  // 月〜日の7枠(欠測はscore=null)
  const done = bars.filter(function(b){ return b.score!=null; });
  const avg = done.length ? Math.round(done.reduce(function(sum,b){ return sum + b.score; },0) / done.length) : null;
  function scoreTrendSVG(){
    const W=340, H=178, left=34, right=60, top=22, bottom=32;
    const plotW=W-left-right, plotH=H-top-bottom, base=top+plotH;
    const clampScore=function(v){ return Math.max(0, Math.min(100, Number(v)||0)); };
    const yFor=function(v){ return top + (100-clampScore(v)) * plotH / 100; };
    // 70〜100点(目標ゾーン)をかなり薄い赤で塗る
    const targetBand='<rect x="' + left + '" y="' + yFor(100) + '" width="' + plotW + '" height="' + (yFor(70)-yFor(100)) + '" fill="#FBEBEC"/>';
    const ticks=[0,50,70,100];
    const grid=ticks.map(function(t){
      const y=yFor(t), isTarget=t===70;
      return '<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + y + '" y2="' + y + '" stroke="' + (isTarget?'rgba(185,72,79,.72)':'#E6EEE9') + '" stroke-width="' + (isTarget?'1.4':'1') + '" stroke-dasharray="' + (isTarget?'2 3':'') + '"/>' +
        '<text x="' + (left-7) + '" y="' + (y+3.5) + '" text-anchor="end" font-size="8.5" font-weight="' + (isTarget?'700':'500') + '" fill="' + (isTarget?'#B9484F':'#5E6F67') + '">' + t + '</text>';
    }).join("");
    const yAvg=yFor(avg);
    const avgLabelY=Math.max(top+10, Math.min(base-3, yAvg+4));
    const avgLine='<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + yAvg + '" y2="' + yAvg + '" stroke="var(--yuzu)" stroke-width="1.7" stroke-dasharray="4 3"/>' +
      '<text x="' + (left+plotW+6) + '" y="' + avgLabelY + '" font-size="8.5" font-weight="700" fill="#7A5A12">平均 ' + avg + '点</text>';
    const barW=Math.max(12, Math.min(26, plotW/(bars.length*2.1)));
    const barEls=bars.map(function(b,i){
      const x=left + plotW * (i+.5) / bars.length;
      // 曜日ラベルは記録の有無にかかわらず7日ぶん並べる(今日は太字)
      const dayLabel='<text x="' + x + '" y="' + (base+19) + '" text-anchor="middle" font-size="9" font-weight="' + (b.isToday?'700':'400') + '" fill="' + (b.isToday?'var(--ink)':'var(--sub)') + '">' + b.label + '</text>';
      if(b.score==null) return dayLabel;                          // 記録のない日はバーなし
      const score=clampScore(b.score);
      const y=yFor(score);
      const h=Math.max(2, base-y);
      const labelY=Math.max(top+8, y-6);
      return '<rect x="' + (x-barW/2) + '" y="' + y + '" width="' + barW + '" height="' + h + '" rx="4" fill="' + (b.isToday?'lightpink':'lightgrey') + '" stroke="' + (b.isToday?'#E79AA8':'#BFBFBF') + '" stroke-width="0.8"/>' +
        '<text x="' + x + '" y="' + labelY + '" text-anchor="middle" font-size="10" font-weight="700" fill="var(--deep)">' + b.score + '</text>' +
        dayLabel;
    }).join("");
    return '<svg class="weekly-score-svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="過去7日間の食事バランス得点(6日前から今日まで)">' +
      targetBand + grid +
      '<line x1="' + left + '" x2="' + left + '" y1="' + top + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.2"/>' +
      '<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.2"/>' +
      '<text x="' + (left-20) + '" y="' + (top-8) + '" font-size="8" font-weight="700" fill="var(--sub)">点</text>' +
      avgLine + barEls +
    '</svg>';
  }
  return secHTML("過去7日間の食事バランス") +
    '<div class="card">' +
      (done.length===0
        ? '<div class="empty">この7日間はまだ記録がありません。<br>毎日のバランス得点が、左から古い順に7日ぶんの棒グラフになって並びます。</div>'
        : scoreTrendSVG() +
          '<div class="hint">今日を含む過去7日間を、左から古い順に表示しています（いちばん右が今日）。この7日間の記録は' + done.length + '日、平均は' + avg + '点です。' +
            '<b>うすい赤色の帯が70点以上の目標ゾーン</b>で、ここに入る日を週4日以上に。満点を目指す必要はありません。' +
            (done.length<7 ? '記録のない日はバーが空いています。' : '') + '</div>') +
    '</div>';
}

/* --- 経過（体重） --- */
/* ============================================================
   睡眠アクトグラム(過去30日・21時起点のシングルプロット)
   ・縦軸=日付(上から古い順に30日)。1行=その日付の睡眠記録
     (前夜の就寝〜当日の起床)。
   ・横軸は21時起点の24時間(シングルプロット)。「前日21時〜当日21時」
     を1行に描くため、夜間の睡眠が途中で切れずに1本の帯として収まる。
   ・黒=睡眠、赤=昨晩の睡眠、薄いグレー=記録のない日。
     覚醒の背景は曜日で塗り分ける(平日=白、土曜=ごく薄いsteelblue、
     日曜=lightpink)。平日と週末のリズムの差を読み取るため。
   ・データが30日に満たなくても、30日の枠を常に表示する。
   ============================================================ */
const ACTO_START = 21;                 // 横軸の起点時刻(21時)
const ACTO_SLEEP = "#26261F";          // 睡眠(黒)
const ACTO_LAST  = "#C62828";          // 昨晩の睡眠(赤)
const ACTO_SAT   = "#E4EDF5";          // 土曜の背景(ごく薄いsteelblue)
const ACTO_SUN   = "lightpink";        // 日曜の背景
function actogramRows(){
  const parts = TODAY.split("-").map(Number);
  const keyOf = function(off){ return dateKey(new Date(parts[0], parts[1]-1, parts[2]+off)); };
  /* normSleepWindow の時間軸は「記録日の前日0時」を0とする連続時間
     (24 = 記録日の0時)。行内の時間 t は t = 連続時間 - 21 とすると、
     t=0 が前日21時、t=3 が当日0時、t=24 が当日21時になる。 */
  const clip = function(a,b){ return [Math.max(0,Math.min(24,a)), Math.max(0,Math.min(24,b))]; };
  const rows = [];
  for(let off=-29; off<=0; off++){
    const d = S.days[keyOf(off)];
    const w = (d && d.sleep) ? normSleepWindow(d.sleep) : null;
    const bars = w ? [clip(w.bed - ACTO_START, w.wake - ACTO_START)] : [];
    const dt = new Date(parts[0], parts[1]-1, parts[2]+off);
    rows.push({ off:off, label:(dt.getMonth()+1)+"/"+dt.getDate(), dow:dt.getDay(),
      known: !!w, isLast: off===0, bars:bars });
  }
  return rows;
}
function actogramHTML(rows){
  const W = 340, left = 36, right = 8, top = 18, rh = 6.5, bottom = 6;
  const plotW = W - left - right;
  const x = function(h){ return left + plotW * h / 24; };     // 21時起点の24時間(シングルプロット)
  const H = top + rows.length*rh + bottom;
  const plotH = rows.length*rh;
  /* 重ね順: 曜日の背景 → 時刻グリッド → 睡眠バー → 枠・ラベル。
     バーを後に置くことで、短い帯がグリッド線に隠れない。 */
  let bg = '', grid = '', bars = '', labels = '';
  // 時刻目盛り: 行内の t=0 が21時。実時刻 = (21+t) % 24
  [0,3,6,9,12,15,18,21,24].forEach(function(t){
    labels += '<text x="' + x(t).toFixed(1) + '" y="' + (top-6) + '" font-size="7.5" fill="#9AA09B" text-anchor="middle">' + ((ACTO_START + t) % 24) + '</text>';
    grid += '<line x1="' + x(t).toFixed(1) + '" y1="' + top + '" x2="' + x(t).toFixed(1) + '" y2="' + (top+plotH) + '" stroke="#E4E4DE" stroke-width="0.6"/>';
  });
  // 日付の変わり目(0時 = t=3)を点線で強調
  grid += '<line x1="' + x(3).toFixed(1) + '" y1="' + top + '" x2="' + x(3).toFixed(1) + '" y2="' + (top+plotH) + '" stroke="#B9C0BA" stroke-width="1" stroke-dasharray="3 2"/>';
  const cell = function(hx, y, w, fill){
    return '<rect x="' + hx.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (rh-1).toFixed(1) + '" fill="' + fill + '"/>';
  };
  rows.forEach(function(r, i){
    const y = top + i*rh;
    // 背景(背面レイヤー): 平日=白 / 土曜=ごく薄いsteelblue / 日曜=lightpink / 記録なし=薄グレー
    const awakeFill = r.dow===6 ? ACTO_SAT : r.dow===0 ? ACTO_SUN : '#FFFFFF';
    bg += cell(x(0), y, plotW, r.known ? awakeFill : '#EFEFE9');
    // 睡眠バー(最終行=昨晩は赤)
    r.bars.forEach(function(seg){
      if(seg[1] > seg[0]) bars += cell(x(seg[0]), y, x(seg[1])-x(seg[0]), r.isLast ? ACTO_LAST : ACTO_SLEEP);
    });
    // 日付ラベルは1週間ごと(今日から7日刻みで遡る)
    if((rows.length-1-i) % 7 === 0){
      labels += '<text x="' + (left-4) + '" y="' + (y + rh - 1.5).toFixed(1) + '" font-size="7.5" fill="' + (r.isLast ? ACTO_LAST : '#9AA09B') + '" font-weight="' + (r.isLast ? '700' : '400') + '" text-anchor="end">' + r.label + '</text>';
    }
  });
  const frame = '<rect x="' + x(0).toFixed(1) + '" y="' + top + '" width="' + plotW.toFixed(1) + '" height="' + plotH.toFixed(1) + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
  return '<svg class="actogram-svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="過去30日の睡眠アクトグラム(21時起点の24時間)">' +
    bg + grid + bars + frame + labels + '</svg>';
}

/* --- CSV書き出し --- */
function csvCell(v){
  v = v==null ? "" : String(v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
/* --- CSV読み込み（復元） ---
   exportCSVが書き出した形式をそのまま読み戻す。列は見出し名で対応づけるため、
   列の並びが変わっていても復元できる。すでに記録がある日は上書きしない。 */
function parseCSVText(text){
  text = String(text||"").replace(/^﻿/, "");
  const rows=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){ cell+='"'; i++; }
        else inQ=false;
      } else cell+=c;
    } else if(c==='"'){ inQ=true; }
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(cell); cell="";
      if(row.length>1 || row[0]!=="") rows.push(row);
      row=[];
    } else cell+=c;
  }
  if(cell!=="" || row.length){ row.push(cell); if(row.length>1 || row[0]!=="") rows.push(row); }
  return rows;
}
function parseClockCell(s){
  s = String(s==null?"":s).trim();
  if(!s) return null;
  const next = /翌/.test(s);
  const m = s.replace(/[()（）翌\s]/g,"").match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  let h = Number(m[1]) + Number(m[2])/60;
  if(next) h += 24;
  return roundTime5(h);
}
function importDaysFromCSV(text){
  const rows = parseCSVText(text);
  if(rows.length < 2) return { error:"CSVの中身が読み取れませんでした。書き出したCSVファイルを選んでください。" };
  const head = rows[0].map(function(h){ return String(h||"").trim(); });
  const col = {}; head.forEach(function(h,i){ col[h]=i; });
  if(col["日付"]===undefined || col["主食_皿"]===undefined){
    return { error:"このファイルは本アプリのCSV形式ではないようです（「日付」「主食_皿」の列が見つかりません）。" };
  }
  const get = function(r,name){ const i=col[name]; return i===undefined ? "" : (r[i]===undefined ? "" : String(r[i]).trim()); };
  let imported=0, skipped=0, invalid=0;
  for(let ri=1; ri<rows.length; ri++){
    const r = rows[ri];
    const key = get(r,"日付");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(key) || dayIndexFromKey(key)==null){ invalid++; continue; }
    const existing = S.days[key];
    if(existing && (anyRecord(existing) || existing.weight!=="")){ skipped++; continue; }  // 既存の記録は守る
    const day = emptyDay();
    [["breakfast","朝食","朝食時刻"],["lunch","昼食","昼食時刻"],["dinner","夕食","夕食時刻"]].forEach(function(mk){
      const wasSkipped = get(r,mk[1])==="欠食";
      const t = parseClockCell(get(r,mk[2]));
      day.meals[mk[0]] = { skipped: wasSkipped, time: t==null ? day.meals[mk[0]].time : t };
    });
    day.sv["主食"]=num0(get(r,"主食_皿")); day.sv["副菜"]=num0(get(r,"副菜_皿")); day.sv["主菜"]=num0(get(r,"主菜_皿"));
    day.sv["乳製品"]=num0(get(r,"乳製品_皿")); day.sv["果物"]=num0(get(r,"果物_皿"));
    day.snacks = num0(get(r,"補食回数"));
    day.snackKinds = { confection: get(r,"菓子類")==="1", sweetDrink: get(r,"嗜好飲料")==="1" };
    day.weight = get(r,"体重kg");
    const bed = parseClockCell(get(r,"就寝時刻"));
    const wake = parseClockCell(get(r,"起床時刻"));
    day.sleep = { bed: bed==null ? null : (bed>=24 ? roundTime5(bed-24) : bed),
                  wake: wake==null ? null : (wake>=24 ? roundTime5(wake-24) : wake),
                  awak: num0(get(r,"夜間覚醒回数")) };
    DVS_GROUPS.forEach(function(g){ day.dvs[g.id] = get(r,"DVS_"+g.label)==="1"; });
    S.days[key] = normalizeDay(day);
    imported++;
  }
  if(imported>0) save();
  return { imported:imported, skipped:skipped, invalid:invalid };
}
function exportCSV(){
  const head = ["日付","朝食","朝食時刻","昼食","昼食時刻","夕食","夕食時刻",
    "主食_皿","副菜_皿","主菜_皿","乳製品_皿","果物_皿","補食回数","菓子類","嗜好飲料","体重kg","バランススコア"]
    .concat(["就寝時刻","起床時刻","睡眠時間h","夜間覚醒回数"])
    .concat(DVS_GROUPS.map(function(g){return "DVS_" + g.label;}));
  const rows = [head.map(csvCell).join(",")];
  Object.keys(S.days).sort().forEach(k=>{
    const d = S.days[k];
    if(!anyRecord(d) && d.weight==="") return; // 完全な未記録の日は出力しない
    const m = d.meals;
    const fmtTime = v => v.skipped ? "" : clockLabel(v.time,{csv:true});
    const eatLabel = v => v.skipped ? "欠食" : "摂取";
    const fb=function(v){ return v==null ? "" : clockLabel(v,{csv:true}); };
    const sl=d.sleep||{};
    const row=[k, eatLabel(m.breakfast), fmtTime(m.breakfast), eatLabel(m.lunch), fmtTime(m.lunch), eatLabel(m.dinner), fmtTime(m.dinner),
      d.sv["主食"], d.sv["副菜"], d.sv["主菜"], d.sv["乳製品"], d.sv["果物"],
      d.snacks, hasSnackKind(d,"confection")?1:0, hasSnackKind(d,"sweetDrink")?1:0, d.weight, (mealRecorded(d) && S.profile) ? dayScore(d, S.profile.targets) : "",
      sl.bed!=null?fb(sl.bed):"", sl.wake!=null?fb(sl.wake):"", sleepDur(sl)!=null?sleepDur(sl):"", sl.awak!=null?sl.awak:""
    ].concat(DVS_GROUPS.map(function(g){return (d.dvs && d.dvs[g.id]) ? 1 : 0;}));
    rows.push(row.map(csvCell).join(","));
  });
  const csv = "\uFEFF" + rows.join("\r\n"); // BOM付き: Excelの文字化け対策
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tonari-records.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

/* --- 記録リマインダー ---
   外部サーバーを使わない方針のため、Web Push(閉じたアプリへの配信)は使わない。
   その代わりに3段構えで記録漏れを防ぐ:
   1) アプリが開いている間(前面・背面タブ)は、設定時刻にOSの通知を表示
   2) ホーム画面に追加したアプリでは、未記録のあいだアイコンにバッジを表示
   3) 設定時刻を過ぎてアプリを開いたときは、画面内バナーで知らせる */
function reminderDue(){
  if(!S.reminder || !S.reminder.on) return false;
  if(!S.profile || !S.consent) return false;
  const d = S.days[TODAY];
  if(d && recorded(d)) return false;      // 今日の食事記録があれば何もしない
  const parts = String(S.reminder.time||"21:00").split(":");
  const target = Number(parts[0])*60 + Number(parts[1]||0);
  const nowD = new Date();
  return nowD.getHours()*60 + nowD.getMinutes() >= target;
}
function updateBadge(){
  if(!("setAppBadge" in navigator)) return;
  try{
    if(reminderDue()) navigator.setAppBadge(1).catch(function(){});
    else navigator.clearAppBadge().catch(function(){});
  }catch(e){}
}
function showReminderBanner(){

  div.id = "reminderToast";

  div.style.cssText = "position:fixed;top:12px;left:12px;right:12px;z-index:60;background:var(--deep);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;box-shadow:0 10px 30px rgba(38,52,46,.30);display:flex;gap:10px;align-items:center;max-width:536px;margin:0 auto";
  div.innerHTML = '<span style="font-size:18px" aria-hidden="true">⏰</span>' +
    '<div style="flex:1">今日の食事はまだ記録されていません。1分だけ、今日の分をつけませんか？</div>' +
    '<button id="remGo" style="flex-shrink:0;padding:8px 14px;border-radius:999px;border:none;background:var(--yuzu);color:#3D2E06;font-size:12px;font-weight:700">記録する</button>' +
    '<button id="remClose" aria-label="閉じる" style="flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font-size:14px;line-height:1">×</button>';
  document.body.appendChild(div);
  const remove = function(){ if(div.parentNode) div.parentNode.removeChild(div); };
  document.getElementById("remGo").addEventListener("click", function(){ remove(); checkupMode=false; aboutMode=false; tab="record"; render(); });
  document.getElementById("remClose").addEventListener("click", remove);

function fireReminderIfNeeded(){
  updateBadge();
  if(!reminderDue()) return;
  if(S.reminderFiredDate===TODAY){
    // 通知は1日1回。ただしアプリを開いた瞬間の画面内バナーは毎回出す
    if(!document.hidden) showReminderBanner();
    return;
  }
  S.reminderFiredDate = TODAY; save();
  const name = S.profile && S.profile.name ? S.profile.name + "さん、" : "";
  const body = name + "今日の食事はまだ記録されていません。1分だけ、今日の分をつけませんか？";
  if(("Notification" in window) && Notification.permission==="granted"){
    const fallback = function(){ try{ new Notification("となりの栄養士", {body:body, icon:"icon-192.png", tag:"tonari-reminder"}); }catch(e){} };
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        if(reg && reg.showNotification) reg.showNotification("となりの栄養士", {body:body, icon:"icon-192.png", badge:"icon-192.png", tag:"tonari-reminder"});
        else fallback();
      }).catch(fallback);
    } else fallback();
  }
  if(!document.hidden) showReminderBanner();
}

function render(){
  const nav=$("nav"), banner=$("banner");
  // 同意ゲート: 未同意 or 同意文書が改訂された場合は、同意するまで利用不可
  if(!S.consent || S.consent.version!==CONSENT_VERSION){
    nav.style.display="none"; banner.innerHTML=""; $("footer").innerHTML=""; renderConsent(); return;
  }
  if(aboutMode){ nav.style.display = S.profile?"block":"none"; banner.innerHTML=""; $("footer").innerHTML=""; renderAbout(); return; }
  renderFooter();
  if(!S.profile){ nav.style.display="none"; banner.innerHTML=""; renderOnboarding(); return; }
  nav.style.display="block";
  $("tagline").textContent=(S.profile.name||"あなた") + "さんの食生活の見直しに、毎日そっと寄りそいます";
  if(checkupMode){ nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",false)); $("banner").innerHTML=""; renderCheckup(); return; }
  nav.querySelectorAll("button").forEach(b=> b.classList.toggle("on", b.dataset.tab===tab));
  const stale = S.promise && S.promiseWeek!==undefined && S.promiseWeek!==WEEK_IDX;
  banner.innerHTML = (S.promise && tab==="home")
    ? '<div class="promise-banner"><span class="disp" style="font-weight:700;flex-shrink:0">' + (stale?"継続中の約束":"今週の約束") + '</span><span style="line-height:1.5">' + esc(S.promise) + (stale?'<span style="opacity:.75">（新しい週のラインナップが「計画」に届いています）</span>':"") + '</span></div>' : "";
  ({home:renderHome, record:renderRecord, plan:renderPlan, recipe:renderRecipe, report:renderReport})[tab]();
}

function initMascotTail(){
  const tail = document.querySelector(".brand-mascot-tail");
  if(!tail || typeof tail.animate !== "function") return;
  const reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  const rand = (min,max)=> min + Math.random() * (max-min);
  let timer = null, motion = null;
  function clearTail(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(motion){ motion.cancel(); motion = null; }
    tail.style.animation = "none";
    tail.style.transform = "rotate(0deg)";
  }
  function scheduleTail(){
    if(reduce && reduce.matches){ clearTail(); return; }
    if(document.hidden){ timer = setTimeout(scheduleTail, 1200); return; }
    tail.style.animation = "none";
    const vigor = rand(.72, 1.22);
    const duration = rand(3600, 6900);
    const pause = rand(300, 1900);
    motion = tail.animate([
      { transform:"rotate(0deg)", offset:0 },
      { transform:"rotate(" + (10.8*vigor).toFixed(1) + "deg)", offset:.14 },
      { transform:"rotate(" + (-14.4*vigor).toFixed(1) + "deg)", offset:.34 },
      { transform:"rotate(" + (8.1*vigor).toFixed(1) + "deg)", offset:.55 },
      { transform:"rotate(" + (-4.5*vigor).toFixed(1) + "deg)", offset:.76 },
      { transform:"rotate(0deg)", offset:.9 },
      { transform:"rotate(0deg)", offset:1 }
    ], { duration:duration, easing:"ease-in-out", iterations:1, fill:"forwards" });
    motion.onfinish = function(){
      motion = null;
      tail.style.transform = "rotate(0deg)";
      timer = setTimeout(scheduleTail, pause);
    };
  }
  function restartTail(){
    clearTail();
    if(!(reduce && reduce.matches)) timer = setTimeout(scheduleTail, rand(120, 900));
  }
  if(reduce){
    if(reduce.addEventListener) reduce.addEventListener("change", restartTail);
    else if(reduce.addListener) reduce.addListener(restartTail);
  }
  document.addEventListener("visibilitychange", restartTail);
  restartTail();
}
initMascotTail();
render();
save();
/* 日またぎ対策: ホーム画面アプリ(PWA)は開いたまま日をまたぐことがあるため、
   アプリに戻ったとき・および定期チェックで日付が変わっていたら再読み込みして
   「今日」を取り直す（記録が前日の日付に書き込まれるのを防ぐ）。 */
function reloadIfDateChanged(){
  if(!document.hidden && dateKey(new Date())!==TODAY) location.reload();
}
function minuteTick(){
  reloadIfDateChanged();
  fireReminderIfNeeded();
}
document.addEventListener("visibilitychange", minuteTick);
setInterval(minuteTick, 60000);
fireReminderIfNeeded();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(function(){ /* 非対応環境では何もしない */ });
}
