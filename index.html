<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C4A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="となりの栄養士">
<title>となりの栄養士</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* 外部フォント(CDN)は使わず、端末内のシステムフォントのみで動作（外部通信を発生させない） */
:root{
  --bg:#F3F7F4; --ink:#26342E; --sub:#5E6F67; --green:#2C6B57; --deep:#1C4A3B;
  --pale:#E3EFE8; --yuzu:#E5A93C; --ume:#B9484F; --line:#D8E2DC; --card:#FFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.disp{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;cursor:pointer}
input,select{font-family:inherit;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}
header{padding:18px 2px 14px}
.brand-head{display:flex;align-items:center;gap:12px}
.brand-mascot-wrap{position:relative;display:block;width:92px;max-width:26vw;aspect-ratio:360/178;flex:0 0 auto}
.brand-mascot-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.brand-mascot-tail{z-index:1;transform-origin:76% 82%;animation:tail-sway 5.2s ease-in-out infinite;will-change:transform}
.brand-mascot-body{z-index:2}
.appname{font-size:23px;font-weight:900;color:var(--deep)}
.appname small{font-size:10px;font-weight:700;color:var(--green);letter-spacing:.12em;margin-left:8px}
.tagline{font-size:11px;color:var(--sub);margin-top:2px}
.today-date{display:inline-block;margin-top:8px;background:var(--deep);color:#fff;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.weight-trend-svg text{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.kicker{font-size:10px;letter-spacing:.15em;color:var(--green);font-weight:700}
.sec-title{font-size:19px;font-weight:700;margin-bottom:10px}
.label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;display:block}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-weight:700}
.chip.on{border-color:var(--green);background:var(--pale);color:var(--deep)}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;border:1.5px solid var(--line);background:#fff;color:var(--ink);margin-bottom:6px;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif}
.opt.on{border-color:var(--green);background:var(--pale);font-weight:700}
.btn-main{width:100%;padding:14px;border-radius:12px;border:none;background:var(--green);color:#fff;font-size:15px;font-weight:700}
.btn-main:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}
.score-card{background:var(--deep);border:none;color:#fff}
.score-num{font-size:42px;font-weight:900;line-height:1.1}
.note{display:flex;background:#FFFEFA;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.note .edge{width:6px;flex-shrink:0}
.note .body{padding:12px 14px}
.note .t{font-size:13px;font-weight:700;margin-bottom:4px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.note .b{font-size:13px;line-height:1.85;color:var(--sub)}
.tomorrow{background:#FFFCF4;border:1.5px solid #EFD9A0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:8px;font-size:16px}
.st-minus{border:1px solid var(--line);background:#fff;color:var(--ink)}
.st-plus{border:none;background:var(--green);color:#fff}
.st-val{width:28px;text-align:center;font-weight:700;font-size:17px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.meal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.time-val{width:58px;font-size:13px;font-weight:700;color:var(--ink);text-align:right}
.time-grid{display:grid;gap:10px;margin-top:8px}
.sleep-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.meal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.time-col{min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 2px 0}
.time-col .time-label{font-size:13px;font-weight:700;text-align:center}
.time-col .time-val{width:auto;min-height:20px;text-align:center;white-space:nowrap}
.time-col .skip-btn{width:100%;max-width:62px;padding:6px 6px}
.time-col .stepper{margin-top:48px}
.v-slider{height:172px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;gap:4px}
.v-slider input[type=range]{width:132px;height:34px;accent-color:var(--green);transform:rotate(-90deg)}
.v-end{font-size:9px;line-height:1;color:var(--sub)}
.skip-btn{font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700}
.skip-btn.on{border-color:var(--ume);background:#FBF1F1;color:var(--ume)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .inner{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 12px;border:none;background:none;color:var(--sub)}
nav button.on{color:var(--deep)}
nav .ic{font-size:16px}
nav .lb{font-size:11px;font-weight:700}
.weekly-score-svg text{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.8}
.empty{text-align:center;padding:26px 8px;color:var(--sub);font-size:13px;line-height:1.9}
.dvs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dvs-btn{min-height:88px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:9px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
.dvs-btn.on{border-color:var(--green);background:var(--pale)}
.dvs-icon{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(38,52,46,.10))}
.dvs-head{display:flex;align-items:center;gap:5px;min-width:0}
.dvs-kana{display:inline-grid;place-items:center;flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:#EEE;color:var(--sub);font-size:11px;font-weight:700}
.dvs-btn.on .dvs-kana{background:var(--green);color:#fff}
.dvs-label{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.dvs-ex{display:block;font-size:9px;color:var(--sub);margin-top:4px;line-height:1.45}
.mini-icon{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(38,52,46,.10));flex:0 0 auto}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.time-illust{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(38,52,46,.10))}
.stat{background:var(--pale);border-radius:10px;padding:12px 4px;text-align:center}
.stat .k{font-size:10px;color:var(--sub);font-weight:700}
.stat .v{font-size:21px;font-weight:900;color:var(--deep);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.stat .s{font-size:10px;color:var(--sub)}
.promise-banner{display:flex;gap:8px;align-items:center;background:#FFF8E8;border:1px solid #EFD9A0;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#7A5A12}
.promise-modal{position:fixed;inset:0;z-index:30;background:rgba(45,58,50,.28);display:flex;align-items:center;justify-content:center;padding:20px}
.promise-dialog{width:min(440px,100%);background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(45,58,50,.18);padding:18px}
.fadein{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes tail-sway{
  0%,100%{transform:rotate(0deg)}
  14%{transform:rotate(10.8deg)}
  34%{transform:rotate(-14.4deg)}
  55%{transform:rotate(8.1deg)}
  76%{transform:rotate(-4.5deg)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){
  .brand-mascot-wrap{width:78px}
  .dvs-btn{grid-template-columns:46px minmax(0,1fr);gap:7px;padding:9px}
  .dvs-icon{width:46px;height:46px}
  .mini-icon,.time-illust{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-head">
      <span class="brand-mascot-wrap" role="img" aria-label="となりの栄養士のマスコット">
        <img class="brand-mascot-layer brand-mascot-tail" src="wata-tail.png" alt="" aria-hidden="true">
        <img class="brand-mascot-layer brand-mascot-body" src="wata-body.png" alt="" aria-hidden="true">
      </span>
      <div>
        <div class="appname disp">となりの栄養士<small>NUTRITION COMPANION</small></div>
        <div class="tagline" id="tagline">食生活の記録とふりかえりを、いつでも手のひらに</div>
      </div>
    </div>
    <div class="today-date disp" id="todayDate"></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <div id="footer"></div>
</div>
<nav id="nav" style="display:none">
  <div class="inner">
    <button data-tab="home"><div class="ic">◉</div><div class="lb">ホーム</div></button>
    <button data-tab="record"><div class="ic">✎</div><div class="lb">記録</div></button>
    <button data-tab="plan"><div class="ic">◇</div><div class="lb">計画</div></button>
    <button data-tab="report"><div class="ic">↗</div><div class="lb">経過</div></button>
  </div>
</nav>

<script>
"use strict";
/* ============================================================
   となりの栄養士 — 単一HTML版
   データはこの端末のブラウザ内(localStorage)に自動保存されます。
   ============================================================ */

/* ---------- 日付 ---------- */
const now = new Date();
const dateKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const TODAY = dateKey(now);
const WD = ["日","月","火","水","木","金","土"];
document.getElementById("todayDate").textContent =
  now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日（" + WD[now.getDay()] + "）";
// 日替わりでコメントの言い回しを変えるための種。
// UTCではなくローカル(端末)の日付で切り替わるようにオフセットを補正する。
// 記録キー(dateKey)由来の日番号と一致するため、週番号(WEEK_IDX)ともズレない。
const daySeed = Math.floor((now.getTime() - now.getTimezoneOffset()*60000) / 86400000);
const pick = (arr, salt) => arr[(daySeed + salt) % arr.length];
function stableHash(text){
  let h = 2166136261;
  String(text || "").split("").forEach(function(ch){
    h ^= ch.charCodeAt(0);
    h = Math.imul(h, 16777619);
  });
  return h >>> 0;
}

/* ---------- 時刻入力（5分刻み） ---------- */
const TIME_STEP_PER_HOUR = 12; // 60分 / 5分
function roundTime5(v){
  if(v==null || v==="") return null;
  const n=Number(v);
  if(isNaN(n)) return null;
  return Math.round(n*TIME_STEP_PER_HOUR)/TIME_STEP_PER_HOUR;
}
function clockLabel(v, opt){
  const n=roundTime5(v);
  if(n==null) return "";
  let h=Math.floor(n), m=Math.round((n-h)*60);
  if(m>=60){ h+=1; m=0; }
  const next=h>=24;
  const shown=next ? h-24 : h;
  const mm=String(m).padStart(2,"0");
  if(!next) return shown + ":" + mm;
  return (opt&&opt.csv) ? shown + ":" + mm + "(翌)" : "翌" + shown + ":" + mm;
}
function timeMinutes(v, fallbackHour){
  const n=roundTime5(v);
  const h=n==null ? fallbackHour : n;
  return Math.round(h*60);
}
function hourFromMinutes(min){
  const n=Number(min);
  return isNaN(n) ? null : roundTime5(n/60);
}

/* ---------- 保存（端末内・自動） ---------- */
let memoryStore = {};
function load(){
  try { const s = localStorage.getItem("tonari-data"); return s ? JSON.parse(s) : null; }
  catch(e){ return memoryStore.data || null; }
}
function save(){
  try { localStorage.setItem("tonari-data", JSON.stringify(S)); }
  catch(e){ memoryStore.data = S; }
}

/* ---------- 状態 ---------- */
const emptyDay = () => ({
  sleep:{ bed:null, wake:null, awak:0 },   // 昨晩の就寝時刻/今朝の起床時刻(時, 小数可)/夜間覚醒回数
  meals:{ breakfast:{skipped:false,time:7}, lunch:{skipped:false,time:12}, dinner:{skipped:false,time:19} },
  sv:{ "主食":0, "副菜":0, "主菜":0, "乳製品":0, "果物":0 },
  dvs:{},   // 食品摂取多様性: その日に食べた食品群 {群id:true}
  snackKinds:{}, // 控えめにしたい間食の種類 {confection:true, sweetDrink:true}。DVS計算には使わない
  snacks:0, weight:""
});

/* ---------- 睡眠の算出（健康づくりのための睡眠ガイド2023 準拠） ----------
   ・就寝(bed)は前夜なので 0-12時台は翌日扱い(+24)で睡眠時間を計算
   ・睡眠時間(量): 成人は6時間以上が目安、長すぎ(>9h)も注意
   ・中途覚醒(質): 0回が理想、3回以上で睡眠休養感が下がりやすい
   ・睡眠中点(タイミング/規則性の基礎): (就寝+起床)/2 */
function normSleepWindow(sl){
  if(sl==null || sl.bed==null || sl.wake==null) return null;
  let bed = Number(sl.bed), wake = Number(sl.wake);
  if(isNaN(bed) || isNaN(wake)) return null;
  if(bed < 12) bed += 24;             // 0-11時就寝は当日未明として翌日側に
  if(wake <= 18) wake += 24;           // 起床は当日朝〜昼として翌日側に
  let dur = wake - bed;
  if(dur < 0) dur += 24;
  // 現実的でない組み合わせは無効扱いにする（入力ミスの誤判定を防ぐ）
  if(dur < 2 || dur > 14) return null;
  return { bed:bed, wake:bed+dur, dur:dur };
}
function sleepDur(sl){
  const w = normSleepWindow(sl);
  return w ? Math.round(w.dur*10)/10 : null;
}
function sleepMid(sl){
  const w = normSleepWindow(sl);
  if(!w) return null;
  let mid = w.bed + w.dur/2;
  return mid>=24 ? mid-24 : mid;
}
function wakeAdj(sl){ const w = normSleepWindow(sl); return w ? w.wake : null; }
function circDiffHour(a,b){
  // 時刻差を -12〜+12 時間に収める。23時と1時のような日付境界の誤差を防ぐ。
  return ((a - b + 36) % 24) - 12;
}
function circMeanHour(arr){
  if(!arr || !arr.length) return null;
  let sx=0, sy=0;
  arr.forEach(function(h){
    const rad = (h/24) * 2 * Math.PI;
    sx += Math.cos(rad); sy += Math.sin(rad);
  });
  let ang = Math.atan2(sy/arr.length, sx/arr.length);
  if(ang < 0) ang += 2*Math.PI;
  return +(ang/(2*Math.PI)*24).toFixed(1);
}
function circSDHour(arr){
  if(!arr || !arr.length) return null;
  const m = circMeanHour(arr);
  const v = arr.reduce(function(a,h){ const d=circDiffHour(h,m); return a + d*d; },0)/arr.length;
  return +Math.sqrt(v).toFixed(1);
}

/* --- DVS 10食品群（さあにぎやかいただく） ---
   熊谷ら, 日本公衆衛生雑誌 2003;50(12):1117-1124 の食品摂取多様性得点。
   週の摂取頻度で得点化: 過去7日間で6日以上食べた群=1点、合計0〜10点 */
const DVS_GROUPS = [
  { id:"sakana", kana:"さ", label:"魚介類", ex:"焼き魚・刺身・ツナ缶など", icon:"sakana.png" },
  { id:"abura",  kana:"あ", label:"油脂",   ex:"炒め物・揚げ物・ドレッシングなど", icon:"abura.png" },
  { id:"niku",   kana:"に", label:"肉",     ex:"牛・豚・鶏・ひき肉など", icon:"niku.png" },
  { id:"gyunyu", kana:"ぎ", label:"牛乳・乳製品", ex:"牛乳・ヨーグルト・チーズなど", icon:"gyunyu.png" },
  { id:"yasai",  kana:"や", label:"緑黄色野菜", ex:"にんじん・トマト・ほうれん草など", icon:"yasai.png" },
  { id:"kaiso",  kana:"か", label:"海藻",   ex:"わかめ・のり・ひじきなど", icon:"kaiso.png" },
  { id:"imo",    kana:"い", label:"いも",   ex:"じゃがいも・さつまいも・里いもなど", icon:"imo.png" },
  { id:"tamago", kana:"た", label:"卵",     ex:"ゆで卵・卵焼き・炒り卵など", icon:"tamago.png" },
  { id:"daizu",  kana:"だ", label:"大豆製品", ex:"豆腐・納豆・味噌など", icon:"daizu.png" },
  { id:"kudamono", kana:"く", label:"果物", ex:"生の果物・冷凍フルーツなど", icon:"kudamono.png" },
];
function dvsCount(d){
  if(!d.dvs) return 0;
  return DVS_GROUPS.filter(function(g){return d.dvs[g.id];}).length;
}
const SNACK_KIND_INFO = [
  { id:"confection", label:"菓子類", ex:"チョコ・クッキー・菓子パン・スナック菓子など", icon:"confection.png" },
  { id:"sweetDrink", label:"嗜好飲料", ex:"加糖コーヒー・ジュース・スポーツ飲料・甘い炭酸など", icon:"sweet_drink.png" },
];
function snackKinds(d){
  if(!d.snackKinds) d.snackKinds={};
  return d.snackKinds;
}
function hasSnackKind(d,id){ return !!(d && d.snackKinds && d.snackKinds[id]); }
function snackKindRecorded(d){
  return SNACK_KIND_INFO.some(function(g){ return hasSnackKind(d,g.id); });
}
function snackTrend(){
  const out={ days:0, snackDays:0, confectionDays:0, sweetDrinkDays:0, bothDays:0 };
  for(let i=0;i<7;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(!d) continue;
    out.days++;
    if(snackKindRecorded(d)) out.snackDays++;
    if(hasSnackKind(d,"confection")) out.confectionDays++;
    if(hasSnackKind(d,"sweetDrink")) out.sweetDrinkDays++;
    if(hasSnackKind(d,"confection") && hasSnackKind(d,"sweetDrink")) out.bothDays++;
  }
  return out;
}
function dvsUsed(d){
  return !!(d && d.dvs && DVS_GROUPS.some(function(g){ return d.dvs[g.id]; }));
}
function num0(v){
  const n = Number(v);
  return isFinite(n) ? n : 0;
}
function normTimeInput(v, fallback){
  const n = roundTime5(v);
  if(n==null) return fallback;
  return Math.max(0, Math.min(30, n));
}
function normalizeDay(raw){
  const base = emptyDay();
  if(!raw || typeof raw!=="object") return base;
  const d = Object.assign({}, base, raw);
  const rSleep = raw.sleep && typeof raw.sleep==="object" ? raw.sleep : {};
  d.sleep = {
    bed: normTimeInput(rSleep.bed, base.sleep.bed),
    wake: normTimeInput(rSleep.wake, base.sleep.wake),
    awak: Math.max(0, Math.round(num0(rSleep.awak)))
  };
  const rMeals = raw.meals && typeof raw.meals==="object" ? raw.meals : {};
  d.meals = {};
  ["breakfast","lunch","dinner"].forEach(function(k){
    const src = rMeals[k] && typeof rMeals[k]==="object" ? rMeals[k] : {};
    d.meals[k] = {
      skipped: !!src.skipped,

/* 過去7日間(今日を含む)の頻度からDVSを算出
   返り値: {score:0-10, days:記録日数, freq:{群id:日数}, missing:[ほぼ食べていない群]} */
function dvsWeekly(){
  const freq={}; let days=0;
  DVS_GROUPS.forEach(function(g){freq[g.id]=0;});
  for(let i=0;i<7;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(d && mealRecorded(d)){
      days++;
      DVS_GROUPS.forEach(function(g){ if(d.dvs && d.dvs[g.id]) freq[g.id]++; });
    }
  }
  const score = DVS_GROUPS.filter(function(g){return freq[g.id]>=6;}).length;
  const missing = DVS_GROUPS.filter(function(g){return freq[g.id]<=1;});
  return { score:score, days:days, freq:freq, missing:missing };
}

/* ---------- アセスメント計算 ----------
   基礎代謝量: 国立健康・栄養研究所の式（Ganpule et al., 2007）
   ((0.1238 + 0.0481×体重kg + 0.0234×身長cm − 0.0138×年齢 − 性別項)×1000)/4.186
   性別項: 男性 = 0.5473×1, 女性 = 0.5473×2

   Eur J Clin Nutr 61(11):1256-1261, 2007. */
function bmr(w,h,age,sexF){
  return ((0.1238 + 0.0481*w + 0.0234*h - 0.0138*age - 0.5473*(sexF?2:1))*1000)/4.186;
}

   目安範囲内は満点、下回る/上回る場合も0点にせず距離に応じて部分点を与える。 */
function foodGuideRange(k, targets){
  const keys = Object.keys(targets);
  const i = keys.indexOf(k);
  const grainTarget = Number(targets[keys[0]]||0);
  if(i===0) return grainTarget<=5 ? [4,5] : grainTarget<=6 ? [5,7] : [7,8];
  if(i===1) return grainTarget>=7 ? [6,Infinity] : [5,Infinity]; // 副菜は上限を設けない

  if(i===3) return grainTarget>=7 ? [2,3] : [2,2];

  if(!isFinite(upper) || v <= upper) return maxPoint;
  return Math.max(0, Math.round(maxPoint - maxPoint * (v - upper) / upper));

  if(!d.meals.dinner.skipped && d.meals.dinner.time < 21) s += 10;

function practicalAdvice(p){
  // 目標・年齢に合わない案(増量/減量/血圧/高齢期向け)は候補から外す
  const pool = PRACTICAL_FOOD_IDEAS.filter(function(t){
    if(/増量/.test(t) && p.goal!=="gain") return false;
    if(/減量/.test(t) && p.goal!=="loss") return false;
    if(/血圧/.test(t) && p.goal!=="bp") return false;
    if(/高齢期/.test(t) && p.age<65) return false;
    return true;
  });
  return pick(pool, 47);
}
function dvsWeekTracked(){
  const v=dvsWeekly();
  return v.days>=4 && DVS_GROUPS.some(function(g){return v.freq[g.id]>0;});
}
function weeklyDvsMiss(id, maxDays){
  const v=dvsWeekly();
  return dvsWeekTracked() && v.freq[id]<=maxDays;
}

function addAdviceVariants(basePri, title, when, variants){
  variants.forEach(function(text, i){
    ADVICE.push({
      pri:basePri + i/1000,
      key:title,
      variant:i+1,
      title:title,
      when:when,
      body:function(p,d){ return typeof text==="function" ? text(p,d) : text; }
    });
  });
}
addAdviceVariants(5.05, "朝食の整え方", (p,d)=> d.meals.breakfast.skipped, [

function adviceKey(a){
  const raw = String((a && (a.key || a.title)) || "").replace(/\s+\d+$/,"");
  if(/朝食/.test(raw)) return "朝食";
  if(/昼食|夕食|時間帯|リズム|分食/.test(raw)) return "食事時刻";
  if(/副菜|野菜|食物繊維|海藻|いも|きのこ/.test(raw)) return "副菜";
  if(/主菜|たんぱく質|魚|肉|卵|大豆/.test(raw)) return "主菜";
  if(/主食|エネルギー|ごはん|パン|麺/.test(raw)) return "主食";
  if(/乳製品|カルシウム|牛乳/.test(raw)) return "乳製品";
  if(/果物/.test(raw)) return "果物";

  if(/補食/.test(raw)) return "補食";
  if(/減塩|血圧/.test(raw)) return "減塩";

}
/* --- 文の重なり検出（コメント合成の冗長防止） ---
   句読点を除いた2つの文字列の最長共通部分文字列長を返す。
   同じ言い回し(「〜で十分です」の連続など)を機械的に避けるために使う。 */
function commonRunLen(a,b){
  a=String(a||"").replace(/[。、！？\s（）()「」]/g,"");
  b=String(b||"").replace(/[。、！？\s（）()「」]/g,"");
  var best=0;
  for(var i=0;i<a.length;i++){
    for(var j=0;j<b.length;j++){
      var k=0;
      while(i+k<a.length && j+k<b.length && a[i+k]===b[j+k]) k++;
      if(k>best) best=k;
    }
  }
  return best;
}
function lastSentence(text){
  var parts=String(text||"").split("。").filter(function(s){return s.trim();});
  return parts.length ? parts[parts.length-1] : "";
}
/* 締め句を選ぶ。本文の最後の文と言い回しが重なるもの・同日ですでに
   使ったものは避けて、定型文の繰り返し感が出ないようにする。 */
function pickSoftener(body, salt, used){
  var tail=lastSentence(body);
  var n=SOFTENERS.length;
  for(var i=0;i<n;i++){
    var cand=SOFTENERS[(((daySeed+salt)%n)+n+i)%n];
    if(used && used.indexOf(cand)>=0) continue;
    if(commonRunLen(tail,cand)>=5) continue;
    return cand;
  }
  return SOFTENERS[(daySeed+salt)%n];
}
/* コメントのテーマ分類（同日に同じテーマが並ばないようにするための粗い分類） */
function noteTopicKey(t){
  t=String(t||"");
  if(/朝食|朝は|朝の/.test(t)) return "朝食";
  if(/乳製品|ヨーグルト|牛乳|チーズ|カフェオレ|カフェラテ|カルシウム/.test(t)) return "乳製品";
  if(/果物|バナナ|みかん|キウイ|フルーツ/.test(t)) return "果物";
  if(/菓子|甘い飲み物|嗜好飲料|無糖/.test(t)) return "間食";
  if(/補食/.test(t)) return "補食";
  if(/副菜|野菜|わかめ|海藻|きのこ|食物繊維/.test(t)) return "副菜";
  if(/主菜|卵|豆腐|納豆|魚|肉|たんぱく/.test(t)) return "主菜";
  if(/主食|ごはん|パン|麺/.test(t)) return "主食";
  if(/夕食|分食/.test(t)) return "夕食";
  if(/睡眠|布団|寝|起き/.test(t)) return "睡眠";
  if(/体重|測/.test(t)) return "体重";
  if(/種類|グループ|多様性|にぎやか/.test(t)) return "多様性";
  if(/12時間|時間帯/.test(t)) return "食事時刻";
  if(/記録/.test(t)) return "記録";
  return "他";
}
function adviceRecentPenalty(a){
  const key = adviceKey(a);
  const hist = Array.isArray(S.adviceHistory) ? S.adviceHistory.filter(function(h){ return h && h.date!==TODAY; }).slice(-40) : [];
  if(!hist.length) return 0;
  let penalty = 0;
  hist.forEach(function(h, idx){
    if(h.key===key){
      const recency = (idx+1) / hist.length;
      penalty += 2.2 + recency * 2.0;
    }
  });
  return penalty;
}
function adviceJitter(a, idx){
  return (stableHash(adviceKey(a) + "|" + TODAY + "|" + (a.variant||idx)) % 100) / 5000;
}
function selectAdvice(candidates){
  var scored = candidates.map(function(a, idx){
    return { a:a, score:a.pri + adviceRecentPenalty(a) + adviceJitter(a, idx) };
  }).sort(function(x,y){ return x.score-y.score; });
  // 同じ日に同系統(朝食×2、間食×2など)の助言が並ばないよう、カテゴリを重複させずに2件選ぶ
  var out=[], usedKeys={};
  for(var i=0;i<scored.length && out.length<2;i++){
    var k=adviceKey(scored[i].a);
    if(usedKeys[k]) continue;
    usedKeys[k]=1;
    out.push(scored[i].a);
  }
  return out;
}
function rememberAdviceHistory(list){
  if(!Array.isArray(S.adviceHistory)) S.adviceHistory = [];
  let changed = false;
  list.forEach(function(a){
    const key = adviceKey(a);
    if(!S.adviceHistory.some(function(h){ return h && h.date===TODAY && h.key===key; })){
      S.adviceHistory.push({ date:TODAY, key:key, title:a.title || key });
      changed = true;
    }
  });
  if(S.adviceHistory.length>80){
    S.adviceHistory = S.adviceHistory.slice(-80);
    changed = true;
  }
  if(changed) save();
}

/* --- 合成: その日のノート一式を生成（ほめ言葉は必ず1件以上） --- */
function commentSalt(p,d,tag){
  d = normalizeDay(d);
  const svPart = Object.keys(d.sv).map(function(k){ return k + ":" + d.sv[k]; }).join(",");
  const dvsPart = DVS_GROUPS.map(function(g){ return g.id + ":" + (d.dvs[g.id]?1:0); }).join(",");
  const snackPart = SNACK_KIND_INFO.map(function(g){ return g.id + ":" + (hasSnackKind(d,g.id)?1:0); }).join(",");
  const mealPart = ["breakfast","lunch","dinner"].map(function(k){
    const m=d.meals[k]; return k + ":" + (m.skipped?1:0) + ":" + m.time;
  }).join(",");
  return stableHash([TODAY, tag, p.goal, p.stage, d.snacks, mealPart, svPart, dvsPart, snackPart].join("|"));
}
function buildNotes(p, d, weekScores, ctx){
  d = normalizeDay(d);
  const notes = [];
  const saltBase = commentSalt(p,d,"notes");
  // 0) 記録日数の節目（通算）
  const milestones = {7:"1週間", 30:"1か月", 50:"50日", 100:"100日", 200:"200日", 365:"1年"};
  if(ctx && milestones[ctx.totalDays]){
    notes.push({ tone:"praise", title:"記録" + milestones[ctx.totalDays] + "の節目です",
      body:(p.name?p.name+"さん、":"") + "記録した日が通算" + ctx.totalDays + "日になりました。" +
        (ctx.totalDays>=100
          ? "ここまで続く方は本当にひと握りです。記録は、あなた専用の「体の取扱説明書」になりつつあります。これからは微調整の段階。一緒に磨き上げていきましょう。"
          : "食習慣の研究では、記録を続けること自体が行動変容のいちばんの推進力とされています。この調子で、無理なく積み重ねていきましょう。") });
  }
  // 1) ほめ言葉: 事実 + その延長線上のメリット（量・質・タイミング・規則性）
  //    ・2件目は「導入句」「事実のテーマ」が1件目と重ならないものだけを採用する
  //    ・前日に見せた事実テーマ・導入句はできるだけ避け、連日同じ文面になるのを防ぐ
  const facts = FACTS.filter(f => f.when(p,d,ctx));
  const factText = f => (typeof f.fact==="function"?f.fact(p,d,ctx):f.fact);
  const ydKey = dateKey(new Date(now.getTime() - 86400000));
  const yesterPraise = (S.praiseHistory||[]).filter(function(h){ return h && h.date===ydKey; });
  const yesterKeys = yesterPraise.map(function(h){ return h.key; });
  const yesterOpens = yesterPraise.map(function(h){ return h.open; });
  const praiseToday = [];
  const pickOpening = function(salt, avoid){
    let o = pick(OPENINGS, salt);
    let guard = 0;
    while((avoid.indexOf(o)>=0 || yesterOpens.indexOf(o)>=0) && guard<OPENINGS.length){
      o = OPENINGS[(OPENINGS.indexOf(o)+1) % OPENINGS.length];
      guard++;
    }
    return o;
  };
  if(facts.length){
    // 前日に見せたテーマ以外を優先（候補がそれしか無ければそのまま使う）
    const freshFacts = facts.filter(function(f){ return yesterKeys.indexOf(noteTopicKey(factText(f)))<0; });
    const pool1 = freshFacts.length ? freshFacts : facts;
    const f1 = pick(pool1, 1 + (saltBase % 997));
    const key1 = noteTopicKey(factText(f1));
    const open1 = pickOpening(2 + (saltBase % 991), []);
    praiseToday.push({ date:TODAY, key:key1, open:open1 });
    notes.push({ tone:"praise", title:"今日のよかったこと",
      body: open1 + factText(f1) + (f1.benefits[p.goal] || f1.benefits["default"]) });
    if(facts.length >= 2){
      let f2 = null;
      const scan = freshFacts.length>1 ? freshFacts : facts;
      const start = 2 + (Math.floor(saltBase/7) % 997);
      for(let i=0;i<scan.length;i++){
        const cand = scan[(start+i) % scan.length];
        if(cand===f1) continue;
        if(noteTopicKey(factText(cand))===key1) continue;   // 同じテーマのほめ言葉は重ねない
        f2 = cand; break;
      }
      if(f2){
        const open2 = pickOpening(6 + (Math.floor(saltBase/11) % 991), [open1]);
        praiseToday.push({ date:TODAY, key:noteTopicKey(factText(f2)), open:open2 });
        notes.push({ tone:"praise", title:"よかったこと、もうひとつ",
          body: open2 + factText(f2) + (f2.benefits[p.goal] || f2.benefits["default"]) });
      }
    }
    // 今日の選択を記録（選択は日内で決定論的なので、当日分は置き換えるだけでよい）
    const kept = (S.praiseHistory||[]).filter(function(h){ return h && h.date!==TODAY; });
    S.praiseHistory = kept.concat(praiseToday).slice(-8);
    save();
  }
  // 2) 週の流れのほめ言葉（条件付き）
  const good = weekScores.filter(s=>s>=70).length;
  if(good>=4){
    notes.push({ tone:"praise", title:"今週の流れ",
      body: pick([
        "この7日間で、バランススコア70点以上の日が" + good + "日。「まずまずの日を増やす」食べ方ができています。この続け方が、数か月後のからだづくりにつながっていきます。",
        "今週は70点超えが" + good + "日。満点の1日より、合格点の" + good + "日のほうがずっと価値があります。食生活は平均点で決まる、というお手本のような週です。",
        "週間成績、70点以上が" + good + "日です。良い日を「たまたま」から「いつものこと」に変えられていますね。この安定感は、外食や旅行があっても崩れにくい体の土台になります。",
      ], 14 + (Math.floor(saltBase/13) % 997)) });
  }
  // 3) アドバイス（最大2件）: 時期別前置き + 本文 + 締め句
  //    ・前置きと締め句は2件で同じものを使わない
  //    ・本文が「観察+理由+一手+締め」の合成式(composed)のときは、締め句を重ねない
  //    ・締め句は本文の最後の文と言い回しが重ならないものを選ぶ
  const adv = selectAdvice(ADVICE.filter(a=>a.when(p,d)));
  rememberAdviceHistory(adv);
  const usedPrefix=[], usedSoftener=[];
  adv.forEach((a,i)=>{
    const aSalt = commentSalt(p,d,"advice|" + adviceKey(a) + "|" + i);
    const prefixes = STAGE_PREFIX[p.stage];
    let prefix = pick(prefixes, 3+i+(aSalt%997));
    if(usedPrefix.indexOf(prefix)>=0) prefix = prefixes[(prefixes.indexOf(prefix)+1) % prefixes.length];
    usedPrefix.push(prefix);
    const body = a.body(p,d);
    let softener = "";
    if(!a.composed){
      softener = pickSoftener(body, 5+i+(Math.floor(aSalt/17)%997), usedSoftener);
      usedSoftener.push(softener);
    }
    notes.push({ tone:"advice", title:a.title, body: prefix + body + softener });
  });
  // 4) 旬のひとこと（3日に1回・枠が空いているとき）
  if(mealRecorded(d) && daySeed%3===0 && notes.length<4){
    const mon = now.getMonth();
    notes.push({ tone:"advice", title:"旬のひとこと（" + (mon+1) + "月）", body: pick(SEASONAL[mon], 12 + (Math.floor(saltBase/19)%997)) });
  }
  return notes.slice(0,4);
}
function buildNext(p,d){
  /* 優先度順に最大2件のおすすめを返す。
     ・完璧な日(汎用メッセージのみ該当)は1件にとどめ、
       具体的な助言があるときは汎用メッセージを2件目に混ぜない
     ・2件が同じテーマ(朝食×2、乳製品×2など)や似た言い回しに
       ならないよう、テーマと文面の重なりを見て選ぶ */
  const matched = NEXT.filter(x=>x.when(p,d)).sort((a,b)=>a.pri-b.pri);
  const out = [], topics = [];
  const saltBase = commentSalt(p,d,"next");
  for(let i=0;i<matched.length && out.length<2;i++){
    if(out.length===1 && matched[i].pri >= 9) break;
    const salt = out.length===0 ? 7 + (saltBase % 997) : 8 + (Math.floor(saltBase/23) % 997);
    const tx = pick(matched[i].v, salt);
    const tk = noteTopicKey(tx);
    if(out.length===1){
      if(tk!=="他" && topics.indexOf(tk)>=0) continue;
      if(commonRunLen(out[0], tx)>=12) continue;
    }
    topics.push(tk);
    out.push(tx);
  }
  return out.length ? out : null;
}


/* ============================================================
   ゲーム性 & ナッジ（行動経済学）
   ・streak: 連続記録日数（損失回避を利用。途切れを惜しむ心理）
   ・badges: 達成バッジ（進捗の可視化）
   ・challenge: 今日の小さな挑戦（実行意図 implementation intention）
   ============================================================ */
function getStreak(){
  var n=0;
  for(var i=0;;i++){
    var dt=new Date(now); dt.setDate(now.getDate()-i);
    var d=S.days[dateKey(dt)];
    if(d && anyRecord(d)) n++; else break;
  }
  return n;
}
function totalRecordedDays(){
  return Object.values(S.days).filter(anyRecord).length;
}
/* ============================================================
   健康偏差値（1〜99）※内部的にはレベル変数として保持
   画面上は詳細条件非公開（ブラックボックス）。内部ロジック:
   ・日次XP: 記録 + バランススコア + 朝食 + 21時前の夕食 + 副菜達成
            + 全グループ達成 + DVS + 体重記録 + 睡眠（1日最大43XP）
   ・連続記録倍率: 1.0〜1.5倍（14日連続で最大）
   ・週次ボーナス: 記録5日以上 / 朝食4日以上 / 早い夕食4日以上 /
            週DVS / 週平均睡眠 / 体重が目標方向に動いた週
            （週の定義は約束と同じ月曜はじまりに統一）
   ・レベル曲線: 必要累積XP = round(6.5 × L^1.8)
     提示表（Lv45=6147, Lv60=10318, Lv99=25413）と一致させる
   ・減点（Lv30以降）: レベル30以上のあいだは、未記録の日や
     不摂生な日（低スコア・朝食欠食・遅い夕食・副菜不足・DVS低値・
     控えたい間食・睡眠不足）に、XPが比例減衰する。ペナルティ率は
     急落しすぎないよう従来より緩め、降格時は肩書を「無職」とする。
     ペナルティが高い日は獲得XPも25〜75%に抑え、記録だけの上昇を防ぐ。
     「最初は上がりやすく、上に行くほど健康的な生活の継続が必要で、
      続かなければ偏差値も肩書も落ちる。ただしLv30までは既得の足場」設計。
   ・到達目安: ほぼ完璧な生活で Lv99 まで約1年（実測ベース）
   ・関門レベル(GATES=10,18,30,45,60,75,95): 定期アセスメントを
     完了するまで表示レベルがそこで止まり、先に進めない
   XPは保存せず、毎回全記録から決定論的に再計算する（改ざん・
   ズレ防止。記録こそが唯一のレベル源泉）。
   ============================================================ */
var GATES = [10,18,30,45,60,75,95];  // 院卒以降の各「昇進」に審査(定期アセスメント)を課す
var PENALTY_RATE = 0.004;             // pen6で0.4%/日相当。固定減点と併用し、急落を防ぎつつ降格可能性を残す
function dayXP(d,p){
  d = normalizeDay(d);
  if(!anyRecord(d)) return 0;
  var xp=0;
  if(recorded(d)) xp+=5;
  if(mealRecorded(d)){
    var sc=dayScore(d,p.targets);
    if(sc>=85) xp+=15; else if(sc>=70) xp+=10; else if(sc>=50) xp+=5;
    if(!d.meals.breakfast.skipped) xp+=2;
    if(!d.meals.dinner.skipped && d.meals.dinner.time<21) xp+=3;
    if(d.sv["副菜"]>=p.targets["副菜"]) xp+=3;
    if(Object.keys(p.targets).every(function(k){return d.sv[k]>=p.targets[k];})) xp+=6;
    if(dvsCount(d)>=7) xp+=2;   // 1日7種類以上(にぎやかな食卓)
  }
  if(d.weight!=="") xp+=2;
  if(sleepRecorded(d)){
    xp+=2;                                            // 睡眠を記録
    var sd=sleepDur(d.sleep);
    if(sd!=null && sd>=6 && sd<=9) xp+=3;             // 適正な睡眠時間
    if((d.sleep.awak||0)===0) xp+=2;                  // 中途覚醒なし
  }
  return xp;
}
/* --- Lv30以降の減点 ---
   XP獲得条件の裏返しをできるだけ対応させる。
   健康的な日（スコア50以上・朝食あり・21時前夕食・DVSが低すぎない・
   控えたい間食が少ない・睡眠6時間以上）は減点ゼロ。 */
function dayPenalty(d,p){
  d = normalizeDay(d);
  if(!d || !anyRecord(d)) return 6;            // 記録のない日
  var pen=0;
  if(mealRecorded(d)){
    var sc=dayScore(d,p.targets);
    if(sc<50) pen+=4;
    if(sc<35) pen+=2;

/* --- 時間栄養学の指標（複数日の食事時刻から算出） ---
   いずれも食事「中点」(midpoint = 朝食と夕食の中間時刻)を用いる。
   ・Eating Jet Lag (EJL): 週末と平日の食事中点のズレ(時間)。
     Zerón-Rugerio et al., Nutrients 2019;11(12):2980 で BMI との
     関連が報告された指標。|EJL|>=1h を要注意の目安とする。
   ・Interdaily Stability (IS): 食事タイミングの日間類似性(0〜1)。
     本来は概日リズム研究(van Someren 1999 等)の指標を食事時刻に応用。
     IS = 1 − (日々の中点の分散 / 全体平均まわりの分散)に相当する形で
     簡易算出。1に近いほど毎日同じリズム。 */
function mealMid(d){
  const t=[];
  ["breakfast","lunch","dinner"].forEach(function(k){ const m=d.meals[k]; if(!m.skipped) t.push(m.time); });
  if(!t.length) return null;
  return t.reduce((a,c)=>a+c,0)/t.length; // 摂取した食事時刻の平均を中点とする（昼のみの日も採用）
}
function chronoCtx(){
  // 直近14日から、記録のある日の {中点, 週末フラグ} を集める
  const wk=[], wd=[], all=[]; let noBreakfastDays=0, lateDinnerDays=0;
  for(let i=0;i<14;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(d && mealRecorded(d)){
      if(d.meals.breakfast.skipped) noBreakfastDays++;
      if(!d.meals.dinner.skipped && d.meals.dinner.time>=21) lateDinnerDays++;
      const mid=mealMid(d);
      if(mid!==null){
        const dow=dt.getDay();
        const weekend=(dow===0||dow===6);
        all.push(mid);
        (weekend?wk:wd).push(mid);
      }
    }
  }
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  let ejl=null;
  if(wk.length>=1 && wd.length>=2) ejl=+(mean(wk)-mean(wd)).toFixed(1);
  // Interdaily Stability（簡易版）: 全体平均まわりのばらつきが小さいほど高い
  let is=null;
  if(all.length>=5){
    const m=mean(all);
    const varTotal=mean(all.map(x=>(x-m)*(x-m)));
    // 中点が ±2h 散らばると IS≈0、ぴったり揃うと IS≈1 になるよう正規化
    is=Math.max(0, Math.min(1, 1 - varTotal/4));
    is=+is.toFixed(2);
  }
  return { ejl:ejl, is:is, weekendN:wk.length, weekdayN:wd.length, mealDays:all.length,
           noBreakfastDays:noBreakfastDays, lateDinnerDays:lateDinnerDays,
           meanMid:all.length?+mean(all).toFixed(1):null,
           weekendMean:wk.length?+mean(wk).toFixed(1):null,
           weekdayMean:wd.length?+mean(wd).toFixed(1):null };
}

/* --- 体重トレンド（直近7日平均 と その前7日平均 の比較） ---
   各窓に2回以上の計測がある場合のみ判定（疎なデータでの誤判定を防ぐ）。
   diff = 直近平均 − 前週平均（kg/週 に相当） */
function weightTrend(){
  const getW = (from,to)=>{
    const arr=[];
    for(let i=from;i<=to;i++){
      const dt=new Date(now); dt.setDate(now.getDate()-i);
      const d=S.days[dateKey(dt)];
      if(d){ const w=parseFloat(d.weight); if(!isNaN(w)) arr.push(w); }
    }
    return arr;
  };
  const recent=getW(0,6), prior=getW(7,13);
  if(recent.length<2 || prior.length<2) return null;
  const m=a=>a.reduce((x,y)=>x+y,0)/a.length;
  return { recent:+m(recent).toFixed(2), prior:+m(prior).toFixed(2),
           diff:+(m(recent)-m(prior)).toFixed(2), n:recent.length+prior.length };
}

/* --- 睡眠の規則性・週次指標（直近14日から算出） ---
   ・avgDur: 平均睡眠時間, shortDays: 6時間未満の日数
   ・midSD: 睡眠中点のばらつき(時間) 小さいほど規則的
   ・SRI簡易版: 連続する2日で「就寝〜起床の時間帯」が重なる割合の平均(0-100)
     Phillips et al. 2017 のSleep Regularity Indexの考え方を、
     就寝-起床区間の一致度で近似したもの。85以上で非常に規則的。
   ・socialJetlag: 平日と休日の睡眠中点差(時間) */
function sleepCtx(){
  const recs=[];
  for(let i=0;i<14;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(d && d.sleep && d.sleep.bed!=null && d.sleep.wake!=null){
      const w = normSleepWindow(d.sleep);
      if(w){
        recs.push({ dt:dt, dur:sleepDur(d.sleep), mid:sleepMid(d.sleep), awak:d.sleep.awak||0,
                    bed:w.bed, wake:w.wake });
      }
    }
  }
  if(recs.length<1) return { n:0 };
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const durs=recs.map(r=>r.dur);
  const mids=recs.map(r=>r.mid);
  const avgDur=+mean(durs).toFixed(1);
  const shortDays=durs.filter(d=>d<6).length;
  const longDays=durs.filter(d=>d>9).length;
  const awakAvg=+mean(recs.map(r=>r.awak)).toFixed(1);
  // 中点SD（円周統計）: 23時と1時を「2時間差」と扱う
  const mMid=circMeanHour(mids);
  const midSD=circSDHour(mids);
  const midVar=mean(mids.map(x=>{ const z=circDiffHour(x,mMid); return z*z; }));
  // IS(0-1): 中点のばらつきが小さいほど高い(±2hで0付近)
  const is=+Math.max(0,Math.min(1,1-midVar/4)).toFixed(2);
  // SRI簡易: 隣接日の「就寝時刻」と「起床時刻」のズレを点数化する。
  // 以前の睡眠区間一致率だけでは、週末の寝だめがあっても起きている時間帯の一致で高得点になりやすい。
  // そこで、就寝・起床の差をそれぞれ最大6時間で打ち切り、差が小さいほど100点に近づく簡易指標にする。
  let sri=null;
  if(recs.length>=2){
    const sorted=recs.slice().sort((a,b)=>b.dt-a.dt); // 新しい順
    let sum=0, pairs=0;
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i], b=sorted[i+1];
      const gap=Math.round((a.dt-b.dt)/86400000);
      if(gap!==1) continue;
      const bedDiff=Math.min(6, Math.abs(a.bed-b.bed));
      const wakeDiff=Math.min(6, Math.abs(a.wake-b.wake));
      const pairScore=Math.max(0, 100 - ((bedDiff+wakeDiff)/12)*100);
      sum += pairScore; pairs++;
    }
    if(pairs>0) sri=Math.round(sum/pairs);
  }
  // ソーシャルジェットラグ(平日 vs 休日の中点差)も円周差で算出
  const wd=[],we=[];
  recs.forEach(r=>{ const dow=r.dt.getDay(); (dow===0||dow===6?we:wd).push(r.mid); });
  let sjl=null;
  if(wd.length>=2 && we.length>=1) sjl=+circDiffHour(circMeanHour(we), circMeanHour(wd)).toFixed(1);
  return { n:recs.length, avgDur:avgDur, shortDays:shortDays, longDays:longDays,
           awakAvg:awakAvg, midSD:midSD, is:is, sri:sri, sjl:sjl };
}
/* --- 規則性の指標（複数日の記録から算出） --- */
function regCtx(){
  // 連続記録日数（今日を含む）
  let streak = 0;
  for(let i=0;;i++){
    const dt = new Date(now); dt.setDate(now.getDate()-i);
    const k = dateKey(dt);
    const d = S.days[k] ? normalizeDay(S.days[k]) : null;
    if(d && anyRecord(d)) streak++; else break;
  }
  // 直近7日（今日含む）の記録
  const days7 = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(now); dt.setDate(now.getDate()-i);
    const k = dateKey(dt);
    if(S.days[k]) days7.push(normalizeDay(S.days[k]));
  }
  const eaten = days7.filter(d=>mealRecorded(d));
  const bfTimes = eaten.filter(d=>!d.meals.breakfast.skipped).map(d=>d.meals.breakfast.time);
  const bfStable = bfTimes.length>=5 && (Math.max.apply(null,bfTimes)-Math.min.apply(null,bfTimes))<=1;
  const earlyDinners = eaten.filter(d=>!d.meals.dinner.skipped && d.meals.dinner.time<21).length;
  const weighDays = days7.filter(d=>d.weight!=="").length;
  return { streak:streak, bfStable:bfStable, earlyDinners:earlyDinners, weighDays:weighDays, eatenDays:eaten.length, totalDays: totalRecordedDays() };
}

/* --- 直近7日のスコア（今日を除く過去分） --- */
function pastWeek(){
  const out = [];
  for(let i=6;i>=1;i--){
    const dt = new Date(now); dt.setDate(now.getDate()-i);
    const k = dateKey(dt);
    if(S.days[k] && recorded(S.days[k]) && S.profile){
      out.push({ day: WD[dt.getDay()], score: dayScore(S.days[k], S.profile.targets) });
    }
  }
  return out;
}
function weightHistory(){
  const out = [];
  Object.keys(S.days).sort().forEach(k=>{
    const w = parseFloat(S.days[k].weight);
    if(!isNaN(w)) out.push({ key:k, label:k.slice(5).replace("-","/"), w });
  });
  return out.slice(-14);
}

    form.height=$("f_h").value; form.weight=$("f_w").value; form.pal=$("f_pal").value; };

  view.querySelectorAll("[data-stage]").forEach(b=> b.addEventListener("click",()=>{sync();form.stage=b.dataset.stage;renderOnboarding();}));

    sync();

    const w=+form.weight,h=+form.height,a=+form.age;
    const err = profileInputError(a,h,w,form.goal);

/* --- 約束の達成判定（週明けに実行） --- */
function weekDays(w){
  const out=[];
  Object.keys(S.days).forEach(function(k){
    const di=Math.floor(new Date(k).getTime()/86400000);
    if(Math.floor((di+3)/7)===w) out.push({k:k, d:S.days[k]});  // 月曜はじまり
  });
  return out;
}
function pendingPromiseJudgment(){
  S.promiseLog = S.promiseLog||[];
  // 1) 週が明けてまだ判定していない約束があれば判定する
  if(S.promise && S.promiseWeek!==undefined && WEEK_IDX>S.promiseWeek &&
     !S.promiseLog.some(function(e){return e.week===S.promiseWeek;})){
    const def = PROMISE_POOL.find(function(x){return x.t===S.promise;});
    if(def && def.chk){
      const ok = !!def.chk(weekDays(S.promiseWeek), S.profile);
      S.promiseLog.push({week:S.promiseWeek, t:S.promise, d:def.d, achieved:ok, auto:true});
      save();
    } else {
      return {type:"ask", t:S.promise, d:def?def.d:2};
    }
  }
  // 2) 直近の判定結果は「OK」を押すか新しい約束を選ぶまで表示し続ける
  //    (以前は一度描画されると消えてしまい、タブを切り替えると見逃していた)
  const last = S.promiseLog.length ? S.promiseLog[S.promiseLog.length-1] : null;
  if(last && WEEK_IDX>last.week && WEEK_IDX-last.week<=2 &&
     (S.promiseResultAck===undefined || S.promiseResultAck<last.week) &&
     !(S.promise && S.promiseWeek===WEEK_IDX)){
    return {type:"result", ok:!!last.achieved, t:last.t, week:last.week};
  }
  return null;
}
function reportPromise(ok, d){
  S.promiseLog = S.promiseLog||[];
  S.promiseLog.push({week:S.promiseWeek, t:S.promise, d:d, achieved:ok, auto:false});
  save(); render();
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const WEEK_IDX = Math.floor((daySeed+3)/7);  // 月曜はじまりの週番号
function weeklyPromises(){
  const p = S.profile || { goal:null };
  const rng = mulberry32(WEEK_IDX + 20260101);
  const recent = (S.promiseHistory||[]).slice(-3);
  const scored = PROMISE_POOL.map(function(x){
    var sc = rng();
    if(x.g && p.goal && x.g.indexOf(p.goal)>=0) sc += 0.35;
    if(recent.indexOf(x.t)>=0) sc -= 0.8;
    return { x:x, sc:sc };
  }).sort(function(a,b){ return b.sc-a.sc; });
  const out=[], cats={};
  scored.forEach(function(o){ if(out.length<6 && !cats[o.x.c]){ out.push(o.x); cats[o.x.c]=1; } });
  scored.forEach(function(o){ if(out.length<6 && out.indexOf(o.x)<0) out.push(o.x); });
  return out;
}

  '</div>';
  view.querySelectorAll("[data-pr]").forEach(b=> b.addEventListener("click",()=>{

    renderPlan();
  }));
  const py=$("promiseYes");
  if(py && pendingPromiseChoice) py.addEventListener("click",()=>commitWeeklyPromise(pendingPromiseChoice));
  const pn=$("promiseNo");
  if(pn) pn.addEventListener("click",()=>{ pendingPromiseChoice=null; renderPlan(); });
}
function commitWeeklyPromise(pr){
  S.promise = pr.t;
  S.promiseWeek = WEEK_IDX;
  S.promiseHistory = (S.promiseHistory||[]);
  if(S.promiseHistory.indexOf(pr.t)<0) S.promiseHistory.push(pr.t);
  if(S.promiseHistory.length>10) S.promiseHistory = S.promiseHistory.slice(-10);
  pendingPromiseChoice = null;
  save(); render();
}

      STAGES.map(st=>'<button class="opt' + (ckForm.stage===st.id?" on":"") + '" data-ckstage="' + st.id + '">' + st.q + '</button>').join("") +
      (ckError ? '<div style="margin-top:12px;background:#FBF1F1;border:1px solid var(--ume);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.8;color:var(--ume)">' + esc(ckError) + '</div>' : '') +
      '<button class="btn-main" id="ck_go"' + (ready?"":" disabled") + ' style="margin-top:14px">' +

  view.querySelectorAll("[data-ckstage]").forEach(b=>b.addEventListener("click",()=>{ ckForm.weight=$("ck_w").value; ckForm.stage=b.dataset.ckstage; renderCheckup(); }));
  $("ck_go").addEventListener("click",()=>{
    ckForm.weight=$("ck_w").value;
    const w=parseFloat(ckForm.weight);
    if(isNaN(w)) return;
    const err = profileInputError(p.age, p.height, w, ckForm.goal);
    if(err){ ckError=err; renderCheckup(); return; }
    ckError="";
    const gate=levelState().gate;
    // プロフィールを現在の体に合わせて更新し、目標を再計算
    p.weight=w;
    p.bmi=w/Math.pow(p.height/100,2);
    p.stage=ckForm.stage;
    p.goal=ckForm.goal;
    const b0=bmr(w,p.height,p.age,p.sexF);
    const e0=Math.round(b0*PAL[p.pal]/10)*10;
    p.energy = targetEnergy(e0, p.goal, b0);
    p.targets = svTargets(p.energy);
    if(gate){ S.checkups=(S.checkups||[]); if(S.checkups.indexOf(gate)<0) S.checkups.push(gate); }
    S.checkupLog=(S.checkupLog||[]);
    S.checkupLog.push({ date:TODAY, gate:gate, weight:w, stage:p.stage, goal:p.goal, energy:p.energy });
    checkupMode=false; ckForm=null;
    save(); render();
  });
}

function weightComment(p){
  const wt = weightTrend();
  let head = "体重は日内で±1kgほどゆれます。1日の上下に一喜一憂せず、<b>週平均の傾き</b>だけを見てください。";
  let goalLine = "";
  if(p.goal==="loss"){
    goalLine = "減量の目安は<b>月1〜2kg（体重の5%／6か月）</b>まで。これより速いペースは筋肉も一緒に減らしてしまいます。";
  } else if(p.goal==="gain"){
    goalLine = "増量の目安は<b>月0.5〜1kg</b>。これより速い増え方は脂肪が中心になりやすいので、たんぱく質と主食でゆっくり積み上げましょう。";
  } else if(p.goal==="bp"){
    goalLine = "体重が気になる場合、いまの体重から3〜5%減らすだけでも血圧や血糖値の改善が期待できることが報告されています。無理のない範囲で、まず体重を増やさないことから始めましょう。具体的な目標は医師・管理栄養士にご相談ください。";
  } else {
    goalLine = "維持が目標のいまは、<b>±2kgの幅</b>に収まっていれば合格です。「変わらない」ことは、それ自体が立派な成果です。";
  }
  let trendLine = "";
  if(wt){
    const dir = wt.diff<=-0.1 ? "減少" : wt.diff>=0.1 ? "増加" : "横ばい";
    trendLine = "<br><b>直近7日平均 " + wt.recent + "kg</b>（前週比 " + (wt.diff>0?"+":"") + wt.diff.toFixed(1) + "kg・" + dir + "傾向）— ";
    if(p.goal==="loss"){
      trendLine += (wt.diff<=-0.1 && wt.diff>=-0.75) ? "目標どおりの理想的な動きです。"
        : wt.diff < -0.75 ? "ペースが速すぎます。食事量を目標まで戻しましょう。"
        : wt.diff < 0.1 ? "いまは停滞期です。ホームの栄養士ノートに対策を出しています。"
        : "増加傾向です。今週の夕食時刻と補食・間食を見直してみましょう。";
    } else if(p.goal==="gain"){
      trendLine += wt.diff>=0.1 ? "計画どおり増えています。この調子です。"
        : "まだ増えていません。主食かたんぱく源をもう1皿足してみましょう。";
    } else {
      trendLine += Math.abs(wt.diff)<=0.3 ? "安定して維持できています。"
        : "少し動いています。今週は食事の時刻をいつもどおりに保つことを意識してみましょう。";
    }
  }
  return head + goalLine + trendLine;
}

function weightTrendChartHTML(hist, p){
  const W=340,H=196,left=46,right=58,top=22,bottom=36;
  const plotW=W-left-right, plotH=H-top-bottom, base=top+plotH;
  const dayMs = 86400000;
  const toDate = function(key){ return new Date(key + "T00:00:00"); };
  const toT = function(key){ return toDate(key).getTime(); };
  const values = hist.map(function(h){return h.w;});
  let minW = Math.min.apply(null, values);
  let maxW = Math.max.apply(null, values);
  const pad = Math.max(0.4, (maxW-minW)*0.18);
  minW = Math.floor((minW-pad)*2)/2;
  maxW = Math.ceil((maxW+pad)*2)/2;
  if(maxW-minW < 1){
    const mid = (maxW+minW)/2;
    minW = mid - 0.5;
    maxW = mid + 0.5;
  }
  const t0 = hist.length===1 ? toT(hist[0].key)-dayMs : toT(hist[0].key);
  const t1 = hist.length===1 ? toT(hist[0].key)+dayMs : toT(hist[hist.length-1].key);
  const xForT = function(t){ return left + (t-t0) * plotW / Math.max(dayMs, (t1-t0)); };
  const yForW = function(w){ return base - (w-minW) * plotH / (maxW-minW); };
  const fmtW = function(w){ return Number(w).toFixed(1).replace(/\.0$/,""); };
  const yTicks = [minW, (minW+maxW)/2, maxW];
  const grid = yTicks.map(function(t){
    const y = yForW(t);
    return '<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + y + '" y2="' + y + '" stroke="#E6EEE9" stroke-width="1"/>' +
      '<text x="' + (left-7) + '" y="' + (y+3.5) + '" text-anchor="end" font-size="8.5" fill="var(--sub)">' + fmtW(t) + '</text>';
  }).join("");
  const pts = hist.map(function(h){ return xForT(toT(h.key)) + "," + yForW(h.w); }).join(" ");
  const labelEvery = hist.length>8 ? 2 : 1;
  const pointEls = hist.map(function(h,i){
    const x=xForT(toT(h.key)), y=yForW(h.w);
    const paw=18;
    const dateLabel = (i%labelEvery===0 || i===hist.length-1) ? '<text x="' + x + '" y="' + (base+20) + '" font-size="7.5" text-anchor="middle" fill="var(--sub)">' + h.label + '</text>' : "";
    return '<image href="weight_paw.png" x="' + (x-paw/2) + '" y="' + (y-paw/2) + '" width="' + paw + '" height="' + paw + '" preserveAspectRatio="xMidYMid meet"/>' +
      '<text x="' + x + '" y="' + Math.max(top+8, y-7) + '" font-size="8.5" text-anchor="middle" fill="var(--deep)" font-weight="700">' + fmtW(h.w) + '</text>' +
      dateLabel;
  }).join("");
  return '<svg class="weight-trend-svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="体重の推移">' +
    grid +
    '<line x1="' + left + '" x2="' + left + '" y1="' + top + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.2"/>' +
    '<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.2"/>' +
    '<text x="' + (left-24) + '" y="' + (top-8) + '" font-size="8" font-weight="700" fill="var(--sub)">kg</text>' +
    '<text x="' + (left+plotW+8) + '" y="' + (base+20) + '" font-size="8" font-weight="700" fill="var(--sub)">日</text>' +
    '<polyline points="' + pts + '" fill="none" stroke="#CDD7D1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    pointEls +
  '</svg>' +
  '<div class="hint">肉球の位置が、その日の体重です。体重は日々ゆれるため、1点だけで判断せず、ライトグレーの線の流れをゆっくり見ます。</div>';
}

function weeklyTrendHTML(){
  const d = S.days[TODAY];
  const rec = recorded(d);
  const bars = pastWeek().concat(rec ? [{day:"今日", score:dayScore(d, S.profile.targets)}] : []);
  const avg = bars.length ? Math.round(bars.reduce(function(sum,b){ return sum + b.score; },0) / bars.length) : null;
  function scoreTrendSVG(){
    const W=340, H=178, left=34, right=60, top=22, bottom=32;
    const plotW=W-left-right, plotH=H-top-bottom, base=top+plotH;
    const clampScore=function(v){ return Math.max(0, Math.min(100, Number(v)||0)); };
    const yFor=function(v){ return top + (100-clampScore(v)) * plotH / 100; };
    const ticks=[0,50,70,100];
    const grid=ticks.map(function(t){
      const y=yFor(t), isTarget=t===70;
      return '<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + y + '" y2="' + y + '" stroke="' + (isTarget?'rgba(185,72,79,.72)':'#E6EEE9') + '" stroke-width="' + (isTarget?'1.4':'1') + '" stroke-dasharray="' + (isTarget?'2 3':'') + '"/>' +
        '<text x="' + (left-7) + '" y="' + (y+3.5) + '" text-anchor="end" font-size="8.5" font-weight="' + (isTarget?'700':'500') + '" fill="' + (isTarget?'#B9484F':'#5E6F67') + '">' + t + '</text>';
    }).join("");
    const yAvg=yFor(avg);
    const avgLabelY=Math.max(top+10, Math.min(base-3, yAvg+4));
    const avgLine='<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + yAvg + '" y2="' + yAvg + '" stroke="var(--yuzu)" stroke-width="1.7" stroke-dasharray="4 3"/>' +
      '<text x="' + (left+plotW+6) + '" y="' + avgLabelY + '" font-size="8.5" font-weight="700" fill="#7A5A12">平均 ' + avg + '点</text>';
    const barW=Math.max(12, Math.min(26, plotW/(bars.length*2.1)));
    const barEls=bars.map(function(b,i){
      const score=clampScore(b.score);
      const x=left + plotW * (i+.5) / bars.length;
      const y=yFor(score);
      const h=Math.max(2, base-y);
      const labelY=Math.max(top+8, y-6);
      return '<rect x="' + (x-barW/2) + '" y="' + y + '" width="' + barW + '" height="' + h + '" rx="4" fill="' + (score>=70?'var(--deep)':'var(--green)') + '"/>' +
        '<text x="' + x + '" y="' + labelY + '" text-anchor="middle" font-size="10" font-weight="700" fill="var(--deep)">' + b.score + '</text>' +
        '<text x="' + x + '" y="' + (base+19) + '" text-anchor="middle" font-size="9" fill="var(--sub)">' + b.day + '</text>';
    }).join("");
    return '<svg class="weekly-score-svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="この1週間のDIETARY BALANCE SCORE">' +
      grid +
      '<line x1="' + left + '" x2="' + left + '" y1="' + top + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.2"/>' +
      '<line x1="' + left + '" x2="' + (left+plotW) + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.2"/>' +
      '<text x="' + (left-20) + '" y="' + (top-8) + '" font-size="8" font-weight="700" fill="var(--sub)">点</text>' +
      '<text x="' + (left+plotW+8) + '" y="' + (base+20) + '" font-size="8" font-weight="700" fill="var(--sub)">日</text>' +
      avgLine + barEls +
    '</svg>';
  }
  return secHTML("WEEKLY DIETARY BALANCE SCORE","この1週間のDIETARY BALANCE SCORE") +
    '<div class="card">' +
      (bars.length===0
        ? '<div class="empty">まだ記録がありません。<br>毎日のバランススコアが、ここに棒グラフで積み重なっていきます。</div>'
        : scoreTrendSVG() +

    '</div>';
}

/* --- CSV書き出し --- */
function csvCell(v){
  v = v==null ? "" : String(v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
/* --- CSV読み込み（復元） ---
   exportCSVが書き出した形式をそのまま読み戻す。列は見出し名で対応づけるため、
   列の並びが変わっていても復元できる。すでに記録がある日は上書きしない。 */
function parseCSVText(text){
  text = String(text||"").replace(/^﻿/, "");
  const rows=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){ cell+='"'; i++; }
        else inQ=false;
      } else cell+=c;
    } else if(c==='"'){ inQ=true; }
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(cell); cell="";
      if(row.length>1 || row[0]!=="") rows.push(row);
      row=[];
    } else cell+=c;
  }
  if(cell!=="" || row.length){ row.push(cell); if(row.length>1 || row[0]!=="") rows.push(row); }
  return rows;
}
function parseClockCell(s){
  s = String(s==null?"":s).trim();
  if(!s) return null;
  const next = /翌/.test(s);
  const m = s.replace(/[()（）翌\s]/g,"").match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  let h = Number(m[1]) + Number(m[2])/60;
  if(next) h += 24;
  return roundTime5(h);
}
function importDaysFromCSV(text){
  const rows = parseCSVText(text);
  if(rows.length < 2) return { error:"CSVの中身が読み取れませんでした。書き出したCSVファイルを選んでください。" };
  const head = rows[0].map(function(h){ return String(h||"").trim(); });
  const col = {}; head.forEach(function(h,i){ col[h]=i; });
  if(col["日付"]===undefined || col["主食_皿"]===undefined){
    return { error:"このファイルは本アプリのCSV形式ではないようです（「日付」「主食_皿」の列が見つかりません）。" };
  }
  const get = function(r,name){ const i=col[name]; return i===undefined ? "" : (r[i]===undefined ? "" : String(r[i]).trim()); };
  let imported=0, skipped=0, invalid=0;
  for(let ri=1; ri<rows.length; ri++){
    const r = rows[ri];
    const key = get(r,"日付");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(key) || dayIndexFromKey(key)==null){ invalid++; continue; }
    const existing = S.days[key];
    if(existing && (anyRecord(existing) || existing.weight!=="")){ skipped++; continue; }  // 既存の記録は守る
    const day = emptyDay();
    [["breakfast","朝食","朝食時刻"],["lunch","昼食","昼食時刻"],["dinner","夕食","夕食時刻"]].forEach(function(mk){
      const wasSkipped = get(r,mk[1])==="欠食";
      const t = parseClockCell(get(r,mk[2]));
      day.meals[mk[0]] = { skipped: wasSkipped, time: t==null ? day.meals[mk[0]].time : t };
    });
    day.sv["主食"]=num0(get(r,"主食_皿")); day.sv["副菜"]=num0(get(r,"副菜_皿")); day.sv["主菜"]=num0(get(r,"主菜_皿"));
    day.sv["乳製品"]=num0(get(r,"乳製品_皿")); day.sv["果物"]=num0(get(r,"果物_皿"));
    day.snacks = num0(get(r,"補食回数"));
    day.snackKinds = { confection: get(r,"菓子類")==="1", sweetDrink: get(r,"嗜好飲料")==="1" };
    day.weight = get(r,"体重kg");
    const bed = parseClockCell(get(r,"就寝時刻"));
    const wake = parseClockCell(get(r,"起床時刻"));
    day.sleep = { bed: bed==null ? null : (bed>=24 ? roundTime5(bed-24) : bed),
                  wake: wake==null ? null : (wake>=24 ? roundTime5(wake-24) : wake),
                  awak: num0(get(r,"夜間覚醒回数")) };
    DVS_GROUPS.forEach(function(g){ day.dvs[g.id] = get(r,"DVS_"+g.label)==="1"; });
    S.days[key] = normalizeDay(day);
    imported++;
  }
  if(imported>0) save();
  return { imported:imported, skipped:skipped, invalid:invalid };
}
function exportCSV(){
  const head = ["日付","朝食","朝食時刻","昼食","昼食時刻","夕食","夕食時刻",
    "主食_皿","副菜_皿","主菜_皿","乳製品_皿","果物_皿","補食回数","菓子類","嗜好飲料","体重kg","バランススコア"]
    .concat(["就寝時刻","起床時刻","睡眠時間h","夜間覚醒回数"])
    .concat(DVS_GROUPS.map(function(g){return "DVS_" + g.label;}));
  const rows = [head.map(csvCell).join(",")];
  Object.keys(S.days).sort().forEach(k=>{
    const d = S.days[k];
    if(!anyRecord(d) && d.weight==="") return; // 完全な未記録の日は出力しない
    const m = d.meals;
    const fmtTime = v => v.skipped ? "" : clockLabel(v.time,{csv:true});
    const eatLabel = v => v.skipped ? "欠食" : "摂取";
    const fb=function(v){ return v==null ? "" : clockLabel(v,{csv:true}); };
    const sl=d.sleep||{};
    const row=[k, eatLabel(m.breakfast), fmtTime(m.breakfast), eatLabel(m.lunch), fmtTime(m.lunch), eatLabel(m.dinner), fmtTime(m.dinner),
      d.sv["主食"], d.sv["副菜"], d.sv["主菜"], d.sv["乳製品"], d.sv["果物"],
      d.snacks, hasSnackKind(d,"confection")?1:0, hasSnackKind(d,"sweetDrink")?1:0, d.weight, (mealRecorded(d) && S.profile) ? dayScore(d, S.profile.targets) : "",
      sl.bed!=null?fb(sl.bed):"", sl.wake!=null?fb(sl.wake):"", sleepDur(sl)!=null?sleepDur(sl):"", sl.awak!=null?sl.awak:""
    ].concat(DVS_GROUPS.map(function(g){return (d.dvs && d.dvs[g.id]) ? 1 : 0;}));
    rows.push(row.map(csvCell).join(","));
  });
  const csv = "\uFEFF" + rows.join("\r\n"); // BOM付き: Excelの文字化け対策
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tonari-records.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

}
document.querySelectorAll("#nav button").forEach(b=> b.addEventListener("click",()=>{checkupMode=false;tab=b.dataset.tab;render();}));
function initMascotTail(){
  const tail = document.querySelector(".brand-mascot-tail");
  if(!tail || typeof tail.animate !== "function") return;
  const reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  const rand = (min,max)=> min + Math.random() * (max-min);
  let timer = null, motion = null;
  function clearTail(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(motion){ motion.cancel(); motion = null; }
    tail.style.animation = "none";
    tail.style.transform = "rotate(0deg)";
  }
  function scheduleTail(){
    if(reduce && reduce.matches){ clearTail(); return; }
    if(document.hidden){ timer = setTimeout(scheduleTail, 1200); return; }
    tail.style.animation = "none";
    const vigor = rand(.72, 1.22);
    const duration = rand(3600, 6900);
    const pause = rand(300, 1900);
    motion = tail.animate([
      { transform:"rotate(0deg)", offset:0 },
      { transform:"rotate(" + (10.8*vigor).toFixed(1) + "deg)", offset:.14 },
      { transform:"rotate(" + (-14.4*vigor).toFixed(1) + "deg)", offset:.34 },
      { transform:"rotate(" + (8.1*vigor).toFixed(1) + "deg)", offset:.55 },
      { transform:"rotate(" + (-4.5*vigor).toFixed(1) + "deg)", offset:.76 },
      { transform:"rotate(0deg)", offset:.9 },
      { transform:"rotate(0deg)", offset:1 }
    ], { duration:duration, easing:"ease-in-out", iterations:1, fill:"forwards" });
    motion.onfinish = function(){
      motion = null;
      tail.style.transform = "rotate(0deg)";
      timer = setTimeout(scheduleTail, pause);
    };
  }
  function restartTail(){
    clearTail();
    if(!(reduce && reduce.matches)) timer = setTimeout(scheduleTail, rand(120, 900));
  }
  if(reduce){
    if(reduce.addEventListener) reduce.addEventListener("change", restartTail);
    else if(reduce.addListener) reduce.addListener(restartTail);
  }
  document.addEventListener("visibilitychange", restartTail);
  restartTail();
}
initMascotTail();
render();
save();
/* 日またぎ対策: ホーム画面アプリ(PWA)は開いたまま日をまたぐことがあるため、
   アプリに戻ったとき・および定期チェックで日付が変わっていたら再読み込みして
