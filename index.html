<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C4A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="となりの栄養士">
<title>となりの栄養士</title>
<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* 外部フォント(CDN)は使わず、端末内のシステムフォントのみで動作（外部通信を発生させない） */
:root{
  --bg:#F3F7F4; --ink:#26342E; --sub:#5E6F67; --green:#2C6B57; --deep:#1C4A3B;
  --pale:#E3EFE8; --yuzu:#E5A93C; --ume:#B9484F; --line:#D8E2DC; --card:#FFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.disp{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;cursor:pointer}
input,select{font-family:inherit;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}
header{padding:18px 2px 14px}
.brand-head{display:flex;align-items:center;gap:12px}
.brand-mascot-wrap{position:relative;display:block;width:92px;max-width:26vw;aspect-ratio:360/178;flex:0 0 auto}
.brand-mascot-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.brand-mascot-tail{z-index:1;transform-origin:76% 82%;animation:tail-sway 5.2s ease-in-out infinite;will-change:transform}
.brand-mascot-body{z-index:2}
.appname{font-size:23px;font-weight:900;color:var(--deep)}
.tagline{font-size:11px;color:var(--sub);margin-top:2px}
.today-date{display:inline-block;margin-top:8px;background:var(--deep);color:#fff;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.weight-trend-svg text{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.sec-title{font-size:19px;font-weight:700;margin-bottom:10px}
.label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;display:block}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-weight:700}
.chip.on{border-color:var(--green);background:var(--pale);color:var(--deep)}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;border:1.5px solid var(--line);background:#fff;color:var(--ink);margin-bottom:6px;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif}
.opt.on{border-color:var(--green);background:var(--pale);font-weight:700}
.btn-main{width:100%;padding:14px;border-radius:12px;border:none;background:var(--green);color:#fff;font-size:15px;font-weight:700}
.btn-main:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}
.score-card{background:var(--deep);border:none;color:#fff}
.score-num{font-size:42px;font-weight:900;line-height:1.1}
.note{display:flex;background:#FFFEFA;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.note .edge{width:6px;flex-shrink:0}
.note .body{padding:12px 14px}
.note .t{font-size:13px;font-weight:700;margin-bottom:4px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.note .b{font-size:13px;line-height:1.85;color:var(--sub)}
.tomorrow{background:#FFFCF4;border:1.5px solid #EFD9A0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:8px;font-size:16px}
.st-minus{border:1px solid var(--line);background:#fff;color:var(--ink)}
.st-plus{border:none;background:var(--green);color:#fff}
.st-val{width:28px;text-align:center;font-weight:700;font-size:17px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.meal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.time-val{width:58px;font-size:13px;font-weight:700;color:var(--ink);text-align:right}
.time-grid{display:grid;gap:10px;margin-top:8px}
.sleep-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.meal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.time-col{min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 2px 0}
.time-col .time-label{font-size:13px;font-weight:700;text-align:center}
.time-col .time-val{width:auto;min-height:20px;text-align:center;white-space:nowrap}
.time-col .skip-btn{width:100%;max-width:62px;padding:6px 6px}
.time-col .stepper{margin-top:48px}
.v-slider{height:172px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;gap:4px}
.v-slider input[type=range]{width:132px;height:34px;accent-color:var(--green);transform:rotate(-90deg)}
.v-end{font-size:9px;line-height:1;color:var(--sub)}
.skip-btn{font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700}
.skip-btn.on{border-color:var(--ume);background:#FBF1F1;color:var(--ume)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .inner{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 12px;border:none;background:none;color:var(--sub)}
nav button.on{color:var(--deep)}
nav .ic{font-size:16px}
nav .lb{font-size:11px;font-weight:700}
.weekly-score-svg text{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.8}
.empty{text-align:center;padding:26px 8px;color:var(--sub);font-size:13px;line-height:1.9}
.dvs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dvs-btn{min-height:88px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:9px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
.dvs-btn.on{border-color:var(--green);background:var(--pale)}
.dvs-icon{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(38,52,46,.10))}
.dvs-head{display:flex;align-items:center;gap:5px;min-width:0}
.dvs-kana{display:inline-grid;place-items:center;flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:#EEE;color:var(--sub);font-size:11px;font-weight:700}
.dvs-btn.on .dvs-kana{background:var(--green);color:#fff}
.dvs-label{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.dvs-ex{display:block;font-size:9px;color:var(--sub);margin-top:4px;line-height:1.45}
.mini-icon{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(38,52,46,.10));flex:0 0 auto}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.time-illust{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(38,52,46,.10))}
.stat{background:var(--pale);border-radius:10px;padding:12px 4px;text-align:center}
.stat .k{font-size:10px;color:var(--sub);font-weight:700}
.stat .v{font-size:21px;font-weight:900;color:var(--deep);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.stat .s{font-size:10px;color:var(--sub)}
.promise-banner{display:flex;gap:8px;align-items:center;background:#FFF8E8;border:1px solid #EFD9A0;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#7A5A12}
.promise-modal{position:fixed;inset:0;z-index:30;background:rgba(45,58,50,.28);display:flex;align-items:center;justify-content:center;padding:20px}
.promise-dialog{width:min(440px,100%);background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(45,58,50,.18);padding:18px}
.fadein{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.recipe-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.recipe-card summary{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;list-style:none}
.recipe-card summary::-webkit-details-marker{display:none}
.recipe-card[open] summary{border-bottom:1px dashed var(--line)}
.rc-pat{flex-shrink:0;font-size:10px;font-weight:700;border-radius:999px;padding:3px 8px}
.rc-pat-1{background:#EDF2FA;color:#3A5A8C}
.rc-pat-2{background:var(--pale);color:var(--deep)}
.rc-pat-3{background:#FFF3E6;color:#9A5B1F}
.rc-pat-4{background:#F7EEFA;color:#7A3E9D}
.rc-name{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.4}
.rc-season{flex-shrink:0;font-size:10px;font-weight:700;color:#fff;background:var(--ume);border-radius:999px;padding:2px 7px}
.rc-star{flex-shrink:0;font-size:12px;letter-spacing:1px}
.rc-body{padding:10px 14px 12px}
.rc-meta{font-size:11px;color:var(--sub);margin-bottom:8px}
.rc-sec{font-size:11px;font-weight:700;color:var(--green);margin:8px 0 3px}
.rc-txt{font-size:12px;line-height:1.9;color:var(--ink)}
.recipe-go{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:12px;font-weight:700}
@keyframes tail-sway{
  0%,100%{transform:rotate(0deg)}
  14%{transform:rotate(10.8deg)}
  34%{transform:rotate(-14.4deg)}
  55%{transform:rotate(8.1deg)}
  76%{transform:rotate(-4.5deg)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){
  .brand-mascot-wrap{width:78px}
  .dvs-btn{grid-template-columns:46px minmax(0,1fr);gap:7px;padding:9px}
  .dvs-icon{width:46px;height:46px}
  .mini-icon,.time-illust{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-head">
      <span class="brand-mascot-wrap" role="img" aria-label="となりの栄養士のマスコット">
        <img class="brand-mascot-layer brand-mascot-tail" src="wata-tail.png" alt="" aria-hidden="true">
        <img class="brand-mascot-layer brand-mascot-body" src="wata-body.png" alt="" aria-hidden="true">
      </span>
      <div>
        <div class="appname disp">となりの栄養士</div>
        <div class="tagline" id="tagline">食生活の記録とふりかえりを、いつでも手のひらに</div>
      </div>
    </div>
    <div class="today-date disp" id="todayDate"></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <div id="footer"></div>
</div>
<nav id="nav" style="display:none">
  <div class="inner">
    <button data-tab="home"><div class="ic">◉</div><div class="lb">ホーム</div></button>
    <button data-tab="record"><div class="ic">✎</div><div class="lb">記録</div></button>
    <button data-tab="plan"><div class="ic">◇</div><div class="lb">計画</div></button>
    <button data-tab="recipe"><div class="ic">🍳</div><div class="lb">レシピ</div></button>
    <button data-tab="report"><div class="ic">↗</div><div class="lb">経過</div></button>
  </div>
</nav>

<script>
"use strict";
/* ============================================================
   となりの栄養士 — 単一HTML版
   データはこの端末のブラウザ内(localStorage)に自動保存されます。
   ============================================================ */

/* ---------- 日付 ---------- */
const now = new Date();
const dateKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const TODAY = dateKey(now);
const WD = ["日","月","火","水","木","金","土"];
document.getElementById("todayDate").textContent =
  now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日（" + WD[now.getDay()] + "）";
// 日替わりでコメントの言い回しを変えるための種。
// UTCではなくローカル(端末)の日付で切り替わるようにオフセットを補正する。
// 記録キー(dateKey)由来の日番号と一致するため、週番号(WEEK_IDX)ともズレない。
const daySeed = Math.floor((now.getTime() - now.getTimezoneOffset()*60000) / 86400000);
const pick = (arr, salt) => arr[(daySeed + salt) % arr.length];
function stableHash(text){
  let h = 2166136261;
  String(text || "").split("").forEach(function(ch){
    h ^= ch.charCodeAt(0);
    h = Math.imul(h, 16777619);
  });
  return h >>> 0;
}

/* ---------- 時刻入力（5分刻み） ---------- */
const TIME_STEP_PER_HOUR = 12; // 60分 / 5分
function roundTime5(v){
  if(v==null || v==="") return null;
  const n=Number(v);
  if(isNaN(n)) return null;
  return Math.round(n*TIME_STEP_PER_HOUR)/TIME_STEP_PER_HOUR;
}
function clockLabel(v, opt){
  const n=roundTime5(v);
  if(n==null) return "";
  let h=Math.floor(n), m=Math.round((n-h)*60);
  if(m>=60){ h+=1; m=0; }
  const next=h>=24;
  const shown=next ? h-24 : h;
  const mm=String(m).padStart(2,"0");
  if(!next) return shown + ":" + mm;
  return (opt&&opt.csv) ? shown + ":" + mm + "(翌)" : "翌" + shown + ":" + mm;
}
function timeMinutes(v, fallbackHour){
  const n=roundTime5(v);
  const h=n==null ? fallbackHour : n;
  return Math.round(h*60);
}
function hourFromMinutes(min){
  const n=Number(min);
  return isNaN(n) ? null : roundTime5(n/60);
}

/* ---------- 保存（端末内・自動） ---------- */
let memoryStore = {};
function load(){
  try { const s = localStorage.getItem("tonari-data"); return s ? JSON.parse(s) : null; }
  catch(e){ return memoryStore.data || null; }
}
function save(){
  try { localStorage.setItem("tonari-data", JSON.stringify(S)); }
  catch(e){ memoryStore.data = S; }
}

/* ---------- 状態 ---------- */
const emptyDay = () => ({
  sleep:{ bed:null, wake:null, awak:0 },   // 昨晩の就寝時刻/今朝の起床時刻(時, 小数可)/夜間覚醒回数
  meals:{ breakfast:{skipped:false,time:7}, lunch:{skipped:false,time:12}, dinner:{skipped:false,time:19} },
  sv:{ "主食":0, "副菜":0, "主菜":0, "乳製品":0, "果物":0 },
  dvs:{},   // 食品摂取多様性: その日に食べた食品群 {群id:true}
  snackKinds:{}, // 控えめにしたい間食の種類 {confection:true, sweetDrink:true}。DVS計算には使わない
  snacks:0, weight:""
});

/* ---------- 睡眠の算出（健康づくりのための睡眠ガイド2023 準拠） ----------
   ・就寝(bed)は前夜なので 0-12時台は翌日扱い(+24)で睡眠時間を計算
   ・睡眠時間(量): 成人は6時間以上が目安、長すぎ(>9h)も注意
   ・中途覚醒(質): 0回が理想、3回以上で睡眠休養感が下がりやすい
   ・睡眠中点(タイミング/規則性の基礎): (就寝+起床)/2 */
function normSleepWindow(sl){
  if(sl==null || sl.bed==null || sl.wake==null) return null;
  let bed = Number(sl.bed), wake = Number(sl.wake);
  if(isNaN(bed) || isNaN(wake)) return null;
  if(bed < 12) bed += 24;             // 0-11時就寝は当日未明として翌日側に
  if(wake <= 18) wake += 24;           // 起床は当日朝〜昼として翌日側に
  let dur = wake - bed;
  if(dur < 0) dur += 24;
  // 現実的でない組み合わせは無効扱いにする（入力ミスの誤判定を防ぐ）
  if(dur < 2 || dur > 14) return null;
  return { bed:bed, wake:bed+dur, dur:dur };
}
function sleepDur(sl){
  const w = normSleepWindow(sl);
  return w ? Math.round(w.dur*10)/10 : null;
}
function sleepMid(sl){
  const w = normSleepWindow(sl);
  if(!w) return null;
  let mid = w.bed + w.dur/2;
  return mid>=24 ? mid-24 : mid;
}
function wakeAdj(sl){ const w = normSleepWindow(sl); return w ? w.wake : null; }
function circDiffHour(a,b){
  // 時刻差を -12〜+12 時間に収める。23時と1時のような日付境界の誤差を防ぐ。
  return ((a - b + 36) % 24) - 12;
}
function circMeanHour(arr){
  if(!arr || !arr.length) return null;
  let sx=0, sy=0;
  arr.forEach(function(h){
    const rad = (h/24) * 2 * Math.PI;
    sx += Math.cos(rad); sy += Math.sin(rad);
  });
  let ang = Math.atan2(sy/arr.length, sx/arr.length);
  if(ang < 0) ang += 2*Math.PI;
  return +(ang/(2*Math.PI)*24).toFixed(1);
}
function circSDHour(arr){
  if(!arr || !arr.length) return null;
  const m = circMeanHour(arr);
  const v = arr.reduce(function(a,h){ const d=circDiffHour(h,m); return a + d*d; },0)/arr.length;
  return +Math.sqrt(v).toFixed(1);
}

/* --- DVS 10食品群（さあにぎやかいただく） ---
   熊谷ら, 日本公衆衛生雑誌 2003;50(12):1117-1124 の食品摂取多様性得点。
   週の摂取頻度で得点化: 過去7日間で6日以上食べた群=1点、合計0〜10点 */
const DVS_GROUPS = [
  { id:"sakana", kana:"さ", label:"魚介類", ex:"焼き魚・刺身・ツナ缶など", icon:"sakana.png" },
  { id:"abura",  kana:"あ", label:"油脂",   ex:"炒め物・揚げ物・ドレッシングなど", icon:"abura.png" },
  { id:"niku",   kana:"に", label:"肉",     ex:"牛・豚・鶏・ひき肉など", icon:"niku.png" },
  { id:"gyunyu", kana:"ぎ", label:"牛乳・乳製品", ex:"牛乳・ヨーグルト・チーズなど", icon:"gyunyu.png" },
  { id:"yasai",  kana:"や", label:"緑黄色野菜", ex:"にんじん・トマト・ほうれん草など", icon:"yasai.png" },
  { id:"kaiso",  kana:"か", label:"海藻",   ex:"わかめ・のり・ひじきなど", icon:"kaiso.png" },
  { id:"imo",    kana:"い", label:"いも",   ex:"じゃがいも・さつまいも・里いもなど", icon:"imo.png" },
  { id:"tamago", kana:"た", label:"卵",     ex:"ゆで卵・卵焼き・炒り卵など", icon:"tamago.png" },
  { id:"daizu",  kana:"だ", label:"大豆製品", ex:"豆腐・納豆・味噌など", icon:"daizu.png" },
  { id:"kudamono", kana:"く", label:"果物", ex:"生の果物・冷凍フルーツなど", icon:"kudamono.png" },
];
function dvsCount(d){
  if(!d.dvs) return 0;
  return DVS_GROUPS.filter(function(g){return d.dvs[g.id];}).length;
}
const SNACK_KIND_INFO = [
  { id:"confection", label:"菓子類", ex:"チョコ・クッキー・菓子パン・スナック菓子など", icon:"confection.png" },
  { id:"sweetDrink", label:"嗜好飲料", ex:"加糖コーヒー・ジュース・スポーツ飲料・甘い炭酸など", icon:"sweet_drink.png" },
];
function snackKinds(d){
  if(!d.snackKinds) d.snackKinds={};
  return d.snackKinds;
}
function hasSnackKind(d,id){ return !!(d && d.snackKinds && d.snackKinds[id]); }
function snackKindRecorded(d){
  return SNACK_KIND_INFO.some(function(g){ return hasSnackKind(d,g.id); });
}
function snackTrend(){
  const out={ days:0, snackDays:0, confectionDays:0, sweetDrinkDays:0, bothDays:0 };
  for(let i=0;i<7;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(!d) continue;
    out.days++;
    if(snackKindRecorded(d)) out.snackDays++;

   ・利用開始(初回記録日)を1日目として、7日目以降に算出する(ready)
   ・窓内の食事記録が7日そろえば「6日以上」を頻出とみなす。
     1日だけ欠損した週(記録6日)は、6日分のデータから「5日以上」で算出する
   ・欠損が2日以上(記録5日以下)の週は得点を算出しない(computable=false)
   返り値: {score, days, freq, missing, ready, computable, need, startDays} */
function dvsWeekly(){
  const freq={}; let days=0;
  DVS_GROUPS.forEach(function(g){freq[g.id]=0;});
  for(let i=0;i<7;i++){
    const dt=new Date(now); dt.setDate(now.getDate()-i);
    const d=S.days[dateKey(dt)];
    if(d && mealRecorded(d)){
      days++;
      DVS_GROUPS.forEach(function(g){ if(d.dvs && d.dvs[g.id]) freq[g.id]++; });
    }
  }
  const first = firstRecordDayIndex();
  const todayIdx = dayIndexFromKey(TODAY);
  const startDays = (first==null || todayIdx==null) ? 0 : (todayIdx - first + 1); // 利用日数(初回記録日=1日目)
  const ready = startDays >= 7;
  const need = days >= 7 ? 6 : 5;   // 1日欠損の週は6日分から「5日以上」で判定
  const computable = ready && days >= 6;
  const score = DVS_GROUPS.filter(function(g){return freq[g.id]>=need;}).length;
  const missing = DVS_GROUPS.filter(function(g){return freq[g.id]<=1;});
  return { score:score, days:days, freq:freq, missing:missing,
           ready:ready, computable:computable, need:need, startDays:startDays };
}

function practicalAdvice(p,d){
  // 目標・年齢・その日の記録に合わない案は候補から外す
  const lateDin = d && !d.meals.dinner.skipped && d.meals.dinner.time>=21;
  const pool = PRACTICAL_FOOD_IDEAS.filter(function(t){
    if(/増量/.test(t) && p.goal!=="gain") return false;
    if(/減量/.test(t) && p.goal!=="loss") return false;
    if(/血圧/.test(t) && p.goal!=="bp") return false;
    if(/高齢期/.test(t) && p.age<65) return false;
    if(/遅い夕食|夕食が遅/.test(t) && !lateDin) return false;
    if(d){
      const sh = num0(d.sv && d.sv["主食"]);
      if(/主食が少な/.test(t) && sh > p.targets["主食"]) return false;
      if(/主食が多い/.test(t) && sh <= p.targets["主食"]) return false;
    }
    return true;
  });
  return pick(pool, 47);
}
function dvsWeekTracked(){
  const v=dvsWeekly();
  return v.days>=4 && DVS_GROUPS.some(function(g){return v.freq[g.id]>0;});
}
function weeklyDvsMiss(id, maxDays){
  const v=dvsWeekly();
  return dvsWeekTracked() && v.freq[id]<=maxDays;
}

function addAdviceVariants(basePri, title, when, variants){
  variants.forEach(function(text, i){
    ADVICE.push({
      pri:basePri + i/1000,
      key:title,
      variant:i+1,
      title:title,
      when:when,
      body:function(p,d){ return typeof text==="function" ? text(p,d) : text; }
    });
  });
}

addAdviceVariants(5.25, "副菜と食物繊維", (p,d)=> mealRecorded(d) && (d.sv["副菜"] < p.targets["副菜"] || Object.values(d.sv).filter(v=>v>0).length<=3), [
  "副菜が足りない日は、切る野菜より、冷凍野菜、海藻、きのこ、具だくさん汁を使うほうが続きやすいです。",
  "食生活指針の考え方では、主食・主菜・副菜をそろえることが土台です。今日は副菜を“料理”ではなく“ひとつかみ”で見てみましょう。",
  "野菜が少ない日でも、味噌汁に冷凍野菜とわかめを入れるだけで、副菜と海藻を同時に拾えます。",
  "生野菜が続かない人は、温野菜や汁物で考えると楽です。温かい副菜は、量を取りやすいのが強みです。",
  "副菜不足は、作る気力の問題ではなく、手前にある選択肢の問題かもしれません。冷凍野菜を冷凍庫の前列に置きましょう。",
  "外食で副菜が少ない日は、帰宅後に果物や海藻スープを足すだけでも、その日の不足を少し拾えます。",
  "副菜を増やす時は、色の濃い野菜を一つ足すと見た目も整いやすいです。トマト、ほうれん草、ブロッコリーのような選び方で十分です。",
  "コンビニの日は、サラダだけでなく具だくさん汁も副菜候補です。温かいものの方が続く人もいます。",
  "生野菜が苦手な日は、レンジ蒸し、味噌汁、スープ、炒め物のどれかで拾えば大丈夫です。",
  "野菜料理を増やすのが重い日は、海藻やきのこを足すと一気に楽になります。わかめ、めかぶ、しめじは使いやすいです。",
  "副菜は“主役の料理”にしなくて大丈夫です。主食や主菜の横に小さく添えるだけで、食事の印象が変わります。",
  "買い物で迷う日は、調理する野菜ではなく、すぐ食べられる副菜を一つ選びましょう。続ける力は手間の少なさから生まれます。",
  "冷蔵庫に野菜がない日は、冷凍野菜、のり、めかぶ、豆腐のどれかで立て直せます。完璧な副菜でなくても構いません。",
  "副菜が少ない週は、毎日違う料理を作るより、同じ具だくさん味噌汁を数日使うほうが現実的です。"
]);
addAdviceVariants(5.26, "海藻・いも・豆で食卓を広げる", (p,d)=> mealRecorded(d) && (weeklyDvsMiss("kaiso",1) || weeklyDvsMiss("imo",1) || weeklyDvsMiss("daizu",1)), [
  "食物繊維を増やすなら、野菜だけで頑張らなくて大丈夫です。豆、いも、海藻、きのこを足すと、食卓の幅が出ます。",
  "便通や満腹感を整えたい日は、食物繊維を急に増やすより、水分と一緒に少しずつ増やすほうが体に合いやすいです。",
  "海藻、いも、豆は“ひとつまみ”の軽さで頻度を作れる食品群です。のり、わかめ、冷凍里いも、納豆が使いやすい入口になります。"
]);
addAdviceVariants(5.35, "主菜とたんぱく質", (p,d)=> mealRecorded(d) && (d.sv["主菜"]<=1 || weeklyDvsMiss("sakana",1) || weeklyDvsMiss("tamago",1) || weeklyDvsMiss("daizu",1)), [
  "たんぱく質は肉だけではありません。魚、卵、大豆製品、乳製品をローテーションすると、脂質や塩分の偏りも抑えやすくなります。",
  "主菜が少ない日は、調理しない主菜を使いましょう。納豆、豆腐、ゆで卵、刺身、サバ缶は、忙しい日の味方です。",
  "魚が少ない週は、焼き魚にこだわらなくて大丈夫です。ツナ缶、サバ缶、鮭おにぎり、しらすでも頻度を作れます。",
  "卵は、主菜不足の日に最短で使える食品です。ゆで卵を作り置きするだけで、翌日の食事がかなり楽になります。",
  "主菜が少ない日は、冷蔵庫にあるものを料理にするより、すぐ食べられる主菜を一つ足すほうが現実的です。",
  "魚が続かない人は、刺身、缶詰、鮭おにぎり、しらすのように“調理しない魚”からで十分です。",
  "大豆製品は、肉や魚が少ない日の助けになります。納豆、豆腐、枝豆、厚揚げのどれか一つで一歩です。",
  "主菜を増やす時は、塩分や脂質が増えすぎない形を選びましょう。焼く、蒸す、汁物に入れる方法が使いやすいです。"
]);
addAdviceVariants(5.36, "主菜が多めの日", (p,d)=> mealRecorded(d) && d.sv["主菜"] > p.targets["主菜"]+1, [
  "主菜が多すぎる日は、量を急に減らすより調理法を変える方が続きます。揚げ物を焼き物、蒸し物、煮物へ寄せましょう。",
  "肉料理が多い日は、大豆製品を一回はさむと全体が軽くなります。冷奴や納豆は、減らすより足して整える作戦です。"
]);
addAdviceVariants(5.37, "増量期のたんぱく質", (p,d)=> p.goal==="gain" && mealRecorded(d) && d.sv["主菜"] <= p.targets["主菜"], [
  "増量や筋力維持では、補食にたんぱく質を入れることが大切です。牛乳、ヨーグルト、チーズ、卵を小さく足しましょう。",
  "体重を増やす時期は、主菜を一度に増やすより、3食+補食で回数を増やすほうが胃にやさしく続きます。"
]);
addAdviceVariants(5.38, "高齢期のたんぱく質", (p,d)=> p.age>=65 && mealRecorded(d) && d.sv["主菜"]<=1, [
  "高齢期は一度にたくさん食べるより、毎食少しずつたんぱく質を拾うほうが現実的です。補食も立派な補給枠になります。",
  "年齢を重ねるほど、卵、豆腐、乳製品のような“調理が軽い主菜”が続けやすくなります。1品を定番にしましょう。"
]);
addAdviceVariants(5.45, "主食が少なめの日", (p,d)=> mealRecorded(d) && d.sv["主食"]<=1, [
  "主食は減らす対象というより、量を調整する軸です。ゼロにすると、後から甘いものが欲しくなることがあります。",
  "主食が少ない日は、いも類を副菜として入れる形でもエネルギーを補えます。冷凍里いもや焼き芋は使いやすいです。",
  "減量中でも、毎食こぶし一つ分の主食は味方になります。極端に減らすと、継続が難しくなります。",
  "昼に主食が少なすぎると、夕方に菓子類や甘い飲み物へ向かいやすいです。小さなおにぎりは予防策として使えます。",
  "朝の主食が難しい日は、バナナやオートミールのように軽いものからでも構いません。",
  "朝や昼の主食が少なすぎると、夜にまとめて欲しくなることがあります。早い時間に小さく入れるほうが安定します。",
  "主食を控えたい日は、完全に抜くより量を見える形にするほうが続きます。茶碗を小さくするだけでも十分です。"
]);
addAdviceVariants(5.46, "主食が多めの日", (p,d)=> mealRecorded(d) && d.sv["主食"] > p.targets["主食"]+1, [
  "主食が多い日は、抜くより普通盛りへ戻すだけで十分です。減らした分は副菜や主菜で満足感を作りましょう。",
  "麺や丼の日は、主食を減らすより、具を増やす視点が合いやすいです。卵、野菜、海藻を足すと一食に近づきます。",
  "主食が多い日は、次の食事で抜いて帳尻を合わせるより、普通量に戻して副菜を足すほうが体にやさしいです。",
  "パンの日は、菓子パンだけでなく、チーズ、卵、ヨーグルトを横に置くと主食だけの食事になりにくいです。"
]);
addAdviceVariants(5.55, "乳製品とカルシウム", (p,d)=> mealRecorded(d) && (d.sv["乳製品"]<p.targets["乳製品"] || weeklyDvsMiss("gyunyu",1)), [
  "乳製品は、食事に足すより生活の動線に置くほうが続きます。朝の飲み物、補食、食後の小鉢のどこかに固定しましょう。",
  "カルシウムは一度にまとめてより、日々少しずつが向いています。ヨーグルト、牛乳、チーズの小さな選択で十分です。",
  "乳製品が苦手な日は、飲む形にこだわらず、スープや料理に少し混ぜる方法もあります。",
  "女性の50歳以降は骨の健康を意識したい時期です。乳製品を“気づいたら足す”ではなく、朝か補食に固定すると安定します。",
  "乳製品を甘いデザートとしてではなく、補食の栄養枠として使えると、菓子類との違いがはっきりします。",
  "コンビニで昼食を買う日は、ヨーグルトかカフェラテを追加候補にすると、乳製品の空欄が埋まりやすいです。",
  "食欲がない日は、牛乳入りスープや飲むヨーグルトのように、固形でない形の方が入りやすいことがあります。",
  "乳製品は主食や果物と相性がよいです。パンとチーズ、バナナとヨーグルトのように組み合わせると続きます。",
  "乳製品を忘れやすい人は、冷蔵庫の奥ではなく手前に置くのが一番効きます。見える場所にあるだけで選びやすくなります。",
  "朝が和食の日でも、乳製品は外して考えなくて大丈夫です。食後のヨーグルト、間の牛乳、補食のチーズで拾えます。",
  "乳製品が甘いものに寄りやすい人は、プレーンヨーグルトに果物を足す形にすると、甘さと栄養の両方を調整できます。",
  "外食が続く週は、乳製品を朝か補食に固定すると、外で不足しやすい分を家で先に拾えます。",
  "飲む牛乳が苦手なら、料理に少し入れる形でも構いません。スープ、シチュー、カフェオレのように生活に混ぜましょう。",
  "乳製品を買っても余りやすい人は、小分けヨーグルトや個包装チーズのように、1回分が見えるものを選ぶと続きます。",
  "カルシウムを意識したい日は、乳製品だけでなく大豆製品や小魚も味方です。まずは一番続くものを定番にしましょう。",
  "補食を使う日は、乳製品を入れる好機です。ヨーグルト、チーズ、牛乳は、少量でも3食で足りない分を支えます。"
]);
addAdviceVariants(5.65, "果物の使い方", (p,d)=> mealRecorded(d) && (d.sv["果物"]<p.targets["果物"] || weeklyDvsMiss("kudamono",1)), [
  "果物は甘いものを我慢するためだけでなく、食事の不足を補う食品群として使えます。まずは見える場所に置くのが一番です。",
  "ジュースではなく、そのまま食べる形にすると、食物繊維も一緒に取りやすくなります。",
  "果物が続かない人は、切る果物ではなく、みかん、バナナ、キウイ、冷凍フルーツから始めましょう。",
  "血圧を意識する人にとって、果物や野菜を増やすことは食卓全体を整える助けになります。塩分を減らす作戦とセットで考えましょう。",
  "夕食後に甘いものが欲しい日は、果物を先に出してから選ぶと、菓子類だけに流れにくくなります。",
  "朝食が軽い日は、果物とヨーグルトを組み合わせると、乳製品も同時に拾えます。",
  "果物を買って余らせやすい人は、冷凍フルーツや少量パックを使うと負担が減ります。",
  "季節の果物を一つ選ぶことは、食育の視点でもよいきっかけです。旬を意識すると食事が少し楽しくなります。",
  "果物が家にあるのに食べ忘れる人は、冷蔵庫ではなく食卓や見える棚に置くと選びやすくなります。",
  "夕方に甘いものが欲しくなる日は、果物を補食として先に入れる作戦があります。置き換えを決めつけず、候補を増やしましょう。",
  "果物は量より頻度で考えると続きます。みかん1個、バナナ半分、キウイ半分でも一歩です。",
  "外食が多い日は、果物を朝に寄せると一日のどこかで食品群を拾えます。カットフルーツでも十分です。",
  "冷凍フルーツは、余らせにくい果物です。ヨーグルトにのせるだけなら、朝食にも補食にも使えます。",
  "果物をジュースで済ませがちな人は、週に1回だけ“そのまま食べる日”を作るところから始めましょう。",
  "菓子類を楽しむ日でも、果物を先に見える場所へ置くと選択肢が増えます。実際に置き換えるかは、その日の体調で決めて大丈夫です。",
  "旬の果物を一つ選ぶと、栄養だけでなく楽しみも増えます。続く習慣は、少し楽しいほうが強いです。"
]);
addAdviceVariants(5.75, "菓子類との付き合い方", (p,d)=> hasSnackKind(d,"confection"), [
  "菓子類や甘い飲み物は、意志の弱さではなく、疲れ、寝不足、昼食不足で出やすくなります。責めるより、前の食事を見ましょう。",
  "菓子類を食べる日は、小皿に出すだけで量が見えます。見える化は、我慢より続く調整です。",
  "夕方に菓子類が欲しい日は、昼食の主菜か主食が少なかった可能性があります。翌日は昼の保険を入れてみましょう。",
  "夜の甘いものは、夕食後の終わりの合図が弱いと出やすいです。歯みがき、温かいお茶、台所の片づけを使いましょう。",
  "買い置きがあると手が伸びやすい人は、家に大袋を置かず、外で1回分だけ買う形が合うことがあります。",
  "菓子類を楽しむ日は残して大丈夫です。食後に小皿で食べる形なら、空腹時より量が増えにくくなります。",
  "菓子類が夕方に集中する日は、昼食の主食や主菜が少なかった可能性があります。先に昼を見直すほうが近道です。",
  "コンビニで甘いものを買う日は、最初に果物・ヨーグルト・無糖飲料の棚を見てから選ぶと、選択肢が広がります。",
  "菓子類を減らしたい時は、買う場所と量を変えるのが効果的です。家に大袋を置かず、外で1回分だけにする方法があります。",
  "夜の菓子類が習慣になっている日は、夕食後すぐに台所を片づけるだけでも流れが変わります。"
]);
addAdviceVariants(5.76, "嗜好飲料との付き合い方", (p,d)=> hasSnackKind(d,"sweetDrink"), [
  "甘い飲み物を減らすなら、最初の1本だけ無糖にする方法が現実的です。全部を変えなくても流れは変わります。",
  "甘い飲み物が続く時は、味を急にゼロにしなくても大丈夫です。小さいサイズ、氷多め、無糖と交互のどれかを選びましょう。",
  "寝不足や疲れがある日は、甘い飲み物を欲しやすくなります。体の反応として扱い、まず水分と休息を入れましょう。",
  "甘い飲み物を水分補給として飲んでいる場合は、まず1日の最初の飲み物だけ水かお茶へ寄せましょう。"
]);
addAdviceVariants(5.77, "菓子類と甘い飲み物が重なる日", (p,d)=> hasSnackKind(d,"confection") && hasSnackKind(d,"sweetDrink"), [
  "菓子類と甘い飲み物が重なる日は、まず飲み物を無糖に寄せると負担が小さいです。",
  "菓子類と嗜好飲料は、ゼロか百かで考えなくて大丈夫です。重なる日を減らすだけでも、体への負担は変わります。"
]);
addAdviceVariants(5.85, "補食の前向きな使い方", (p,d)=> Number(d.snacks||0)>=1, [
  "補食は、3食で取りきれない栄養を補う前向きな枠です。菓子類とは分けて考えると、使い方が見えやすくなります。",
  "補食の目的を決めると選びやすくなります。エネルギーならおにぎり、たんぱく質なら卵、カルシウムならヨーグルトやチーズです。",
  "補食が多い日は、前の食事が軽すぎなかったかを見るチャンスです。昼食の主食や主菜を少し足すと変わることがあります。",
  "忙しい日は、補食で合計を整える発想で大丈夫です。3食に戻せる日は戻し、難しい日は不足を拾いましょう。",
  "補食は中身が大切です。甘い満足だけでなく、次の食事まで体を支えるものかを見てみましょう。",
  "朝食が軽い日は、午前の補食で乳製品や果物を足すと、午前中の栄養の穴を小さくできます。",
  "運動量が多い日は、補食を我慢するより、体を支えるものとして使うほうが自然です。おにぎり、牛乳、卵が候補です。",
  "補食が増えた日は、回数だけで判断せず、中身を見ましょう。栄養を補えている補食なら、生活を支える役割があります。",
  "補食を選ぶ前に、何を補うかを一つ決めると迷いにくいです。エネルギー、たんぱく質、カルシウムのどれかです。",
  "忙しい日の補食は、手で食べられるものが続きます。おにぎり、チーズ、ゆで卵、バナナのような候補を持ちましょう。",
  "食事量が少ない日ほど、補食は“余計なもの”ではなく“足りない分の調整”になります。前向きに使って大丈夫です。",
  "補食を予定に入れると、だらだら食べとの違いがはっきりします。時間を決めるだけで、同じ内容でも使い方が変わります。"
]);
addAdviceVariants(5.84, "遅い夕食の日の補食", (p,d)=> !d.meals.dinner.skipped && d.meals.dinner.time>=21 && Number(d.snacks||0)>=1, [
  "夕方の補食は、遅い夕食の食べ過ぎを防ぐ味方です。予定された補食なら、だらだら食べとは別物です。",
  "夕食が遅い日は、補食を入れることで帰宅後の食べすぎを防げます。空腹を放置しないことも大切な調整です。"
]);
addAdviceVariants(5.86, "高齢期の補食の使い方", (p,d)=> p.age>=65 && Number(d.snacks||0)>=1, [
  "高齢期は一食の量が自然に減りやすいので、補食でたんぱく質や乳製品を拾う考え方が役立ちます。",
  "食が細くなりやすい時期は、補食を“もう一つの小さな食事”として使うと、無理なく合計を整えられます。"
]);
addAdviceVariants(5.87, "増量期の補食", (p,d)=> p.goal==="gain" && Number(d.snacks||0)>=1, [
  "増量や筋力維持では、補食は重要な作戦です。胃に負担をかけず、回数で足す発想が合いやすいです。",
  "体重を増やしたい時期の補食は、牛乳、おにぎり、卵、ヨーグルトのように、エネルギーとたんぱく質を同時に拾えるものが向いています。"
]);
addAdviceVariants(5.95, "減塩の工夫", (p,d)=> mealRecorded(d) && (p.goal==="bp" || d.sv["主菜"] > p.targets["主菜"]+1 || !d.meals.dinner.skipped && d.meals.dinner.time>=21), [

function adviceKey(a){
  const raw = String((a && (a.key || a.title)) || "").replace(/\s+\d+$/,"");
  if(/朝食/.test(raw)) return "朝食";
  if(/昼食|夕食|時間帯|リズム|分食/.test(raw)) return "食事時刻";
  if(/副菜|野菜|食物繊維|海藻|いも|きのこ/.test(raw)) return "副菜";
  if(/主菜|たんぱく質|魚|肉|卵|大豆/.test(raw)) return "主菜";
  if(/主食|エネルギー|ごはん|パン|麺/.test(raw)) return "主食";
  if(/乳製品|カルシウム|牛乳/.test(raw)) return "乳製品";
  if(/果物/.test(raw)) return "果物";
  if(/菓子|嗜好飲料|甘い飲み物|間食/.test(raw)) return "菓子類・嗜好飲料";
  if(/補食/.test(raw)) return "補食";
  if(/減塩|血圧/.test(raw)) return "減塩";
  if(/DVS|多様性|日本型食生活|食品の種類/.test(raw)) return "食事の多様性";
  return raw || "その他";
}
/* --- 文の重なり検出（コメント合成の冗長防止） ---
   句読点を除いた2つの文字列の最長共通部分文字列長を返す。
   同じ言い回し(「〜で十分です」の連続など)を機械的に避けるために使う。 */
function commonRunLen(a,b){
  a=String(a||"").replace(/[。、！？\s（）()「」]/g,"");
  b=String(b||"").replace(/[。、！？\s（）()「」]/g,"");
  var best=0;
  for(var i=0;i<a.length;i++){
    for(var j=0;j<b.length;j++){
      var k=0;
      while(i+k<a.length && j+k<b.length && a[i+k]===b[j+k]) k++;
      if(k>best) best=k;
    }
  }
  return best;
}
function lastSentence(text){
  var parts=String(text||"").split("。").filter(function(s){return s.trim();});
  return parts.length ? parts[parts.length-1] : "";
}
/* 締め句を選ぶ。本文の最後の文と言い回しが重なるもの・同日ですでに
   使ったものは避けて、定型文の繰り返し感が出ないようにする。 */
function pickSoftener(body, salt, used){
  var tail=lastSentence(body);
  var n=SOFTENERS.length;
  for(var i=0;i<n;i++){
    var cand=SOFTENERS[(((daySeed+salt)%n)+n+i)%n];
    if(used && used.indexOf(cand)>=0) continue;
    if(commonRunLen(tail,cand)>=5) continue;
    return cand;
  }
  return SOFTENERS[(daySeed+salt)%n];
}

function adviceRecentPenalty(a){
  const key = adviceKey(a);
  const hist = Array.isArray(S.adviceHistory) ? S.adviceHistory.filter(function(h){ return h && h.date!==TODAY; }).slice(-40) : [];
  if(!hist.length) return 0;
  let penalty = 0;
  hist.forEach(function(h, idx){
    if(h.key===key){
      const recency = (idx+1) / hist.length;
      penalty += 2.2 + recency * 2.0;
    }
  });
  return penalty;
}
function adviceJitter(a, idx){
  return (stableHash(adviceKey(a) + "|" + TODAY + "|" + (a.variant||idx)) % 100) / 5000;
}
function selectAdvice(candidates){
  var scored = candidates.map(function(a, idx){
    return { a:a, score:a.pri + adviceRecentPenalty(a) + adviceJitter(a, idx) };
  }).sort(function(x,y){ return x.score-y.score; });
  // 同じ日に同系統(朝食×2、間食×2など)の助言が並ばないよう、カテゴリを重複させずに2件選ぶ
  var out=[], usedKeys={};
  for(var i=0;i<scored.length && out.length<2;i++){
    var k=adviceKey(scored[i].a);
    if(usedKeys[k]) continue;
    usedKeys[k]=1;
    out.push(scored[i].a);
  }
  return out;
}
function rememberAdviceHistory(list){
  if(!Array.isArray(S.adviceHistory)) S.adviceHistory = [];
  let changed = false;
  list.forEach(function(a){
    const key = adviceKey(a);
    if(!S.adviceHistory.some(function(h){ return h && h.date===TODAY && h.key===key; })){
      S.adviceHistory.push({ date:TODAY, key:key, title:a.title || key });
      changed = true;
    }
  });
  if(S.adviceHistory.length>80){
    S.adviceHistory = S.adviceHistory.slice(-80);
    changed = true;
  }
  if(changed) save();
}

/* --- 合成: その日のノート一式を生成（ほめ言葉は必ず1件以上） --- */
function commentSalt(p,d,tag){
  d = normalizeDay(d);
  const svPart = Object.keys(d.sv).map(function(k){ return k + ":" + d.sv[k]; }).join(",");
  const dvsPart = DVS_GROUPS.map(function(g){ return g.id + ":" + (d.dvs[g.id]?1:0); }).join(",");
  const snackPart = SNACK_KIND_INFO.map(function(g){ return g.id + ":" + (hasSnackKind(d,g.id)?1:0); }).join(",");
  const mealPart = ["breakfast","lunch","dinner"].map(function(k){
    const m=d.meals[k]; return k + ":" + (m.skipped?1:0) + ":" + m.time;
  }).join(",");
  return stableHash([TODAY, tag, p.goal, p.stage, d.snacks, mealPart, svPart, dvsPart, snackPart].join("|"));
}
/* --- 2週間のふりかえり: 履歴データから「その人だけの数字」を引用する特別コメント ---
   ・欠測日は除外して比較する(週に1〜2日の記録漏れがあっても機能する)
   ・今週4日以上・先週3日以上の食事記録があるときだけ算出
   ・同じ観点が2日続けて出ないよう、前日に出した観点を避ける
   ・1日1件まで。実測値を本文に含めるため、定型文でも「自分の話」として届く */
function weeklyReviewNote(p, ctx, salt){
  const w = ctx.week, pw = ctx.prevWeek;
  if(!w || !pw || w.eaten < 4 || pw.eaten < 3) return null;
  const f1 = x => (Math.round(x*10)/10).toFixed(1).replace(/\.0$/,"");
  const cands = [];
  if(w.score!=null && pw.score!=null && w.score - pw.score >= 6){
    cands.push({ key:"score_up", tone:"praise", title:"この2週間、良い流れです",
      body:"先週7日間の平均バランススコアは" + pw.score + "点、今週はここまで平均" + w.score + "点。" + (w.score-pw.score) + "点の上積みです。1日ずつの小さな選択が、週の平均をちゃんと動かしています。この伸び方は本物です。" });
  }
  if(w.fuku!=null && pw.fuku!=null && w.fuku - pw.fuku >= 0.5){
    cands.push({ key:"fuku_up", tone:"praise", title:"副菜が増えています",
      body:"記録を2週間分ならべると、副菜が1日あたり" + f1(pw.fuku) + "皿から" + f1(w.fuku) + "皿に増えています。野菜・きのこ・海藻の皿がじわっと増えるのは、食卓が良い方向に動いているいちばん確かなサインです。" });
  }
  if(w.fruit!=null && pw.fruit!=null && w.fruit - pw.fruit >= 0.4){
    cands.push({ key:"fruit_up", tone:"praise", title:"果物の習慣が育っています",
      body:"果物が1日あたり" + f1(pw.fruit) + "回分から" + f1(w.fruit) + "回分へ。買い物かごに果物が入る週は、間食の中身も自然に変わっていきます。この流れ、大事にしましょう。" });
  }
  if(pw.bfSkip - w.bfSkip >= 2){
    cands.push({ key:"bf_fix", tone:"praise", title:"朝の欠食が減りました",
      body:"朝ごはんを抜いた日が、先週は" + pw.bfSkip + "日、今週は" + w.bfSkip + "日。体内時計の面から見ると、これは今週いちばん価値のある変化かもしれません。朝に何か入れる日を、このまま普通にしていきましょう。" });
  }
  if(w.early - pw.early >= 2){
    cands.push({ key:"early_up", tone:"praise", title:"夜のリズムが変わってきました",
      body:"夕食を21時前に終えられた日が、先週の" + pw.early + "日から今週は" + w.early + "日に増えています。夜の食事時刻は、睡眠にも翌朝の食欲にも効いてくる土台の部分。数字がそれを裏付けています。" });
  }
  if(w.weigh - pw.weigh >= 2){
    cands.push({ key:"weigh_up", tone:"praise", title:"体重計に乗る週になっています",
      body:"体重の計測が先週" + pw.weigh + "回、今週は" + w.weigh + "回。測る回数が増えた人は、変化への気づきが早くなります。数字はあなたの味方につき始めています。" });
  }
  if(pw.snackDays - w.snackDays >= 2){
    cands.push({ key:"snack_down", tone:"praise", title:"間食の日が減っています",
      body:"菓子類・甘い飲み物の記録があった日が、先週の" + pw.snackDays + "日から今週は" + w.snackDays + "日に。我慢の記録ではなく、選び方が変わってきた記録に見えます。良い変化です。" });
  }
  if(w.score!=null && pw.score!=null && Math.abs(w.score-pw.score) <= 5 && w.score >= 65){
    cands.push({ key:"steady", tone:"praise", title:"2週続けて安定しています",
      body:"平均バランススコアが先週" + pw.score + "点、今週" + w.score + "点。高い週を出すことより、この「ぶれの小ささ」のほうがずっと難しく、ずっと価値があります。淡々と続いている証拠です。" });
  }
  if(w.score!=null && pw.score!=null && w.score - pw.score <= -8){
    cands.push({ key:"recover", tone:"advice", title:"数字は下がっても、記録は続いています",
      body:"平均スコアは先週の" + pw.score + "点から今週" + w.score + "点へ少し下がりました。こういう週は誰にでもあります。大事なのは、下がった理由がデータに残っていること。まずは明日の朝食と夕食の時刻、どちらかひとつだけ整え直しましょう。" });
  }
  if(!cands.length) return null;
  // 前日に出した観点は避ける

  const fresh = cands.filter(function(c){ return ydKeys.indexOf(c.key)<0; });

  const c = pool[(salt>>>3) % pool.length];
  const kept = (S.reviewHistory||[]).filter(function(h){ return h && h.date!==TODAY; });

function buildNotes(p, d, weekScores, ctx){

  if(ctx && milestones[ctx.totalDays]){
    notes.push({ tone:"praise", title:"記録" + milestones[ctx.totalDays] + "の節目です",

        (ctx.totalDays>=100

          : "食習慣の研究では、記録を続けること自体が行動変容のいちばんの推進力とされています。この調子で、無理なく積み重ねていきましょう。") });

  const facts = FACTS.filter(f => f.when(p,d,ctx));

    const pool1 = freshFacts.length ? freshFacts : facts;
    const f1 = pick(pool1, 1 + (saltBase % 997));
    const key1 = noteTopicKey(factText(f1));

    praiseToday.push({ date:TODAY, key:key1, open:open1, t:title1 });
    notes.push({ tone:"praise", title:title1,
      body: nameHead + open1 + factText(f1) + (f1.benefits[p.goal] || f1.benefits["default"]) });
    if(facts.length >= 2){
      let f2 = null;
      const scan = freshFacts.length>1 ? freshFacts : facts;

        if(cand===f1) continue;

        notes.push({ tone:"praise", title:title2,
          body: open2 + factText(f2) + (f2.benefits[p.goal] || f2.benefits["default"]) });

    }

    const kept = (S.praiseHistory||[]).filter(function(h){ return h && h.date!==TODAY; });
    S.praiseHistory = kept.concat(praiseToday).slice(-8);

  }
  // 2) 複数日の記録から: 2週間のふりかえり（実測値を引用する特別コメント）
  const review = ctx ? weeklyReviewNote(p, ctx, saltBase) : null;
  if(review) notes.push(review);

      body: pick([
        "この7日間で、バランススコア70点以上の日が" + good + "日。「まずまずの日を増やす」食べ方ができています。この続け方が、数か月後のからだづくりにつながっていきます。",
        "今週は70点超えが" + good + "日。満点の1日より、合格点の" + good + "日のほうがずっと価値があります。食生活は平均点で決まる、というお手本のような週です。",
        "週間成績、70点以上が" + good + "日です。良い日を「たまたま」から「いつものこと」に変えられていますね。この安定感は、外食や旅行があっても崩れにくい体の土台になります。",
      ], 14 + (Math.floor(saltBase/13) % 997)) });
  }

  //    ・前置きと締め句は2件で同じものを使わない
  //    ・本文が「観察+理由+一手+締め」の合成式(composed)のときは、締め句を重ねない
  //    ・締め句は本文の最後の文と言い回しが重ならないものを選ぶ
  const adv = selectAdvice(ADVICE.filter(a=>a.when(p,d)));
  rememberAdviceHistory(adv);
  const usedPrefix=[], usedSoftener=[];
  adv.forEach((a,i)=>{
    const aSalt = commentSalt(p,d,"advice|" + adviceKey(a) + "|" + i);
    const prefixes = STAGE_PREFIX[p.stage];
    let prefix = pick(prefixes, 3+i+(aSalt%997));
    if(usedPrefix.indexOf(prefix)>=0) prefix = prefixes[(prefixes.indexOf(prefix)+1) % prefixes.length];
    usedPrefix.push(prefix);
    const body = a.body(p,d);
    let softener = "";
    if(!a.composed){
      softener = pickSoftener(body, 5+i+(Math.floor(aSalt/17)%997), usedSoftener);
      usedSoftener.push(softener);
    }
    notes.push({ tone:"advice", title:a.title, body: prefix + body + softener });

  if(mealRecorded(d) && daySeed%3===0 && notes.length<4){
    const mon = now.getMonth();
    notes.push({ tone:"advice", title:"旬のひとこと（" + (mon+1) + "月）", body: pick(SEASONAL[mon], 12 + (Math.floor(saltBase/19)%997)) });
  }
  return notes.slice(0,4);
}
function buildNext(p,d){
  /* 優先度順に最大2件のおすすめを返す。
     ・完璧な日(汎用メッセージのみ該当)は1件にとどめ、
       具体的な助言があるときは汎用メッセージを2件目に混ぜない
     ・2件が同じテーマ(朝食×2、乳製品×2など)や似た言い回しに
       ならないよう、テーマと文面の重なりを見て選ぶ */
  const matched = NEXT.filter(x=>x.when(p,d)).sort((a,b)=>a.pri-b.pri);
  const out = [], topics = [];
  const saltBase = commentSalt(p,d,"next");
  for(let i=0;i<matched.length && out.length<2;i++){
    if(out.length===1 && matched[i].pri >= 9) break;
    const salt = out.length===0 ? 7 + (saltBase % 997) : 8 + (Math.floor(saltBase/23) % 997);
    const tx = pick(matched[i].v, salt);
    const tk = noteTopicKey(tx);
    if(out.length===1){
      if(tk!=="他" && topics.indexOf(tk)>=0) continue;
      if(commonRunLen(out[0], tx)>=12) continue;
    }
    topics.push(tk);
    out.push(tx);
  }
  return out.length ? out : null;
}


/* ============================================================

function getStreak(){

function totalRecordedDays(){

}
/* ============================================================
   健康偏差値（1〜99）※内部的にはレベル変数として保持
   画面上は詳細条件非公開（ブラックボックス）。内部ロジック:
   ・日次XP: 記録 + バランススコア + 朝食 + 21時前の夕食 + 副菜達成
            + 全グループ達成 + DVS + 体重記録 + 睡眠（1日最大43XP）
   ・連続記録倍率: 1.0〜1.5倍（14日連続で最大）
   ・週次ボーナス: 記録5日以上 / 朝食4日以上 / 早い夕食4日以上 /
            週DVS / 週平均睡眠 / 体重が目標方向に動いた週
            （週の定義は約束と同じ月曜はじまりに統一）
   ・レベル曲線: 必要累積XP = round(6.5 × L^1.8)
     提示表（Lv45=6147, Lv60=10318, Lv99=25413）と一致させる
   ・減点（Lv30以降）: レベル30以上のあいだは、未記録の日や
     不摂生な日（低スコア・朝食欠食・遅い夕食・副菜不足・DVS低値・
     控えたい間食・睡眠不足）に、XPが比例減衰する。ペナルティ率は
     急落しすぎないよう従来より緩め、降格時は肩書を「研究生」とする。
     ペナルティが高い日は獲得XPも25〜75%に抑え、記録だけの上昇を防ぐ。
     「最初は上がりやすく、上に行くほど健康的な生活の継続が必要で、
      続かなければ偏差値も肩書も落ちる。ただしLv30までは既得の足場」設計。
   ・到達目安: ほぼ完璧な生活で Lv99 まで約1年（実測ベース）
   ・関門レベル(GATES=10,18,30,45,60,75,95): 定期アセスメントを
     完了するまで表示レベルがそこで止まり、先に進めない
   XPは保存せず、毎回全記録から決定論的に再計算する（改ざん・
   ズレ防止。記録こそが唯一のレベル源泉）。

var GATES = [10,18,30,45,60,75,95];  // 院卒以降の各「昇進」に審査(定期アセスメント)を課す
var PENALTY_RATE = 0.004;             // pen6で0.4%/日相当。固定減点と併用し、急落を防ぎつつ降格可能性を残す
function dayXP(d,p){
  d = normalizeDay(d);
  if(!anyRecord(d)) return 0;
  var xp=0;
  if(recorded(d)) xp+=5;
  if(mealRecorded(d)){
    var sc=dayScore(d,p.targets);
    if(sc>=85) xp+=15; else if(sc>=70) xp+=10; else if(sc>=50) xp+=5;
    if(!d.meals.breakfast.skipped) xp+=2;
    if(!d.meals.dinner.skipped && d.meals.dinner.time<21) xp+=3;
    if(d.sv["副菜"]>=p.targets["副菜"]) xp+=3;
    if(Object.keys(p.targets).every(function(k){return d.sv[k]>=p.targets[k];})) xp+=6;
    if(dvsCount(d)>=7) xp+=2;   // 1日7種類以上(にぎやかな食卓)
  }
  if(d.weight!=="") xp+=2;
  if(sleepRecorded(d)){
    xp+=2;                                            // 睡眠を記録
    var sd=sleepDur(d.sleep);
    if(sd!=null && sd>=6 && sd<=9) xp+=3;             // 適正な睡眠時間
    if((d.sleep.awak||0)===0) xp+=2;                  // 中途覚醒なし
  }

}
/* --- Lv30以降の減点 ---
   XP獲得条件の裏返しをできるだけ対応させる。
   健康的な日（スコア50以上・朝食あり・21時前夕食・DVSが低すぎない・
   控えたい間食が少ない・睡眠6時間以上）は減点ゼロ。 */
function dayPenalty(d,p){
  d = normalizeDay(d);
  if(!d || !anyRecord(d)) return 6;            // 記録のない日
  var pen=0;
  if(mealRecorded(d)){
    var sc=dayScore(d,p.targets);
    if(sc<50) pen+=4;
    if(sc<35) pen+=2;
    if(d.meals.breakfast.skipped) pen+=2;
    if(!d.meals.dinner.skipped && d.meals.dinner.time>=21) pen+=2;
    if(d.sv["副菜"] < p.targets["副菜"]*0.5) pen+=2; // 副菜達成ボーナスの裏返し
    if(Object.values(d.sv||{}).filter(function(v){return Number(v||0)>0;}).length<=2) pen+=2; // 全群達成ボーナスの裏返し
    if(dvsUsed(d) && dvsCount(d)<3) pen+=2;     // DVS7種ボーナスの裏返し
    var sb=snackBurden(d);
    if(sb>=3) pen+=2; else if(sb>=1) pen+=1;
  } else {
    pen+=3;                                    // 補食・間食のみ等、食事の中身が見えない日
    var sbOnly=snackBurden(d);
    if(sbOnly>=3) pen+=4; else if(sbOnly>=1) pen+=2;
  }
  var sd=sleepDur(d.sleep);
  if(sd!=null && sd<6) pen+=2;
  return Math.min(pen,10);
}
function qualityXPFactor(pen){
  if(pen>=8) return 0.25;
  if(pen>=5) return 0.5;
  if(pen>=2) return 0.75;
  return 1;
}
function penaltyMult(L){
  if(L>=75) return 2.5;   // 名誉教授〜
  if(L>=60) return 2;     // 教授
  if(L>=45) return 1.5;   // 准教授
  return 1;               // 助教
}
function applyXPPenalty(xp, pen, lvlNow){
  if(lvlNow<30 || pen<=0) return xp;
  var floor = cumXP(29); // 助教から落ちた場合は「研究生」表示に入れる
  var excess = xp - floor;
  if(excess<=0) return xp;
  var fixed = pen>=8 ? 4 : (pen>=6 ? 3 : (pen>=3 ? 2 : 1));
  var loss = Math.round(excess * (pen/6) * PENALTY_RATE * penaltyMult(lvlNow)) + fixed;
  xp -= Math.max(1, loss);
  return Math.max(floor, xp);
}
function totalXP(){
  var p=S.profile; if(!p) return 0;
  var keys=Object.keys(S.days).sort();
  if(!keys.length) return 0;
  /* 1) 週ごとの集計（月曜はじまり。約束の週定義と統一） */
  var weeks={};
  keys.forEach(function(k){
    var d=normalizeDay(S.days[k]);
    var rec=anyRecord(d);
    var wi=Math.floor((Math.floor(new Date(k).getTime()/86400000)+3)/7);
    var w=weeks[wi]=weeks[wi]||{days:0,mealDays:0,bf:0,early:0,ws:[],dv:{},dvsUsed:false,sleepDurs:[]};
    if(rec){

      }

  });

    if(w.bf>=4) b+=10;
    if(w.early>=4) b+=10;
    var dvsW=DVS_GROUPS.filter(function(g){return (w.dv[g.id]||0)>=6;}).length;
    if(dvsW>=7) b+=15; else if(dvsW>=5) b+=8;   // 週の多様性ボーナス
    if(w.sleepDurs.length>=4){
      var avg=w.sleepDurs.reduce(function(a,x){return a+x;},0)/w.sleepDurs.length;
      if(avg>=6 && avg<=9) b+=12;               // 週平均が適正な睡眠時間
    }
    if(pv && w.ws.length>=2 && pv.ws.length>=2){
      var m=function(a){return a.reduce(function(x,y){return x+y;},0)/a.length;};
      var diff=m(w.ws)-m(pv.ws);
      if(p.goal==="loss" && diff<=-0.05 && diff>=-1) b+=20;
      else if(p.goal==="gain" && diff>=0.05 && diff<=1) b+=20;

    if(w.mealDays>=4){
      if(w.bf<=2) pen+=2;                          // 朝食4日ボーナスの裏返し
      if(w.early<=2) pen+=2;                       // 早い夕食4日ボーナスの裏返し
    }
    if(w.dvsUsed){
      var dvsW=DVS_GROUPS.filter(function(g){return (w.dv[g.id]||0)>=6;}).length;
      if(dvsW<3) pen+=3; else if(dvsW<5) pen+=1;   // 週DVS7/5点ボーナスの裏返し
    }
    if(w.sleepDurs.length>=4){
      var avg=w.sleepDurs.reduce(function(a,x){return a+x;},0)/w.sleepDurs.length;
      if(avg<6 || avg>9) pen+=2;                   // 週平均睡眠ボーナスの裏返し
    }
    return Math.min(pen,8);
  }
  /* 2) 初記録日から今日まで1日ずつたどる時系列パス。
        Lv30(助教)以上のあいだだけ減点が働き、Lv30を割ると止まる。
        当日はまだ記録途中なので減点しない。 */
  var di0=Math.floor(new Date(keys[0]).getTime()/86400000);
  var diEnd=Math.floor(new Date(TODAY).getTime()/86400000);
  var xp=0, run=0, prevWi=null;
  for(var di=di0; di<=diEnd; di++){

    var d=normalizeDay(S.days[k]);
    var rec = d ? anyRecord(d) : false;

/* --- レシピ連動問題: 内蔵レシピ全品のSV換算から自動生成 ---
   ・単一グループのレシピ →「主菜およそ何SV？」の数量問題
   ・複数グループのレシピ →「どう数える？」の内訳(複合)問題
   ・料理名を覚える入口にもなり、解説からレシピタブへ飛べる */
let QUIZ_ALL_CACHE = null;
function quizBank(){
  if(QUIZ_ALL_CACHE) return QUIZ_ALL_CACHE;
  const GORDER = ["主食","副菜","主菜","乳製品","果物"];
  const fmt = function(v){ return String(v); };
  const comboStr = function(sv){ return GORDER.filter(function(g){return sv[g]>0;}).map(function(g){return g+fmt(sv[g]);}).join("・"); };
  const gen = [];
  RECIPES.forEach(function(r){
    const keys = GORDER.filter(function(g){ return r.v[g]>0; });
    if(!keys.length) return;
    const seed = stableHash("rq|" + r.n);
    if(keys.length===1){
      const g = keys[0], t = r.v[g];
      const cands = [t-1, t-0.5, t+0.5, t+1, t+1.5].filter(function(x){ return x>=0.5 && x!==t; });
      const d1 = cands[seed % cands.length];
      const rest = cands.filter(function(x){ return x!==d1; });
      const d2 = rest[(seed>>>4) % rest.length];
      const opts = [t,d1,d2].sort(function(a,b){return a-b;}).map(function(x){ return fmt(x)+"SV"; });
      gen.push({ g:g, rn:r.n,
        q:"レシピ問題:『" + r.n + "』(1人分)は、" + g + "およそ何SV？",
        c:opts, a:opts.indexOf(fmt(t)+"SV"),
        e:"『" + r.n + "』のSV換算は " + comboStr(r.v) + "(約" + r.k + "kcal)。内蔵レシピ全品にSVがついているので、迷ったらレシピで答え合わせできます。" });
    } else {
      const correct = comboStr(r.v);
      const mk = function(delta, ki){
        const sv = {}; keys.forEach(function(g){ sv[g]=r.v[g]; });
        const g = keys[ki % keys.length];
        sv[g] = Math.max(0.5, sv[g] + delta);
        return comboStr(sv);
      };
      const perturbs = [];
      for(let ki=0; ki<keys.length; ki++){ [1,-0.5,0.5,-1,1.5].forEach(function(dl){ perturbs.push([dl,ki]); }); }
      const uniq = [];
      for(let i=0; i<perturbs.length && uniq.length<2; i++){
        const idx = (seed + i*7) % perturbs.length;
        const s = mk(perturbs[idx][0], perturbs[idx][1]);
        if(s!==correct && uniq.indexOf(s)<0) uniq.push(s);
      }
      const opts = [correct, uniq[0], uniq[1]];
      const ord = seed % 3;
      const arranged = [opts[ord], opts[(ord+1)%3], opts[(ord+2)%3]];
      gen.push({ g:"複合", rn:r.n,
        q:"レシピ問題:『" + r.n + "』(1人分)は、どう数える？",
        c:arranged, a:arranged.indexOf(correct),
        e:"『" + r.n + "』のSV換算は " + correct + "(約" + r.k + "kcal)。複合的な料理はグループごとに分解して数えるのがコツです。" });
    }
  });
  QUIZ_ALL_CACHE = SVQUIZ.concat(gen);
  return QUIZ_ALL_CACHE;
}
/* 今日の3問を決める(日替わり・直近45問は再出題しない・グループを順繰りに)
   6グループ(5料理グループ+複合の難問)を1日3つずつ、2日で一巡する。
   各枠は「基本問題」と「レシピ問題」を日替わりで半々に混ぜる */
function pickTodaysQuizIds(){
  const bank = quizBank();
  const groups = ["主食","副菜","主菜","乳製品","果物","複合"];
  const recent = S.svQuizHistory || [];
  const ids = [];
  for(let k=0;k<3;k++){
    const g = groups[(daySeed*3 + k) % 6];
    const wantRecipe = stableHash(TODAY + "|svqsrc|" + g + "|" + k) % 2 === 1;
    const collect = function(rq){
      const pool = [];
      for(let i=0;i<bank.length;i++){
        if(bank[i].g===g && recent.indexOf(i)<0 && ids.indexOf(i)<0 && (!!bank[i].rn)===rq) pool.push(i);
      }
      return pool;
    };
    let pool = collect(wantRecipe);
    if(!pool.length) pool = collect(!wantRecipe);
    if(!pool.length){
      for(let i=0;i<bank.length;i++){ if(bank[i].g===g && ids.indexOf(i)<0) pool.push(i); }
    }
    ids.push(pool[stableHash(TODAY + "|svq|" + g + "|" + k) % pool.length]);
  }
  return ids;
}
function todaysQuizState(){
  const bad = S.svQuiz && Array.isArray(S.svQuiz.ids) && S.svQuiz.ids.some(function(i){ return !quizBank()[i]; });
  if(!S.svQuiz || S.svQuiz.date!==TODAY || !Array.isArray(S.svQuiz.ids) || bad){
    S.svQuiz = { date:TODAY, ids: pickTodaysQuizIds(), results: [] };
    save();
  }
  return S.svQuiz;
}
let svqFeedback = null;   // 直前に答えた問題の解説表示用(画面遷移で消える一時状態)
function svQuizCardHTML(){
  const st = todaysQuizState();
  const n = st.results.length;
  const stats = S.svQuizStats || { asked:0, correct:0 };
  const rate = stats.asked >= 5 ? Math.round(stats.correct/stats.asked*100) : null;
  let inner;
  if(svqFeedback){
    const q = quizBank()[svqFeedback.id];
    const okNow = svqFeedback.pick === q.a;
    inner =
      '<div style="font-size:13px;font-weight:700;line-height:1.8">' + esc(q.q) + '</div>' +
      '<div style="margin:8px 0 6px;font-size:15px;font-weight:900;color:' + (okNow ? 'var(--green)' : 'var(--ume)') + '">' +
        (okNow ? '○ 正解！' : '× おしい！ 正解は「' + esc(q.c[q.a]) + '」') + '</div>' +
      '<div style="font-size:12px;line-height:1.9;color:var(--ink);background:var(--pale);border-radius:10px;padding:10px 12px">' + esc(q.e) + '</div>' +
      (q.rn ? '<button class="recipe-go" id="svqRecipe" data-rname="' + esc(q.rn) + '">🍳 このレシピを見てみる</button>' : '') +
      '<button class="btn-main" id="svqNext" style="margin-top:10px;padding:10px;font-size:13px">' +
        (n < st.ids.length ? '次の問題へ（あと' + (st.ids.length - n) + '問）' : '今日のトレーニングを終える') + '</button>';

  } else {
    const q = quizBank()[st.ids[n]];
    inner =
      '<div style="font-size:10px;color:var(--sub);font-weight:700">第' + (n+1) + '問／' + st.ids.length + '問　【' + q.g + (q.rn?'・レシピ連動':'') + '】</div>' +
      '<div style="font-size:13px;font-weight:700;line-height:1.8;margin:6px 0 10px">' + esc(q.q) + '</div>' +
      q.c.map(function(c,ci){
        return '<button class="opt" data-svq="' + st.ids[n] + '" data-svqc="' + ci + '">' + esc(c) + '</button>';
      }).join("");
  }
  return secHTML("SVトレーニング") +
    '<div class="card" style="border-color:var(--green)">' +
      '<div style="font-size:11px;color:var(--sub);line-height:1.7;margin-bottom:10px">記録の精度は「1SVの目測」で決まります。基本問題と内蔵レシピ全品から、毎日3問の感覚合わせ。</div>' +
      inner +
    '</div>';
}

["間食","減塩"],"d":["yasai"],"v":{"副菜":0.5},"k":35,"i":"買うもの: 無塩トマトジュース1缶","r":"ジュース感覚でリコピンとカリウム。"},{"n":"大豆バー","s":1,"t":["間食","大豆"],"d":["daizu"],"v":{"主菜":0.5},"k":130,"i":"買うもの: 大豆バー1本","r":"小腹の時間のたんぱく質チャージ。"},{"n":"寒天ゼリー(カップ)","s":1,"t":["間食"],"d":[],"v":{"副菜":0},"k":30,"i":"買うもの: 寒天ゼリーカップ1個","r":"低カロリーで食物繊維もとれる甘味。"},{"n":"りんごチップス(ノンフライ)","s":1,"t":["間食","果物"],"d":["kudamono"],"v":{"果物":0.5},"k":90,"i":"買うもの: ノンフライのりんごチップス小袋","r":"スナック菓子の置き換えに。"},{"n":"豆乳(200ml無調整)","s":1,"t":["間食","大豆"],"d":["daizu"],"v":{"主菜":0.5},"k":110,"i":"買うもの: 無調整豆乳200ml","r":"甘い飲料の置き換え。きなこを足しても。"},{"n":"鯛のアクアパッツァ","s":4,"t":["主菜","魚"],"d":["sakana","yasai","abura"],"v":{"主菜":2,"副菜":1},"k":320,"i":"鯛切り身1切れ、あさり6個、ミニトマト5個、にんにく1/2片、オリーブ油大さじ1、白ワイン(または酒)50ml、水100ml、パセリ少々","r":"鯛は塩をふって10分おき、水気を拭く。にんにくを弱火の油で香らせ、鯛の皮目を焼きつけてから、あさり・トマト・ワイン・水を加えフタをして5分。こだわりは魚を「煮ない」こと。蒸気で火を通し、煮汁を最後にスプーンで回しかけると身がふっくら仕上がる。"},{"n":"鰆の幽庵焼き","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":240,"m":[12,1,2,3],"i":"鰆1切れ、しょうゆ・みりん・酒各大さじ1、ゆずの輪切り2枚","r":"調味料とゆずを合わせた「幽庵地」に鰆を30分漬ける。汁気を拭いて弱めの中火で両面を焼き、最後に漬け地をひと塗りして照りを出す。ゆずの香りを移す江戸時代からの技法で、魚嫌いの人ほど驚く上品さになる。"},{"n":"塩さばのエスカベッシュ","s":4,"t":["主菜","魚","副菜"],"d":["sakana","yasai","abura"],"v":{"主菜":2,"副菜":1},"k":340,"i":"塩さば半身、玉ねぎ1/4個、パプリカ1/4個、酢大さじ2、オリーブ油大さじ1、砂糖小さじ1、ローリエ1枚","r":"さばを焼いて、熱いうちに薄切り野菜と合わせたマリネ液に漬ける。洋風の南蛮漬けで、冷蔵で2日おいしくなる「翌日が本番」の料理。冷やして白ワインにも合う。"},{"n":"鮭の粕漬け焼き(自家製粕床)","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":250,"m":[11,12,1,2],"i":"生鮭1切れ、酒粕50g、味噌大さじ1/2、みりん大さじ1","r":"酒粕を調味料でのばした粕床に鮭を一晩漬ける。粕を軽くぬぐい、焦げやすいので弱火でじっくり焼く。麹の酵素で身がしっとり変わる、買った西京漬けとは別物の味。粕床は3回ほど使い回せる。"},{"n":"あじのなめろう薬味づくし","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":1.5},"k":180,"m":[5,6,7,8],"i":"刺身用あじ1尾分、味噌小さじ1、みょうが1個、大葉2枚、小ねぎ・生姜少々","r":"あじと味噌を包丁で粘りが出るまでたたき、薬味を混ぜ込む。漁師料理の本歌は「まな板をなめるほどうまい」が語源。残ったら焼いて「さんが焼き」に変身させる二度目の楽しみも。"},{"n":"いわしの梅煮 骨までやわらか","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":260,"m":[6,7,9,10],"i":"いわし2尾、梅干し1個、生姜薄切り3枚、しょうゆ・みりん・酒各大さじ1、水150ml","r":"頭と内臓を取ったいわしを、落としぶた(アルミホイルで可)をして弱火で40分煮る。梅のクエン酸が骨をやわらかくし、青魚の匂いも消す。圧力鍋がなくても時間が解決してくれる料理。"},{"n":"白身魚の昆布締め","s":4,"t":["主菜","魚","海藻"],"d":["sakana","kaiso"],"v":{"主菜":1.5},"k":150,"i":"刺身用白身魚(鯛・ひらめ等)80g、昆布2枚、酒少々、わさび適量","r":"酒で湿らせた昆布で刺身をはさみ、ラップで包んで冷蔵3時間。昆布のグルタミン酸が水分を引き出し、ねっとりした熟成の食感に変わる。買った刺身が料亭の味になる最小の手間。"},{"n":"たらのブランダード風","s":4,"t":["主菜","魚","いも"],"d":["sakana","imo","gyunyu"],"v":{"主菜":1.5,"副菜":1},"k":310,"m":[12,1,2],"i":"甘塩たら1切れ、じゃがいも1個、牛乳100ml、にんにく少々、オリーブ油小さじ2","r":"たらとじゃがいもを牛乳で煮て、フォークで粗くつぶしながら油を混ぜ込む。南仏の郷土料理で、パンにのせて焼いても美味。たらの塩気だけで味が決まるのが発見。"},{"n":"金目鯛の煮付け 霜降り仕立て","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":280,"m":[12,1,2,3],"i":"金目鯛1切れ、しょうゆ・みりん各大さじ1.5、酒50ml、砂糖小さじ1、水100ml、生姜3枚","r":"まず熱湯を魚に回しかける「霜降り」でくさみの元を流す。煮汁を先に煮立ててから魚を入れ、中火で8分。この二手間が料理店の煮魚との差の正体。"},{"n":"かつおの香ばしタタキ 自家製","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":200,"m":[4,5,9,10],"i":"刺身用かつおサク150g、塩少々、にんにく1/2片、ポン酢大さじ2、玉ねぎスライス1/4個分","r":"かつおに塩をして、煙が出るほど熱したフライパンで各面10秒ずつ焼き、氷水に取らず「焼き止め」のまま切る。水っぽくならず香ばしさが残る、産地流の食べ方。"},{"n":"牡蠣の昆布バター蒸し","s":4,"t":["主菜","魚"],"d":["sakana","kaiso"],"v":{"主菜":1.5},"k":180,"m":[12,1,2],"i":"加熱用牡蠣6個、昆布1枚、酒大さじ2、バター10g、小ねぎ少々","r":"昆布を敷いた小鍋に牡蠣と酒を入れ、フタをして中火3分。仕上げにバターをのせる。牡蠣は「縮む直前」で止めるのが極意で、ぷっくり感が別物になる。"},{"n":"ほたてのポワレ 焦がしバター醤油","s":4,"t":["主菜","魚"],"d":["sakana","abura"],"v":{"主菜":1.5},"k":220,"i":"刺身用ほたて4個、バター10g、しょうゆ小さじ1、レモン少々、小麦粉少々","r":"水気を徹底的に拭き、薄く粉をはたいて強火で片面1分半。返して30秒で取り出し、同じフライパンでバターを茶色になるまで焦がして醤油とレモンを合わせる。ソースの香ばしさの正体は「焦がし」にある。"},{"n":"さんまの梅肉ロール焼き","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":300,"m":[9,10,11],"i":"さんま(3枚おろし)1尾分、梅干し1個、大葉2枚、酒少々","r":"開いたさんまに梅肉と大葉を塗って巻き、楊枝で留めてトースターで12分。脂の強い秋刀魚を梅がさっぱり受け止める。切り口の渦巻きが食卓で歓声を呼ぶ。"},{"n":"鮭のしっとりオイル煮","s":4,"t":["主菜","魚"],"d":["sakana","abura"],"v":{"主菜":2},"k":330,"i":"生鮭1切れ、オリーブ油100ml(浸る量)、にんにく1片、ローズマリーまたはローリエ、塩小さじ1/3","r":"鮭に塩をして15分。小鍋に油と香味を入れ、ごく弱火(泡がぽつぽつ程度)で12分、中まで確実に火を通す。高温で焼かないと魚はパサつかない、という発見の料理。油は香味油として炒め物に再利用。"},{"n":"あさりの酒蒸し 香味ねぎ油","s":4,"t":["主菜","魚","汁物"],"d":["sakana"],"v":{"主菜":1},"k":120,"m":[3,4,5],"i":"あさり200g、酒50ml、長ねぎ10cm、ごま油小さじ2、生姜少々","r":"砂抜きしたあさりを酒で蒸し、口が開いたら火を止める。別の小鍋でねぎと生姜をごま油で熱し、ジュッと回しかける。「開いたら即止め」と「熱い香味油」の2点で居酒屋を超える。"},{"n":"いかと里芋の煮物 ゆず風味","s":4,"t":["主菜","魚","いも"],"d":["sakana","imo"],"v":{"主菜":1.5,"副菜":1},"k":260,"m":[10,11,12,1],"i":"するめいか1/2杯、里芋3個、だし200ml、しょうゆ・みりん各大さじ1、ゆず皮少々","r":"いかは最初にさっと煮て取り出し、その煮汁で里芋を煮る。里芋がやわらかくなったらいかを戻して1分。いかを煮続けない「出し入れ」が、やわらかさの決め手。"},{"n":"めかじきのソテー ケッパーバター","s":4,"t":["主菜","魚"],"d":["sakana","abura"],"v":{"主菜":2},"k":290,"i":"めかじき1切れ、小麦粉少々、バター10g、ケッパー小さじ1、レモン汁小さじ1、パセリ少々","r":"粉をはたいて中火で両面を焼き、取り出す。同じフライパンでバター・ケッパー・レモンを煮立てて回しかける。ケッパーひと瓶が「いつもの魚」を洋食店に変える調味料だと知る一皿。"},{"n":"すずきのポワレ 皮パリ仕立て","s":4,"t":["主菜","魚"],"d":["sakana","abura"],"v":{"主菜":2},"k":270,"m":[6,7,8],"i":"すずき1切れ、塩、オリーブ油大さじ1、ミニトマト4個、バジルまたは大葉","r":"皮目に塩をして10分、水気を拭く。冷たいフライパンに皮目から入れて中火、フライ返しで軽く押さえながら8割方皮側で火を通す。返して10秒。皮パリの秘密は「押さえ」と「皮側9割」。"},{"n":"さばの味噌煮 山椒仕立て","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":320,"m":[10,11,12,1,2],"i":"生さば1切れ、味噌大さじ1、砂糖大さじ1/2、酒50ml、水100ml、生姜3枚、粉山椒少々","r":"霜降りしたさばを、味噌の半量だけ入れた煮汁で7分煮て、残りの味噌を最後に溶く。味噌を二度に分けると香りが立つ。仕上げの山椒で味の輪郭が締まる。"},{"n":"えびのガーリックオイル焼き","s":4,"t":["主菜","魚"],"d":["sakana","abura"],"v":{"主菜":1.5},"k":230,"i":"殻付きえび6尾、にんにく1片、オリーブ油大さじ2、塩、鷹の爪少々","r":"えびは殻ごと背に切り込み。にんにくを弱火で香らせ、えびを殻ごと焼く。殻の香ばしさが最高のだしになるので、殻をむいてから焼くのはもったいない、という気付きの一品。"},{"n":"ぶりの塩焼き おろし添え 熟成風","s":4,"t":["主菜","魚"],"d":["sakana"],"v":{"主菜":2},"k":280,"m":[12,1,2],"i":"ぶり1切れ、塩小さじ1/3、大根5cm、すだちまたはレモン","r":"ぶりに塩をして冷蔵庫で3時間〜半日おく(ペーパーに包む)。水分が抜けて身が締まり、うまみが凝縮する簡易熟成。焼くだけなのに驚くほど味が濃くなる、干物の原理を応用した食べ方。"},{"n":"うなぎとごぼうの柳川風","s":4,"t":["主菜","魚","卵"],"d":["sakana","tamago"],"v":{"主菜":2},"k":380,"m":[6,7,8],"i":"うなぎ蒲焼1/2尾、ごぼう1/4本、卵1個、だし100ml、しょうゆ・みりん各小さじ2、三つ葉少々","r":"ささがきごぼうをだしで煮て、うなぎをのせ卵でとじる。半端に残った蒲焼が主役級に化ける江戸の知恵。土用の丑に一手間かける贅沢。"},{"n":"しっとり茹で鶏のよだれ鶏","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":290,"i":"鶏むね肉1/2枚、長ねぎの青い部分・生姜、たれ(しょうゆ大さじ1、酢大さじ1/2、ラー油・砂糖・すりごま・花椒少々)","r":"鶏が浸る湯を沸かし、火を止めてから鶏を入れフタをして30分放置。余熱調理でパサつき知らずに。花椒入りのたれが本場四川の「よだれが出るほど」の由来。茹で汁はスープに使える。"},{"n":"鶏もも肉のコンフィ風","s":4,"t":["主菜","肉"],"d":["niku","abura"],"v":{"主菜":2.5},"k":420,"i":"鶏もも肉1/2枚、塩小さじ1/2、オリーブ油(浸る量)、にんにく1片、ローリエ1枚","r":"鶏に塩をすり込み一晩。油に沈めてごく弱火で40分、中まで確実に火を通す。フランスの保存食の技法で、骨離れするほどのほろほろ感に。最後に皮目だけ強火で焼くと完璧。"},{"n":"鶏肉のバスク風煮込み","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1.5},"k":380,"i":"鶏もも肉1/2枚、パプリカ1/2個、玉ねぎ1/4個、トマト缶100g、にんにく・パプリカパウダー、オリーブ油小さじ2","r":"鶏を焼きつけ、野菜を炒めてトマトで20分煮る。パプリカパウダーが「いつものトマト煮」をスペイン・バスク地方の味に変える。パウダー1本の投資価値を知る料理。"},{"n":"手羽元の黒酢煮","s":4,"t":["主菜","肉","卵"],"d":["niku","tamago"],"v":{"主菜":2},"k":350,"i":"手羽元3本、ゆで卵1個、黒酢大さじ2、しょうゆ大さじ1.5、砂糖大さじ1、水150ml、生姜3枚","r":"手羽元を焼きつけてから調味料で25分煮る。黒酢の効果で骨からするっと身が外れ、冷めてもやわらかい。酢は「すっぱくするため」でなく「やわらかくするため」に使える、という発見。"},{"n":"塩豚のポトフ","s":4,"t":["主菜","肉","汁物","いも"],"d":["niku","yasai","imo"],"v":{"主菜":2,"副菜":2},"k":420,"m":[11,12,1,2],"i":"豚肩ロースかたまり150g、塩小さじ1/2(肉の2%)、キャベツ1/8個、にんじん1/2本、じゃがいも1個、ローリエ","r":"豚に塩をすり込み、ラップで包んで冷蔵2日。これが「塩豚」で、熟成でうまみが激増する。野菜と水からことこと40分。スープが澄んだ金色になったら成功の証。"},{"n":"豚ヒレのソテー りんごソース","s":4,"t":["主菜","肉","果物"],"d":["niku","kudamono"],"v":{"主菜":2,"果物":0.5},"k":320,"m":[10,11,12],"i":"豚ヒレ肉100g、りんご1/4個、バター10g、しょうゆ小さじ1、白ワインまたは酒大さじ1","r":"厚切りヒレを中火で両面2分ずつ焼き、アルミホイルで包んで5分休ませる。すりおろしりんごとバター醤油を同じフライパンで煮詰めてかける。「焼いたら休ませる」が肉汁を守る鉄則。"},{"n":"豚の生姜焼き 塩麹仕立て","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":380,"i":"豚ロース薄切り100g、塩麹大さじ1/2、おろし生姜小さじ1、玉ねぎ1/4個、みりん大さじ1","r":"豚を塩麹に15分漬けてから焼く。麹の酵素がたんぱく質を分解し、安い肉ほど効果がわかる。しょうゆの生姜焼きしか知らないと驚く、やさしい塩味の生姜焼き。"},{"n":"冷しゃぶの梅ごまだれ 氷締めなし","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1},"k":300,"m":[6,7,8],"i":"豚しゃぶ用100g、きゅうり1/2本、たれ(梅干し1個、すりごま大さじ1、めんつゆ大さじ1)","r":"豚は沸騰させない80℃程度の湯でゆで、氷水に取らずザルで冷ます。冷水で締めると脂が固まって硬くなるため。「冷しゃぶは常温がやわらかい」は知る人ぞ知るコツ。"},{"n":"牛ステーキ 休ませ焼き","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2.5},"k":420,"i":"牛ステーキ肉150g、塩・粗びきこしょう、油小さじ1、バター5g、わさびまたはおろし大根","r":"肉は焼く30分前に冷蔵庫から出して常温に。強火で片面1分半ずつ、その後ホイルに包んで焼いた時間と同じだけ休ませる。切って出る肉汁が皿に流れないのは「休ませ」のおかげ。わさび醤油が牛の甘みを引き出す。"},{"n":"牛肉の赤ワイン煮 小鍋仕立て","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1},"k":450,"m":[11,12,1,2],"i":"牛すね肉または切り落とし120g、玉ねぎ1/2個、にんじん1/3本、赤ワイン150ml、トマトペースト小さじ1、はちみつ小さじ1","r":"肉に焼き色をつけ、野菜とワインで弱火1時間(切り落としなら20分)。はちみつ少量が渋みを丸くする隠し味。安いワインで十分、というのが最大の発見。"},{"n":"ラムチョップのハーブグリル","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":330,"i":"ラムチョップ2本、にんにく1/2片、ローズマリー1枝、オリーブ油小さじ2、塩・こしょう","r":"ラムを油とハーブで30分マリネし、強めの中火で両面2分ずつ。中はほんのりピンクが食べ頃。羊は臭いという先入観が、鮮度とハーブで覆る。鉄分・ビタミンB群の宝庫でもある。"},{"n":"鶏レバーの赤ワイン煮","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":1.5},"k":200,"i":"鶏レバー100g、赤ワイン50ml、しょうゆ・みりん各大さじ1、砂糖小さじ1、生姜3枚","r":"レバーは牛乳に10分浸してくさみを抜き、調味料で汁気がなくなるまで7〜8分煮る。鉄分補給の最強食材が、ワインの香りで洋風の常備菜に。ふわっと火を通しすぎないのが柔らかさの鍵。"},{"n":"スペアリブのマーマレード煮","s":4,"t":["主菜","肉"],"d":["niku","kudamono"],"v":{"主菜":2.5},"k":480,"i":"豚スペアリブ2本、マーマレード大さじ2、しょうゆ大さじ1.5、酒50ml、水100ml、にんにく1片","r":"リブを焼きつけ、全材料で30分煮る。マーマレードの糖とペクチンで照りととろみが自然につき、柑橘の苦みが脂を切る。ジャムは「パンに塗るもの」だけではない、という定番の裏技。"},{"n":"鶏むねのピカタ チーズ衣","s":4,"t":["主菜","肉","卵","乳製品"],"d":["niku","tamago","gyunyu"],"v":{"主菜":2},"k":340,"i":"鶏むね肉1/2枚、小麦粉、卵1/2個、粉チーズ大さじ1、バター5g","r":"そぎ切りにしたむね肉に粉→チーズ入り卵液の順で衣をつけ、弱めの中火で焼く。卵の衣が水分を閉じ込めるので、むね肉がしっとり。イタリアの家庭の知恵。"},{"n":"本格麻婆豆腐 花椒香る","s":4,"t":["主菜","肉","大豆"],"d":["niku","daizu"],"v":{"主菜":2},"k":380,"i":"木綿豆腐200g、豚ひき肉50g、豆板醤小さじ1、甜麺醤小さじ1、にんにく・生姜、鶏ガラ150ml、片栗粉、花椒粉たっぷり","r":"ひき肉を脂が透明になるまでしっかり炒める「肉そぼろの乾煎り」が本場の第一歩。豆腐は塩少々の湯で下ゆですると崩れずすが入らない。仕上げの花椒で舌が痺れてこそ麻婆(マー=痺れ)。"},{"n":"甜麺醤から作る回鍋肉","s":4,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":2,"副菜":1.5},"k":420,"i":"豚バラ薄切り100g、キャベツ2枚、ピーマン1個、長ねぎ1/4本、甜麺醤大さじ1、豆板醤小さじ1/2、しょうゆ少々","r":"豚を一度ゆでてから炒めるのが「回鍋(鍋に戻す)」の意味。余分な脂が落ち、味もからみやすくなる。市販の合わせ調味料を卒業すると、甘さも辛さも自分好みにできる。"},{"n":"豚肉と白菜の重ね蒸し 昆布だし","s":4,"t":["主菜","肉"],"d":["niku","yasai","kaiso"],"v":{"主菜":2,"副菜":1.5},"k":340,"m":[12,1,2],"i":"豚バラ薄切り100g、白菜3枚、昆布1枚、酒大さじ2、ポン酢適量","r":"白菜と豚を交互に重ねて切り、昆布を敷いた鍋に立てて詰める。酒をふってフタをし弱火12分。水を入れないのに驚くほどスープが出る。白菜の水分だけで蒸す「無水調理」の入門編。"},{"n":"鴨むねのロースト バルサミコ","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":380,"m":[11,12,1],"i":"鴨むね肉(合鴨ロース用)120g、塩、バルサミコ酢大さじ1、はちみつ小さじ1、しょうゆ小さじ1/2","r":"皮目に格子の切り込みを入れ、冷たいフライパンに皮から。弱火で脂をじっくり出しながら8分、返して2分、ホイルで10分休ませる。鴨は脂を「出しながら」焼く肉。年末の特売合鴨が主役になる。"},{"n":"牛すじの味噌煮込み","s":4,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":1.5},"k":300,"m":[11,12,1,2],"i":"下ゆで済み牛すじ100g、大根1/4本、こんにゃく1/2枚、味噌大さじ1.5、みりん大さじ1、だし300ml","r":"牛すじと大根をだしで30分、味噌を加えてさらに15分。コラーゲンがとろけて煮汁が冷めると煮こごりになる。どて煮の家庭版で、七味と小ねぎは必須。"},{"n":"鶏つくねの月見照り焼き れんこん入り","s":4,"t":["主菜","肉","卵"],"d":["niku","tamago"],"v":{"主菜":2},"k":360,"m":[10,11,12],"i":"鶏ひき肉100g、れんこん3cm(粗みじん)、長ねぎ・生姜、卵黄1個、しょうゆ・みりん各大さじ1","r":"れんこんの半分をすりおろして「つなぎ」、半分を粗く刻んで「食感」に使う二刀流。焼いてたれをからめ、卵黄をつけて。居酒屋の人気メニューの食感の正体はれんこんの使い分け。"},{"n":"自家製煮豚と半熟味玉","s":4,"t":["主菜","肉","卵"],"d":["niku","tamago"],"v":{"主菜":2.5},"k":450,"i":"豚肩ロースかたまり200g、卵1個、しょうゆ50ml、みりん50ml、酒50ml、水100ml、長ねぎの青い部分・生姜","r":"豚を全面焼きつけ、調味料で弱火40分。火を止めて煮汁ごと冷ます「余熱の戻り」で味がしみる。6分半ゆでの卵を冷めた煮汁に3時間。ラーメン屋の味玉が自宅で再現できると知る感動。"},{"n":"タンドリーチキン 一晩ヨーグルト","s":4,"t":["主菜","肉","乳製品"],"d":["niku","gyunyu"],"v":{"主菜":2},"k":340,"i":"鶏もも肉1/2枚、プレーンヨーグルト大さじ3、カレー粉小さじ2、ケチャップ大さじ1/2、にんにく・生姜、塩","r":"鶏をヨーグルトだれに一晩漬けてトースターまたはグリルで15分。乳酸菌の働きで肉質が変わるため、15分漬けとは別物になる。「漬け込み時間も調理」という考え方が身につく一品。"},{"n":"一番だしのだし巻き卵","s":4,"t":["主菜","卵"],"d":["tamago"],"v":{"主菜":1.5},"k":180,"i":"卵2個、かつお昆布だし50ml(卵の1/3量)、薄口しょうゆ数滴、みりん小さじ1/2、油","r":"だしの多さに驚く配合が料亭のふるふる食感の正体。強火で「半熟のうちに巻く」を繰り返し、形は巻きすかペーパーで整えれば十分。だしを取るところから作ると、香りの立ち方が違う。"},{"n":"スパニッシュオムレツ 野菜たっぷり","s":4,"t":["主菜","卵","いも"],"d":["tamago","yasai","imo"],"v":{"主菜":1.5,"副菜":1},"k":320,"i":"卵2個、じゃがいも1/2個、玉ねぎ1/4個、パプリカ少々、オリーブ油大さじ1、塩","r":"薄切りじゃがいもと玉ねぎを油で「揚げ煮」のようにじっくり火を通し、卵と合わせて弱火で両面焼く。スペインでは具に火を通した油ごと卵に混ぜるのがコク出しの流儀。冷めてもおいしい。"},{"n":"冷やし茶碗蒸し 夏仕立て","s":4,"t":["主菜","卵","夜遅め"],"d":["tamago","sakana"],"v":{"主菜":1},"k":120,"m":[6,7,8],"i":"卵1個、だし150ml(卵の1.5倍)、薄口しょうゆ・みりん少々、えび1尾、枝豆・オクラ少々","r":"卵1:だし1.5の黄金比で、アルミホイルのフタをして弱火12分。氷水で冷やし、だしのジュレや薬味をのせる。「す」が入る原因は強火、それだけ。夏の来客の一品に。"},{"n":"揚げ出し豆腐 おろしあん","s":4,"t":["主菜","大豆"],"d":["daizu"],"v":{"主菜":1.5},"k":260,"i":"木綿豆腐200g、片栗粉、揚げ油、だし100ml、しょうゆ・みりん各小さじ2、大根おろし、おろし生姜","r":"豆腐は重しをして20分水切り、片栗粉をまぶして多めの油で「揚げ焼き」。カリッと衣にあんが染みる音まで含めて完成。水切りの丁寧さが揚げ物の成否を分けると学ぶ料理。"},{"n":"豆腐ステーキ きのこバター醤油","s":4,"t":["主菜","大豆"],"d":["daizu","abura"],"v":{"主菜":1.5},"k":280,"m":[9,10,11],"i":"木綿豆腐200g、小麦粉、しめじ・まいたけ計80g、バター10g、しょうゆ大さじ1/2、酒大さじ1","r":"しっかり水切りした豆腐に粉をはたき、両面をこんがり焼いて一度取り出す。同じフライパンできのこを「動かさず」焼き付けてからソースに。きのこは触らないほど香ばしくなる。"},{"n":"大豆と鶏のチリコンカン","s":4,"t":["主菜","大豆","肉"],"d":["daizu","niku","yasai"],"v":{"主菜":2,"副菜":1},"k":380,"i":"大豆水煮100g、鶏ひき肉50g、玉ねぎ1/4個、トマト缶100g、チリパウダー小さじ1、クミン少々","r":"ひき肉と玉ねぎを炒め、大豆とトマトで15分煮る。クミンを油で最初に温める「テンパリング」でスパイスの香りが開く。パンにもごはんにも合う、豆が主役のメキシコ料理。"},{"n":"高野豆腐の含め煮 卵とじ","s":4,"t":["主菜","大豆","卵"],"d":["daizu","tamago"],"v":{"主菜":1.5},"k":240,"i":"高野豆腐2枚、だし200ml、砂糖大さじ1/2、薄口しょうゆ小さじ2、卵1個、絹さや2枚","r":"高野豆腐は50℃の湯で戻し、押し洗いしてから含め煮に。じゅわっと広がるだしの量は戻し方で決まる。最後に卵でとじれば立派な主菜。精進料理の技が日常に生きる。"},{"n":"アスパラのビスマルク風","s":4,"t":["主菜","卵","副菜"],"d":["tamago","yasai","gyunyu"],"v":{"主菜":1,"副菜":1},"k":220,"m":[4,5,6],"i":"アスパラ4本、卵1個、粉チーズ大さじ1、オリーブ油、黒こしょう","r":"焼いたアスパラに、酢を入れた湯で作るポーチドエッグをのせ、チーズを削る。黄身を割ってソースにする「卵がソース」という発想がイタリア流。春の主役野菜の最高の食べ方。"},{"n":"炒り豆腐の五目仕立て","s":4,"t":["主菜","大豆","卵"],"d":["daizu","tamago","yasai"],"v":{"主菜":1.5,"副菜":0.5},"k":250,"i":"木綿豆腐150g、鶏ひき肉30g、にんじん・干し椎茸・絹さや、卵1/2個、しょうゆ・みりん、椎茸の戻し汁","r":"干し椎茸の戻し汁をだし代わりに使うのが味の深さの秘密。豆腐は炒めながら木べらで崩し、水分を飛ばしてから味付け。地味に見えて、常備菜の完成度がわかる一品。"},{"n":"卵黄の味噌漬け","s":4,"t":["主菜","卵","間食"],"d":["tamago"],"v":{"主菜":0.5},"k":80,"i":"卵黄2個、味噌100g、みりん大さじ1","r":"味噌床に窪みを作りガーゼ(またはペーパー)を敷いて卵黄を落とし、冷蔵2〜3日。ねっとりチーズのような珍味に変わる。ごはんにも日本酒にも。「漬けるだけで別物になる」発酵の面白さの入口。"},{"n":"鯛めし 炊飯器仕立て","s":4,"t":["主食","魚"],"d":["sakana"],"v":{"主食":2,"主菜":1.5},"k":480,"m":[3,4,5],"i":"米1合、鯛切り身1切れ、昆布1枚、酒大さじ1、薄口しょうゆ大さじ1、生姜千切り","r":"鯛は先に両面をこんがり焼いてから炊き込むのが最大のコツ。香ばしさが飯全体に移る。炊き上がったら身をほぐして混ぜ、三つ葉を散らす。祝いの席の味が炊飯器で完結。"},{"n":"あさりの和風ボンゴレ","s":4,"t":["主食","魚"],"d":["sakana"],"v":{"主食":2,"主菜":1},"k":420,"m":[3,4,5],"i":"スパゲッティ80g、あさり150g、にんにく1片、酒50ml、しょうゆ数滴、大葉2枚、オリーブ油大さじ1","r":"あさりの蒸し汁とゆで汁を乳化させるのがパスタ屋の「とろみ」の正体。フライパンを揺すって油と汁を白濁させる。しょうゆは香りづけの数滴だけ。貝のだしを味わう一皿。"},{"n":"きのこの炊き込みごはん 焦がし醤油","s":4,"t":["主食"],"d":["abura"],"v":{"主食":2,"副菜":1},"k":380,"m":[9,10,11],"i":"米1合、しめじ・まいたけ・椎茸計150g、しょうゆ大さじ1.5、酒大さじ1、バター5g","r":"きのこは炊き込む前にフライパンで「焼き付けて」から。水分が飛んで香りが凝縮し、べちゃっとしない。仕上げのバターひとかけが香りの橋渡しに。きのこは洗わない、も鉄則。"},{"n":"赤ワイン仕込みのミートソースパスタ","s":4,"t":["主食","肉"],"d":["niku","yasai"],"v":{"主食":2,"主菜":1.5,"副菜":1},"k":560,"i":"スパゲッティ80g、合いびき肉80g、玉ねぎ1/4個、にんじん少々、赤ワイン50ml、トマト缶150g、ローリエ","r":"ひき肉は「ほぐさず」ハンバーグのように焼き付けてから崩すと、肉の香ばしさが桁違いに。ワインを煮切ってからトマトで20分。ソースは冷凍で1ヶ月もつので倍量仕込みが賢い。"},{"n":"海南鶏飯(シンガポールチキンライス)","s":4,"t":["主食","肉"],"d":["niku"],"v":{"主食":2,"主菜":2},"k":520,"i":"米1合、鶏もも肉1/2枚、生姜・にんにく、長ねぎの青い部分、たれ(スイートチリまたはポン酢+ごま油)、きゅうり","r":"米の上に生の鶏をのせて一緒に炊くだけ、という発見の料理。鶏の脂とだしを米が全部吸う。東南アジアの屋台の看板メニューが炊飯器ひとつで再現できる。"},{"n":"豆乳カルボナーラ 和風仕立て","s":4,"t":["主食","卵","大豆"],"d":["tamago","daizu","niku"],"v":{"主食":2,"主菜":1},"k":480,"i":"スパゲッティ80g、卵1個、無調整豆乳50ml、ベーコン1枚、粉チーズ大さじ1、黒こしょう、めんつゆ数滴","r":"ソースはボウルで混ぜておき、火を止めた鍋で麺と和えるのが分離しない唯一の道。「カルボナーラは余熱の料理」と覚える。豆乳がクリームより軽く、和の香りに寄せてくれる。"},{"n":"牡蠣の炊き込みごはん","s":4,"t":["主食","魚"],"d":["sakana","kaiso"],"v":{"主食":2,"主菜":1},"k":420,"m":[12,1,2],"i":"米1合、加熱用牡蠣8個、昆布1枚、しょうゆ大さじ1、酒大さじ1、生姜千切り","r":"牡蠣は先に煮汁でさっと煮て取り出し、その煮汁で米を炊いて、蒸らしに牡蠣を戻す。二度火を通さないから縮まない。「具は後入れ」が海鮮炊き込みの共通原則と知る。"},{"n":"冷や汁ごはん 宮崎仕立て","s":4,"t":["主食","魚","大豆"],"d":["sakana","daizu"],"v":{"主食":1.5,"主菜":1,"副菜":1},"k":420,"m":[7,8],"i":"ごはん150g、あじの干物1/2枚(または鯖缶)、味噌大さじ1、すりごま大さじ2、豆腐50g、きゅうり・みょうが・大葉、冷水150ml","r":"味噌とごまをアルミホイルに塗り広げ、トースターで軽く焦がすのが本場の香ばしさ。冷水で溶いて具と合わせ、麦飯にかける。食欲のない日の最強の飛び道具。"},{"n":"スパイスから作るチキンカレー","s":4,"t":["主食","肉"],"d":["niku","yasai","gyunyu"],"v":{"主食":2,"主菜":2,"副菜":1},"k":580,"i":"ごはん150g、鶏もも肉100g、玉ねぎ1/2個、トマト1/2個、ヨーグルト大さじ2、クミン・コリアンダー・ターメリック各小さじ1/2、カイエン少々","r":"玉ねぎを「あめ色」まで15分炒める工程が味の8割。スパイス3種+辛味だけでルーなしのカレーが成立すると知ると、市販ルーの見え方が変わる。油と小麦粉が入らないぶん軽い。"},{"n":"フライパンパエリア 魚介の週末","s":4,"t":["主食","魚"],"d":["sakana","yasai"],"v":{"主食":2,"主菜":1.5,"副菜":1},"k":520,"i":"米0.5合(洗わない)、シーフードミックス100g、パプリカ1/4個、玉ねぎ1/4個、トマト1/4個、サフランまたはターメリック、水150ml","r":"米を洗わず、炒めてからスープを注いで「混ぜずに」中火12分。底のおこげ(ソカラット)こそがパエリアの華。フタなし炊きの緊張感も含めて週末のごちそう。"},{"n":"たけのこごはん 木の芽添え","s":4,"t":["主食"],"d":[],"v":{"主食":2,"副菜":1},"k":360,"m":[3,4,5],"i":"米1合、ゆでたけのこ100g、油揚げ1/2枚、薄口しょうゆ大さじ1、酒大さじ1、だし、木の芽(または粉山椒)","r":"たけのこは薄味のだしで下煮してから炊き込むと、えぐみが出ずに香りが立つ。春の香りの正体である木の芽を手のひらで「パン」と叩いてからのせる。この一叩きで香りが開く。"},{"n":"鴨南蛮風 鶏ねぎそば","s":4,"t":["主食","肉"],"d":["niku"],"v":{"主食":2,"主菜":1.5},"k":480,"m":[11,12,1,2],"i":"そば1束、鶏もも肉80g、長ねぎ1/2本、めんつゆ(ストレート)300ml、ゆず皮少々","r":"ねぎは焼き目がつくまでフライパンで焼いてからつゆへ。この「焼きねぎ」が鴨南蛮の香りの核心で、鶏でも十分に成立する。ゆずを最後に。年越しの格が上がる一杯。"},{"n":"トマトの丸ごとリゾット","s":4,"t":["主食","乳製品"],"d":["yasai","gyunyu"],"v":{"主食":1.5,"副菜":1,"乳製品":0.5},"k":380,"m":[7,8],"i":"米0.5合(洗わない)、トマト1個、コンソメ1/2個、水300ml、粉チーズ大さじ1、オリーブ油、バジル","r":"生米を油で炒め、スープを少しずつ足しながら15分。中央に置いたトマトを最後に崩して混ぜる。米の芯がわずかに残る「アルデンテ」は雑炊とリゾットの分岐点。"},{"n":"石焼き風ビビンバ フライパン仕立て","s":4,"t":["主食","肉","卵"],"d":["niku","tamago","yasai","daizu"],"v":{"主食":2,"主菜":1.5,"副菜":1.5},"k":560,"i":"ごはん150g、牛切り落とし60g、ほうれん草・にんじん・豆もやしのナムル、卵黄1個、コチュジャン、ごま油大さじ1","r":"ナムル3種を別々に和えるのが正統(まとめて和えると味がぼやける)。最後にフライパンにごま油とごはんを押しつけて「おこげ」を作る。混ぜる直前の見た目も味のうち。"},{"n":"桜えびと新玉ねぎのかき揚げ丼","s":4,"t":["主食","魚"],"d":["sakana"],"v":{"主食":2,"主菜":1,"副菜":0.5},"k":520,"m":[3,4,5],"i":"ごはん150g、桜えび大さじ3、新玉ねぎ1/4個、三つ葉、小麦粉大さじ3、冷水、天つゆ","r":"衣は「混ぜすぎない・冷たく」がサクサクの二大原則。具に粉をまぶしてから衣を絡めるとバラけない。春だけの桜えびの香りは、この一杯のためにある。"},{"n":"ガパオライス ホーリーバジル風","s":4,"t":["主食","肉","卵"],"d":["niku","tamago","yasai"],"v":{"主食":2,"主菜":1.5,"副菜":0.5},"k":520,"m":[6,7,8],"i":"ごはん150g、鶏ひき肉100g、パプリカ1/4個、バジル1パック、にんにく・鷹の爪、ナンプラー大さじ1/2、オイスターソース小さじ1、目玉焼き1個","r":"ひき肉は強火で焼き付けて「そぼろにしない」のがタイの屋台流。バジルは火を止めてから混ぜて香りを残す。半熟の目玉焼きを崩して混ぜて完成する設計の一皿。"},{"n":"はまぐりの潮汁 一番だし","s":4,"t":["汁物","魚","減塩"],"d":["sakana","kaiso"],"v":{"主菜":0.5},"k":60,"m":[2,3,4],"i":"はまぐり3個、昆布1枚、酒大さじ1、水250ml、三つ葉、薄口しょうゆ数滴","r":"貝は水から入れ、沸騰直前で昆布を抜き、口が開いたら即火を止める。塩はほぼ不要——貝の塩分だけで完成する、減塩の究極形。ひな祭りだけではもったいない椀物。"},{"n":"オニオングラタンスープ","s":4,"t":["汁物","乳製品"],"d":["gyunyu"],"v":{"副菜":1,"乳製品":0.5},"k":280,"m":[11,12,1,2],"i":"玉ねぎ1個、バター10g、コンソメ1/2個、水250ml、バゲット1枚、とけるチーズ20g","r":"玉ねぎを「あめ色」まで20分。焦げ付きは水を少し差して木べらでこそげる(これがうまみ)。チーズをのせたパンを浮かべてトースターへ。玉ねぎの甘さの限界を知るスープ。"},{"n":"根菜たっぷり豚汁 ごぼう香る","s":4,"t":["汁物","肉","いも"],"d":["niku","yasai","imo"],"v":{"主菜":1,"副菜":1.5},"k":280,"m":[11,12,1,2],"i":"豚バラ薄切り50g、ごぼう1/4本、大根・にんじん・里芋、味噌大さじ1、だし300ml、七味・小ねぎ","r":"豚とごぼうを最初にごま油で炒めるのが、店の豚汁の香りの正体。味噌は半分を煮込みに、半分を仕上げに入れる「二段仕込み」で香りを立たせる。一杯で主菜級の満足。"},{"n":"かぼちゃの焦がしバターポタージュ","s":4,"t":["汁物","乳製品"],"d":["yasai","gyunyu"],"v":{"副菜":1,"乳製品":0.5},"k":240,"m":[9,10,11],"i":"かぼちゃ150g、玉ねぎ1/4個、牛乳150ml、バター10g、塩","r":"バターを茶色まで焦がしてから野菜を炒めると、ナッツのような香りがスープの底に敷かれる。ミキサーがなければマッシャーで潰して「粗ごし」の食感もまた良し。"},{"n":"押し麦入りミネストローネ","s":4,"t":["汁物"],"d":["yasai","imo"],"v":{"副菜":1.5,"主食":0.5},"k":220,"i":"押し麦大さじ2、玉ねぎ・にんじん・セロリ・じゃがいも各少々、トマト缶100g、オリーブ油、ローリエ、粉チーズ","r":"野菜をすべて1cm角に切りそろえる、それ自体が味に効く(火の通りと口当たりが揃う)。押し麦のとろみで食べるスープに。イタリアの「畑のスープ」は具の几帳面さが決め手。"},{"n":"手羽元の参鶏湯風スープ","s":4,"t":["汁物","肉"],"d":["niku"],"v":{"主菜":1.5,"主食":0.5},"k":320,"m":[12,1,2],"i":"手羽元2本、米大さじ1、にんにく1片、生姜3枚、長ねぎ、なつめ・クコ(あれば)、水400ml、塩、ごま油数滴","r":"手羽元と生米を水から40分煮ると、米がとろけて白濁したスープに変わる。「米はとろみと甘みの調味料」という韓国の知恵。塩は食べる直前に自分で振るのが本場式。"},{"n":"じゃがいもの冷製ヴィシソワーズ","s":4,"t":["汁物","いも","乳製品"],"d":["imo","gyunyu"],"v":{"副菜":1,"乳製品":0.5},"k":220,"m":[6,7,8],"i":"じゃがいも1個、長ねぎ(白い部分)1/2本、バター5g、牛乳150ml、塩、あさつき","r":"ねぎをバターで「色づけずに」じっくり炒めるのが上品さの分かれ目。煮て潰して漉し、冷やす。冷たいスープは塩味を強く感じにくいので、味見は冷やしてから、が鉄則。"},{"n":"えびの殻のビスク風スープ","s":4,"t":["汁物","魚"],"d":["sakana","gyunyu"],"v":{"主菜":0.5,"乳製品":0.5},"k":180,"i":"えびの殻(むきえび調理の残り)5尾分、玉ねぎ1/4個、トマトペースト小さじ1、牛乳100ml、水150ml、バター5g","r":"捨てるはずの殻を炒めて煮出すと、高級スープの香りが立ち上がる。殻を潰しながら炒めるのがコツ。「だしは捨てる部位に宿る」を体感する、もったいない精神の極み。"},{"n":"けんちん汁 精進仕立て","s":4,"t":["汁物","大豆","いも","減塩"],"d":["daizu","imo","yasai"],"v":{"副菜":1.5,"主菜":0.5},"k":180,"m":[10,11,12],"i":"木綿豆腐100g、大根・にんじん・ごぼう・里芋、こんにゃく、ごま油小さじ2、昆布椎茸だし300ml、薄口しょうゆ","r":"豆腐を手で崩してごま油で野菜と炒めてから煮るのが「けんちん」の定義。動物性だしなしでこの深さが出るのは、炒め油と椎茸の力。建長寺の修行食が原点という由来ごと味わう。"},{"n":"黒酢の酸辣湯","s":4,"t":["汁物","卵","大豆"],"d":["tamago","daizu"],"v":{"主菜":1,"副菜":0.5},"k":160,"i":"卵1個、絹豆腐50g、椎茸2枚、たけのこ細切り、黒酢大さじ1、しょうゆ小さじ1、ラー油、片栗粉、鶏ガラ300ml","r":"とろみをつけてから溶き卵を「糸のように」流すのがふわふわの条件(とろみが卵を支える)。酢は火を止めてから。加熱すると酸味の角が飛んでしまう——酢の扱いの教科書のような一杯。"},{"n":"焼きなすの冷製 煮浸し","s":4,"t":["副菜","減塩"],"d":["yasai"],"v":{"副菜":1},"k":60,"m":[7,8,9],"i":"なす2本、だし100ml、薄口しょうゆ小さじ1、みりん小さじ1、生姜、かつお節","r":"なすは皮ごと黒焦げになるまで直火(またはグリル)で焼き、氷水で皮をむく。この「焼き」の煙の香りがごちそう。だしに浸して冷蔵2時間。夏の副菜の頂点のひとつ。"},{"n":"里芋の揚げ出し ゆずあん","s":4,"t":["副菜","いも"],"d":["imo"],"v":{"副菜":1.5},"k":180,"m":[10,11,12],"i":"里芋3個、片栗粉、揚げ油、だし100ml、しょうゆ・みりん各小さじ1、片栗粉(あん用)、ゆず皮","r":"里芋はレンジで下加熱してから片栗粉をまぶして揚げ焼きに。外カリ中とろの二重食感に、ゆず香るあんをまとわせる。居酒屋で頼むあの一品が家でできる。"},{"n":"春菊と柿の白あえ","s":4,"t":["副菜","果物","大豆"],"d":["yasai","kudamono","daizu"],"v":{"副菜":1,"果物":0.5},"k":140,"m":[10,11,12],"i":"春菊1/3束、柿1/4個、絹豆腐100g、練りごま小さじ2、砂糖小さじ1/2、薄口しょうゆ数滴","r":"水切りした豆腐を裏ごし(ざるで十分)し、練りごまと合わせた「あえ衣」で、ゆで春菊と柿をあえる。ほろ苦×甘いの組み合わせが料亭の秋の定番。果物は「デザート」だけではないという発見。"},{"n":"菜の花の辛子あえ 一番だし仕立て","s":4,"t":["副菜","減塩"],"d":["yasai"],"v":{"副菜":1},"k":40,"m":[2,3,4],"i":"菜の花1/2束、だし50ml、薄口しょうゆ小さじ1/2、練り辛子小さじ1/4","r":"菜の花は塩湯で30秒、すぐ冷水へ。だしに辛子を溶いた「辛子浸し地」で10分マリネする。ほろ苦さと辛子の刺激で春を先取りする、おひたしの最上級形。"},{"n":"キャロットラペ クミン風味","s":4,"t":["副菜"],"d":["yasai","kudamono"],"v":{"副菜":1},"k":90,"i":"にんじん1本、クミンシード小さじ1/4、レーズン大さじ1、酢大さじ1、オリーブ油大さじ1/2、塩、レモン汁","r":"クミンを乾煎りしてから混ぜると、いつものラペが異国の香りに変わる。にんじんは塩をして10分おき、水気を絞ってから調味。スパイスひとつで「進化する定番」の代表例。"},{"n":"蒸しなすの棒棒鶏風ごまだれ","s":4,"t":["副菜","大豆"],"d":["yasai","daizu"],"v":{"副菜":1},"k":110,"m":[7,8,9],"i":"なす2本、練りごま大さじ1、酢小さじ1、しょうゆ小さじ1、砂糖ひとつまみ、ラー油、小ねぎ","r":"なすはラップで包んでレンジ3分、粗熱が取れたら「手で裂く」。切るより味が絡む断面になる。練りごまだれは棒棒鶏の黄金比。肉なしでも満足の食べ応え。"},{"n":"玉ねぎの丸ごとロースト マリネ仕立て","s":4,"t":["副菜"],"d":["yasai"],"v":{"副菜":1},"k":100,"i":"玉ねぎ1個、オリーブ油大さじ1、バルサミコ酢(または酢+はちみつ)大さじ1、塩、タイムやローリエ(あれば)","r":"玉ねぎを皮ごと半分に切り、断面を下にしてトースターで25分。とろりと甘くなった断面に温かいマリネ液をかける。「玉ねぎは焼くと果物になる」を確かめる一品。"},{"n":"きのこの粒マスタードマリネ","s":4,"t":["副菜"],"d":["abura"],"v":{"副菜":1},"k":90,"m":[9,10,11],"i":"しめじ・エリンギ・まいたけ計150g、オリーブ油大さじ1、粒マスタード小さじ2、酢大さじ1、はちみつ小さじ1/2、塩","r":"きのこは「洗わず・触らず」強火で焼き付けて水分を飛ばしてから、熱いうちにマリネ液へ。冷蔵4日もつ常備菜で、パンにもワインにも肉の付け合わせにも化ける万能選手。"},{"n":"大人のポテトサラダ アンチョビ風味","s":4,"t":["副菜","いも"],"d":["imo","tamago"],"v":{"副菜":1.5},"k":220,"i":"じゃがいも1個、アンチョビ1枚、ゆで卵1/2個、玉ねぎスライス、オリーブ油小さじ2、酢小さじ1、黒こしょう","r":"じゃがいもが熱いうちに酢を打つ「下味」が、マヨネーズに頼らないポテサラの核心。刻んだアンチョビの塩気とうまみで味が決まる。居酒屋の「大人ポテサラ」の種明かし。"},{"n":"れんこんの黒酢きんぴら","s":4,"t":["副菜"],"d":[],"v":{"副菜":1},"k":110,"m":[11,12,1,2],"i":"れんこん5cm、ごま油小さじ2、黒酢大さじ1/2、しょうゆ小さじ1、砂糖小さじ1/2、鷹の爪","r":"れんこんは厚めの半月に切り、酢水にさらさず「そのまま」炒めるとホクホク感が残る(さらすとシャキシャキ)。食感は下ごしらえで選べる、という気付き。黒酢の照りが白飯泥棒。"},{"n":"白菜の即席柚子千枚漬け風","s":4,"t":["副菜","減塩"],"d":[],"v":{"副菜":1},"k":30,"m":[12,1,2],"i":"白菜(芯に近い部分)2枚、塩(白菜の2%)、酢大さじ1、砂糖小さじ1、ゆず皮と果汁少々、昆布3cm","r":"白菜の白い部分をそぎ切りにし、重さの2%の塩で30分。水気を絞って甘酢とゆず、細切り昆布で一晩。「2%の塩」を覚えると、あらゆる浅漬けが失敗しなくなる。"},{"n":"アボカドと豆腐のわさび白あえ","s":4,"t":["副菜","大豆"],"d":["daizu"],"v":{"副菜":1,"主菜":0.5},"k":160,"i":"アボカド1/2個、絹豆腐100g、わさび小さじ1/4、白だし小さじ1、すりごま大さじ1/2","r":"水切りした豆腐を泡立て器でクリーム状にし、わさびと白だしで調味してアボカドをあえる。「和のクリーム」としての豆腐の可能性に気付く一品。冷酒に合わせたい味。"},{"n":"鯛のごまだし茶漬け","s":4,"t":["朝食","主食","魚","夜遅め"],"d":["sakana"],"v":{"主食":1.5,"主菜":1},"k":340,"i":"ごはん150g、刺身用鯛4切れ、すりごま大さじ1、しょうゆ大さじ1/2、みりん少々、緑茶またはだし200ml、わさび","r":"鯛をごま醤油に10分漬けてごはんにのせ、まず半分はそのまま「漬け丼」で。残りに熱い茶をかけて二度目の味へ。愛媛の郷土食「鯛めし」の流儀で、一杯で二度おいしい設計。"},{"n":"一晩仕込みのフレンチトースト","s":4,"t":["朝食","主食","卵","乳製品"],"d":["tamago","gyunyu"],"v":{"主食":1.5,"乳製品":1,"主菜":0.5},"k":420,"i":"厚切り食パン1枚、卵1個、牛乳120ml、砂糖大さじ1/2、バター10g","r":"卵液に一晩浸すと、中心まで液が届いて「プリンを焼いた」ような別物になる。弱火でフタをして片面5分ずつ。朝は焼くだけ。前夜の3分が翌朝の格を決める。"},{"n":"中華粥 鶏だし仕立て","s":4,"t":["朝食","主食","肉","夜遅め"],"d":["niku"],"v":{"主食":1.5,"主菜":0.5},"k":280,"i":"米0.3合、鶏手羽先1本、生姜2枚、水500ml、塩、トッピング(ザーサイ・小ねぎ・ごま油)","r":"米を油少々でコーティングしてから炊くと、粒が花のように開く広東式。手羽先ごと40分、骨からだしが出る。トッピングで味変しながら食べ進む「育てる朝食」。"},{"n":"エッグベネディクト風マフィン","s":4,"t":["朝食","卵","乳製品"],"d":["tamago","gyunyu"],"v":{"主食":1,"主菜":1,"乳製品":0.5},"k":380,"i":"イングリッシュマフィン1個、卵1個、ハム1枚、簡易オランデーズ(卵黄1個、バター10g、レモン汁、塩)","r":"オランデーズソースは湯せんで卵黄を混ぜながらバターを少しずつ——分離との勝負がこの料理の醍醐味。ポーチドエッグは酢入りの湯で渦を作って落とす。休日の朝の最高到達点。"},{"n":"丸ごと焼きりんごのシナモン風味","s":4,"t":["間食","果物","乳製品"],"d":["kudamono","gyunyu"],"v":{"果物":1,"乳製品":0.5},"k":220,"m":[11,12,1,2],"i":"りんご1個、バター10g、砂糖大さじ1、シナモン、ヨーグルト大さじ2","r":"芯をくり抜いてバターと砂糖を詰め、トースターで30分。紅玉なら酸味が立って完璧。焼くと生食用とは別の果物になる。「加熱した果物」の世界への扉。"},{"n":"桃のコンポート 白ワイン香る","s":4,"t":["間食","果物"],"d":["kudamono"],"v":{"果物":1},"k":150,"m":[7,8],"i":"桃1個、白ワイン50ml、水100ml、砂糖大さじ1.5、レモン汁小さじ1","r":"湯むきした桃を弱火で8分、煮汁ごと冷やす。硬くて外れだった桃ほど、コンポートで真価を発揮する敗者復活の調理法。汁は炭酸で割れば桃のスカッシュに。"},{"n":"いちごの牛乳寒天 練乳がけ","s":4,"t":["間食","果物","乳製品"],"d":["kudamono","gyunyu"],"v":{"果物":0.5,"乳製品":1},"k":180,"m":[1,2,3,4],"i":"いちご5個、牛乳150ml、粉寒天小さじ1/2、砂糖大さじ1、練乳少々","r":"寒天は「沸騰させて2分」煮溶かさないと固まらない——ゼラチンとの最大の違い。常温で固まり、夏でも溶けない。いちごの断面を型の側面に貼ると断面美が生まれる。"},{"n":"抹茶の豆乳ブラマンジェ","s":4,"t":["間食","大豆"],"d":["daizu"],"v":{"主菜":0.5},"k":160,"i":"無調整豆乳200ml、抹茶小さじ1、砂糖大さじ1.5、片栗粉大さじ1.5、黒蜜またはきなこ","r":"片栗粉で作る「もちもちブラマンジェ」は、鍋ひとつ5分の和スイーツ。弱火で練り続け、重くなってから1分が食感の分かれ目。抹茶は砂糖とよく混ぜてから加えるとダマにならない。"},{"n":"鶏むねのレンジ塩蒸し ねぎだれ","s":2,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":220,"i":"鶏むね肉1/2枚、酒大さじ1、塩少々、小ねぎ・ごま油・ポン酢","r":"フォークで穴を開けた鶏に酒と塩をふり、ラップで600Wで3分+余熱5分。ねぎだれをかける。"},{"n":"豚こまとキャベツのレンジ重ね蒸し","s":2,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":1.5,"副菜":1},"k":280,"i":"豚こま80g、キャベツ2枚、酒大さじ1、ポン酢適量","r":"ちぎったキャベツの上に豚を広げ、酒をふってラップで600Wで4分。ポン酢で。"},{"n":"サラダチキンのバンバンジー風","s":2,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":1.5,"副菜":0.5},"k":200,"i":"サラダチキン1/2個、きゅうり1/2本、すりごま・ポン酢・ラー油","r":"裂いたチキンと細切りきゅうりに、ごまだれをかけるだけ。"},{"n":"豚ひき肉ともやしのレンジ味噌蒸し","s":2,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":1.5,"副菜":0.5},"k":250,"i":"豚ひき肉80g、もやし1/2袋、味噌小さじ2、みりん小さじ2","r":"もやしの上にひき肉と調味料を広げ、ラップで600Wで4分、よく混ぜる。"},{"n":"鶏ももの照りマヨグリル","s":2,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":2},"k":330,"i":"鶏もも肉1/2枚、しょうゆ・みりん各大さじ1/2、マヨネーズ小さじ1","r":"たれをからめた鶏をトースターで15分。マヨのコクで冷めてもおいしい。"},{"n":"ウインナーとブロッコリーのレンジ蒸し","s":2,"t":["主菜","肉"],"d":["niku","yasai"],"v":{"主菜":1,"副菜":1},"k":240,"i":"ウインナー3本、冷凍ブロッコリー80g、粒マスタード","r":"耐熱皿に並べてラップで600Wで2分30秒。マスタードを添える。"},{"n":"豚ロースのレンジしゃぶ おろしポン酢","s":2,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":1.5},"k":230,"i":"豚ロース薄切り80g、大根5cm、ポン酢、酒大さじ1","r":"豚を重ならないよう皿に広げ酒をふり、ラップで600Wで2分30秒。おろしポン酢で。"},{"n":"焼き鳥缶と長ねぎのレンジ蒸し","s":2,"t":["主菜","肉"],"d":["niku"],"v":{"主菜":1},"k":180,"i":"焼き鳥缶(たれ)1缶、長ねぎ1/2本、七味","r":"斜め切りのねぎに缶を汁ごとのせ、ラップで600Wで2分。"},{"n":"ハムエッグのカリカリ仕立て","s":2,"t":["主菜","肉","卵","朝食"],"d":["niku","tamago"],"v":{"主菜":1.5},"k":220,"i":"ハム2枚、卵1個、油少々、黒こしょう","r":"ハムの縁がカリッとするまで焼いてから卵を割り入れ、フタをして半熟に。"},{"n":"鶏ささみの梅しそレンジ蒸し",
